<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ACTMOR 1</title>
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="application-name" content="ACTMOR 1" />
  <meta name="apple-mobile-web-app-title" content="ACTMOR 1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="app-icon.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f0ff;
      --surface: rgba(255, 255, 255, .9);
      --surface-soft: #f7f1fb;
      --ink: #151b2e;
      --muted: #746b84;
      --line: rgba(132, 92, 165, .16);
      --brand: #f06167;
      --brand-dark: #b83226;
      --blue: #7ab8ff;
      --green: #7cddb0;
      --violet: #8b5cf6;
      --pink: #f07bb5;
      --magenta: #ff5fa8;
      --shadow: 0 18px 46px rgba(96, 62, 134, .12);
      --shadow-soft: 0 8px 24px rgba(96, 62, 134, .10);
      --radius: 28px;
      --speed: 180ms;
    }

    * {
      box-sizing: border-box;
      font-family: "LINE Seed Sans TH", "Noto Sans Thai", "Helvetica Neue", Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(240, 123, 181, .30), transparent 23rem),
        radial-gradient(circle at 92% 8%, rgba(139, 92, 246, .22), transparent 25rem),
        radial-gradient(circle at 48% 18%, rgba(122, 184, 255, .16), transparent 26rem),
        linear-gradient(180deg, rgba(255, 255, 255, .84), rgba(250, 241, 255, .84)),
        var(--bg);
      padding: max(12px, env(safe-area-inset-top)) 12px calc(126px + env(safe-area-inset-bottom));
    }

    body.page-leaving .app {
      opacity: .14;
      transform: scale(.985) translateY(10px);
      filter: blur(8px);
    }

    body.page-leaving .floating-bottom-nav {
      opacity: .2;
      transform: translateX(-50%) translateY(16px) scale(.96);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform var(--speed) ease, background var(--speed) ease, box-shadow var(--speed) ease, opacity var(--speed) ease;
    }

    button:active {
      transform: scale(.97);
    }

    .app {
      width: min(940px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 12px;
      transition: opacity .28s ease, transform .28s ease, filter .28s ease;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .top {
      position: sticky;
      top: 8px;
      z-index: 10;
      padding: 13px 13px 13px 10px;
      display: grid;
      gap: 10px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .goodgood-link {
      min-height: 34px;
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--brand);
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(240, 97, 103, .18);
      box-shadow: var(--shadow-soft);
      text-decoration: none;
      font-size: 11px;
      line-height: 1;
      font-weight: 950;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .brand-logo {
      display: block;
      width: min(300px, 54vw);
      height: auto;
      max-height: 76px;
      object-fit: contain;
      object-position: left center;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 16px 16px 20px 16px;
      color: #fff;
      background: linear-gradient(145deg, var(--brand-dark), var(--brand));
      box-shadow: 0 10px 20px rgba(184, 50, 38, .18);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 16px;
      line-height: .95;
      font-weight: 950;
      text-align: center;
    }

    .brand-copy {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .brand small,
    .status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1;
      letter-spacing: 0;
      font-weight: 950;
      color: var(--brand);
    }

    .live {
      min-width: 58px;
      min-height: 30px;
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      color: #23804d;
      background: rgba(232, 250, 238, .82);
      border: 1px solid rgba(54, 164, 97, .18);
      box-shadow: 0 10px 20px rgba(35, 128, 77, .08), inset 0 1px 0 rgba(255, 255, 255, .9);
      font-size: 12px;
      font-weight: 520;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .live::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4fc781;
      box-shadow: 0 0 0 3px rgba(79, 199, 129, .12);
    }

    body.is-loading .live {
      color: #1f65c7;
      background: rgba(237, 247, 255, .86);
      border-color: rgba(66, 126, 213, .18);
      box-shadow: 0 10px 20px rgba(66, 126, 213, .08), inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    body.is-loading .live::before {
      background: #69a8ff;
      box-shadow: 0 0 0 3px rgba(105, 168, 255, .14);
      animation: pulse 900ms ease-in-out infinite;
    }

    .loading-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 32px;
      min-height: 15px;
      justify-content: center;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .32;
      animation: bounceDot 780ms ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 120ms;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 240ms;
    }

    .top > .status {
      display: none;
    }

    .toolbar {
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    body.untimed-page .toolbar {
      grid-template-columns: minmax(0, 1fr);
    }

    body.untimed-page .segmented,
    body.untimed-page .actions,
    body.untimed-page #filterPanel {
      display: none !important;
    }

    .segmented,
    .tabs {
      padding: 4px;
      border-radius: 999px;
      background: rgba(232, 238, 247, .92);
      box-shadow: inset 0 1px 4px rgba(39, 55, 77, .08);
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-width: 176px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
    }

    .segmented button,
    .tab,
    .chip,
    .ghost-button,
    .primary-button {
      border: 0;
      min-height: 36px;
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .segmented button.active,
    .tab.active {
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(31, 51, 79, .12);
    }

    .search {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .72);
    }

    .search span {
      color: var(--muted);
      font-weight: 950;
    }

    .search input {
      width: 100%;
      min-width: 70px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 760;
    }

    .actions {
      display: flex;
      gap: 7px;
      justify-content: flex-end;
    }

    .ghost-button {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
    }

    .calendar-button {
      min-width: 44px;
      padding-inline: 0;
      font-size: 20px;
      line-height: 1;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .62)),
        linear-gradient(135deg, rgba(240, 123, 181, .18), rgba(139, 92, 246, .16));
    }

    .calendar-icon {
      width: 21px;
      height: 21px;
      border-radius: 7px;
      display: block;
      position: relative;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      box-shadow: inset 0 -5px 0 rgba(255, 255, 255, .22), 0 6px 12px rgba(139, 92, 246, .20);
    }

    .calendar-icon::before {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      top: 5px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 5px 0 rgba(255, 255, 255, .55);
    }

    .calendar-icon::after {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: -2px;
      height: 5px;
      border-radius: 999px;
      border-left: 2px solid #fff;
      border-right: 2px solid #fff;
      opacity: .9;
    }

    .primary-button {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--magenta), var(--violet));
      box-shadow: 0 10px 22px rgba(238, 130, 178, .24);
    }

    #pdfBtn {
      background: linear-gradient(135deg, var(--brand-dark), var(--brand));
      box-shadow: 0 10px 22px rgba(184, 50, 38, .22);
    }

    .filter-panel {
      position: relative;
      z-index: 30;
      overflow: visible;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      animation: slideIn var(--speed) ease both;
    }

    .filter-panel.hidden {
      display: none;
    }

    .filter-control {
      position: relative;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .68)),
        linear-gradient(135deg, rgba(240, 123, 181, .12), rgba(139, 92, 246, .10));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      min-width: 0;
      cursor: pointer;
    }

    .filter-symbol {
      width: 24px;
      height: 24px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      flex: 0 0 auto;
      box-shadow: 0 6px 12px rgba(139, 92, 246, .16);
    }

    .date-icon {
      width: 24px;
      height: 24px;
      border-radius: 9px;
      background:
        linear-gradient(#fff, #fff) 6px 8px / 12px 2px no-repeat,
        linear-gradient(#fff, #fff) 6px 13px / 5px 2px no-repeat,
        linear-gradient(#fff, #fff) 13px 13px / 5px 2px no-repeat,
        linear-gradient(135deg, var(--pink), var(--violet));
    }

    .date-icon::before {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      top: 4px;
      height: 3px;
      border-left: 2px solid #fff;
      border-right: 2px solid #fff;
      opacity: .95;
    }

    .date-value,
    .sort-button {
      min-width: 0;
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      outline: 0;
      font-size: 14px;
      font-weight: 820;
      appearance: none;
      -webkit-appearance: none;
    }

    .date-value,
    .sort-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      cursor: pointer;
    }

    .sort-control {
      position: relative;
      padding-right: 34px;
    }

    .segmented,
    .tabs {
      background: rgba(255, 255, 255, .66);
      border: 1px solid rgba(255, 255, 255, .8);
      box-shadow: 0 14px 28px rgba(60, 46, 90, .08), inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .segmented button,
    .tab,
    .ghost-button,
    .primary-button,
    .filter-control,
    .room-arrow {
      border: 1.5px solid rgba(126, 98, 176, .18);
      background: linear-gradient(180deg, rgba(249, 244, 255, .96), rgba(237, 230, 255, .88));
      color: #6742c2;
      box-shadow: 0 12px 24px rgba(78, 58, 120, .08), inset 0 1px 0 rgba(255, 255, 255, .92);
    }

    .segmented button.active,
    .tab.active {
      color: #1f65c7;
      background: linear-gradient(180deg, rgba(237, 247, 255, .98), rgba(214, 234, 255, .9));
      border-color: rgba(66, 126, 213, .24);
      box-shadow: 0 15px 28px rgba(66, 126, 213, .14), 0 0 0 3px rgba(66, 126, 213, .08), inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .primary-button {
      color: #23804d;
      background: linear-gradient(180deg, rgba(226, 250, 236, .98), rgba(200, 244, 222, .9));
      border-color: rgba(43, 173, 103, .25);
      box-shadow: 0 16px 30px rgba(35, 128, 77, .14), inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    #pdfBtn {
      color: #b8323c;
      background: linear-gradient(180deg, rgba(255, 235, 237, .98), rgba(255, 210, 216, .92));
      border-color: rgba(218, 68, 85, .34);
      box-shadow: 0 16px 30px rgba(184, 50, 60, .16), inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .ghost-button,
    .calendar-button {
      color: #b87a0d;
      background: linear-gradient(180deg, rgba(255, 248, 224, .98), rgba(255, 236, 184, .9));
      border-color: rgba(223, 161, 45, .25);
      box-shadow: 0 14px 26px rgba(184, 122, 13, .1), inset 0 1px 0 rgba(255, 255, 255, .94);
    }

    .search,
    .filter-control {
      border-radius: 999px;
      background: rgba(255, 255, 255, .76);
      border: 1.5px solid rgba(255, 255, 255, .8);
      box-shadow: 0 12px 26px rgba(31, 45, 70, .08), inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    body {
      --surface: rgba(255, 255, 255, .72);
      --surface-soft: rgba(255, 255, 255, .58);
      --ink: #263143;
      --muted: #718094;
      --line: rgba(111, 132, 156, .16);
      --shadow: 0 18px 44px rgba(55, 72, 92, .09);
      --shadow-soft: 0 9px 22px rgba(55, 72, 92, .07);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .58), rgba(255, 255, 255, .76)),
        url("m1-dashboard-bg.webp") center / cover no-repeat fixed;
      font-weight: 520;
    }

    .card {
      background: rgba(255, 255, 255, .72);
      border-color: rgba(255, 255, 255, .72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px) saturate(1.08);
    }

    .top {
      background: rgba(255, 255, 255, .66);
    }

    h1,
    .brand-copy strong,
    .metric-value,
    .room-count {
      font-weight: 760;
      letter-spacing: 0;
    }

    .goodgood-link,
    .live,
    .status,
    .segmented button,
    .tab,
    .chip,
    .primary-button,
    .ghost-button,
    .date-value,
    .sort-button,
    .tag,
    .count-badge,
    .room-name,
    .student-name,
    .empty {
      font-weight: 650;
    }

    .search input,
    .student-meta,
    .metric-label,
    .history-date,
    .card p,
    .brand small {
      font-weight: 480;
    }

    .segmented,
    .tabs,
    .search,
    .filter-control {
      background: rgba(255, 255, 255, .7);
      border-color: rgba(255, 255, 255, .76);
      box-shadow: 0 12px 26px rgba(55, 72, 92, .07), inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .segmented button,
    .tab,
    .chip,
    .filter-control,
    .room-arrow {
      color: #49718d;
      background: rgba(255, 255, 255, .42);
      border-color: rgba(92, 139, 174, .14);
      box-shadow: none;
    }

    .segmented button.active,
    .tab.active,
    .chip.active {
      color: #1f65c7;
      background: linear-gradient(180deg, rgba(237, 247, 255, .92), rgba(222, 238, 255, .84));
      border-color: rgba(66, 126, 213, .2);
      box-shadow: 0 10px 22px rgba(66, 126, 213, .11), inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .calendar-button {
      min-width: 52px;
      width: 52px;
      height: 52px;
      padding: 0;
      border-radius: 16px;
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
    }

    .calendar-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(180deg, #fff 0 36%, #f7f7f8 36% 100%);
      border: 1px solid rgba(32, 40, 54, .09);
      box-shadow: 0 12px 24px rgba(30, 37, 50, .14), inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .calendar-icon::before {
      content: attr(data-month);
      position: absolute;
      inset: 0 0 auto;
      height: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(180deg, #ff5a57, #f13f3e);
      border-radius: 13px 13px 0 0;
      font-size: 8px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: .3px;
      box-shadow: none;
    }

    .calendar-icon::after {
      content: attr(data-day);
      position: absolute;
      inset: 16px 0 0;
      display: grid;
      place-items: center;
      color: #2b2f36;
      border: 0;
      height: auto;
      font-size: 24px;
      line-height: 1;
      font-weight: 360;
      opacity: 1;
    }

    .sort-control::after {
      content: "";
      position: absolute;
      right: 13px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--violet);
      border-bottom: 2px solid var(--violet);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .sort-menu {
      position: absolute;
      z-index: 100;
      left: 0;
      right: 0;
      top: calc(100% + 7px);
      display: grid;
      gap: 6px;
      padding: 8px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 18px 34px rgba(96, 62, 134, .16);
    }

    .tabs,
    .room-nav,
    .panel {
      position: relative;
      z-index: 1;
    }

    .sort-menu.hidden {
      display: none;
    }

    .sort-option {
      border: 0;
      min-height: 38px;
      border-radius: 13px;
      padding: 7px 10px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      font-size: 14px;
      font-weight: 850;
    }

    .sort-option.active {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--violet));
    }

    .date-menu {
      position: absolute;
      z-index: 110;
      left: 0;
      top: calc(100% + 7px);
      width: min(320px, 82vw);
      padding: 10px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 18px 34px rgba(96, 62, 134, .16);
    }

    .date-menu.hidden {
      display: none;
    }

    .date-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .date-title {
      font-size: 14px;
      font-weight: 950;
      color: var(--ink);
    }

    .date-nav {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      color: var(--violet);
      background: var(--surface-soft);
      font-size: 18px;
      font-weight: 950;
    }

    .date-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .weekday {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 0;
    }

    .date-cell,
    .month-cell {
      border: 0;
      border-radius: 12px;
      min-height: 34px;
      color: var(--ink);
      background: transparent;
      font-size: 13px;
      font-weight: 900;
    }

    .date-cell.muted {
      opacity: .32;
      pointer-events: none;
    }

    .date-cell.active,
    .month-cell.active {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      box-shadow: 0 8px 18px rgba(139, 92, 246, .18);
    }

    .sort-menu,
    .date-menu {
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, .74);
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 22px 46px rgba(45, 66, 91, .13), inset 0 1px 0 rgba(255, 255, 255, .92);
      backdrop-filter: blur(18px) saturate(1.1);
    }

    .sort-menu {
      gap: 8px;
      padding: 10px;
    }

    .sort-option {
      min-height: 42px;
      border: 1px solid rgba(92, 139, 174, .12);
      border-radius: 999px;
      padding: 8px 14px;
      color: #49718d;
      background: rgba(255, 255, 255, .5);
      font-weight: 460;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8);
    }

    .sort-option.active {
      color: #1f65c7;
      background: linear-gradient(180deg, rgba(237, 247, 255, .95), rgba(222, 238, 255, .88));
      border-color: rgba(66, 126, 213, .22);
      box-shadow: 0 12px 24px rgba(66, 126, 213, .12), inset 0 1px 0 rgba(255, 255, 255, .94);
    }

    .date-menu {
      width: min(336px, 88vw);
      padding: 12px;
    }

    .date-head {
      margin-bottom: 10px;
      padding: 2px;
    }

    .date-title {
      color: #263143;
      font-weight: 560;
      letter-spacing: 0;
    }

    .date-nav {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(66, 126, 213, .16);
      color: #1f65c7;
      background: rgba(237, 247, 255, .86);
      box-shadow: 0 8px 18px rgba(66, 126, 213, .1), inset 0 1px 0 rgba(255, 255, 255, .92);
      font-weight: 430;
    }

    .date-grid,
    .month-grid {
      gap: 7px;
    }

    .weekday {
      color: #718094;
      font-weight: 460;
      font-size: 10.5px;
    }

    .date-cell,
    .month-cell {
      border: 1px solid rgba(92, 139, 174, .1);
      border-radius: 999px;
      color: #49718d;
      background: rgba(255, 255, 255, .46);
      font-weight: 450;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .82);
    }

    .month-cell {
      min-height: 38px;
    }

    .date-cell:not(.muted):hover,
    .month-cell:hover,
    .sort-option:hover {
      background: rgba(237, 247, 255, .78);
      border-color: rgba(66, 126, 213, .18);
    }

    .date-cell.active,
    .month-cell.active {
      color: #b8323c;
      background: linear-gradient(180deg, rgba(255, 235, 237, .98), rgba(255, 214, 220, .92));
      border-color: rgba(218, 68, 85, .26);
      box-shadow: 0 12px 24px rgba(184, 50, 60, .13), inset 0 1px 0 rgba(255, 255, 255, .95);
      font-weight: 640;
    }

    .sort-symbol::before {
      content: "";
      width: 13px;
      height: 11px;
      display: block;
      background:
        linear-gradient(#fff, #fff) left top / 13px 2px no-repeat,
        linear-gradient(#fff, #fff) left center / 9px 2px no-repeat,
        linear-gradient(#fff, #fff) left bottom / 5px 2px no-repeat;
    }

    .room-nav {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 38px;
      gap: 8px;
      align-items: center;
    }

    .room-arrow {
      min-width: 38px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      font-size: 20px;
      line-height: 1;
      font-weight: 950;
      display: grid;
      place-items: center;
    }

    .room-arrow:disabled {
      opacity: .38;
      cursor: default;
      transform: none;
    }

    .room-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 1px 1px 2px;
      scrollbar-width: none;
    }

    .room-strip::-webkit-scrollbar,
    .tabs::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      min-width: 70px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .82);
    }

    .chip.active {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      border-color: transparent;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26);
    }

    .panel {
      padding: 12px;
      min-height: 220px;
      animation: fadeLift var(--speed) ease both;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 950;
    }

    .bars,
    .behavior-grid,
    .student-list,
    .room-grid {
      display: grid;
      gap: 8px;
    }

    .bar-row {
      min-height: 42px;
      display: grid;
      grid-template-columns: minmax(92px, 150px) 1fr 42px;
      gap: 10px;
      align-items: center;
      padding: 5px 0;
    }

    .bar-name {
      min-width: 0;
      font-size: 14px;
      font-weight: 880;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-track {
      height: 12px;
      border-radius: 999px;
      background: rgba(118, 118, 128, .15);
      overflow: hidden;
    }

    .bar-track span {
      display: block;
      height: 100%;
      width: var(--w, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--violet));
      animation: grow 360ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .bar-count {
      color: var(--muted);
      text-align: right;
      font-size: 14px;
      font-weight: 950;
    }

    .unit-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
    }

    .student-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 72px;
      padding: 10px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      transition: transform var(--speed) ease, box-shadow var(--speed) ease;
      color: inherit;
      text-decoration: none;
    }

    .student-card:hover,
    .student-card:focus-visible,
    .room-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(17, 24, 39, .08);
    }

    .student-card:focus-visible {
      outline: 3px solid rgba(66, 126, 213, .24);
      outline-offset: 3px;
    }

    .student-main {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .student-name {
      min-width: 0;
      font-size: 16px;
      line-height: 1.15;
      font-weight: 950;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      min-height: 23px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      line-height: 1;
      font-weight: 850;
    }

    .tag.behavior {
      color: #063f77;
      background: rgba(105, 199, 242, .18);
    }

    .count-badge {
      min-width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--ink), #29344e);
      font-size: 22px;
      font-weight: 950;
    }

    .tracking-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .tracking-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .tracking-progress {
      display: grid;
      gap: 6px;
    }

    .tracking-bar {
      height: 12px;
      border-radius: 999px;
      background: rgba(118, 118, 128, .15);
      overflow: hidden;
    }

    .tracking-bar span {
      display: block;
      width: var(--w, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--violet));
      animation: grow 360ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .tracking-caption {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 850;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .round-badge {
      min-width: 70px;
      min-height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--ink), #29344e);
      font-size: 13px;
      line-height: 1.1;
      font-weight: 950;
      text-align: center;
      padding: 5px 8px;
    }

    .room-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .behavior-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 12px;
    }

    .behavior-card {
      border: 1px solid var(--line);
      text-align: left;
      min-height: 82px;
      padding: 10px;
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .behavior-card.active {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      border-color: transparent;
    }

    .behavior-name {
      min-width: 0;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 930;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .behavior-detail {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 850;
    }

    .behavior-card.active .behavior-detail {
      color: rgba(255, 255, 255, .72);
    }

    .behavior-count {
      flex: 0 0 auto;
      font-size: 26px;
      line-height: 1;
      font-weight: 950;
    }

    .back-button {
      border: 0;
      min-height: 34px;
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 13px;
      font-weight: 900;
    }

    .room-card {
      border: 1px solid var(--line);
      text-align: left;
      min-height: 92px;
      padding: 11px;
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      display: grid;
      gap: 10px;
      box-shadow: var(--shadow-soft);
    }

    .room-name {
      font-size: 15px;
      font-weight: 930;
    }

    .room-count {
      font-size: 32px;
      line-height: .9;
      font-weight: 950;
    }

    .room-card .bar-track {
      height: 8px;
    }

    .empty {
      min-height: 112px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(17, 24, 39, .18);
      border-radius: 16px;
      padding: 16px;
      font-weight: 850;
      background: rgba(255, 255, 255, .55);
    }

    .bottom-actions {
      display: flex;
      justify-content: flex-end;
    }

    .floating-bottom-nav {
      --active-index: 1;
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(88vw, 356px);
      height: 84px;
      padding: 10px 17px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(255, 255, 255, .94);
      box-shadow: 0 20px 48px rgba(42, 57, 82, .18), inset 0 1px 0 rgba(255, 255, 255, .96);
      backdrop-filter: blur(20px) saturate(1.25);
      transition: opacity .28s ease, transform .28s ease;
    }

    .floating-bottom-nav::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 10px;
      bottom: 10px;
      left: 17px;
      width: calc((100% - 34px - 20px) / 3);
      border-radius: 999px;
      background: rgba(255, 246, 247, .92);
      box-shadow: 0 11px 22px rgba(255, 124, 85, .12), inset 0 1px 0 rgba(255, 255, 255, .9);
      transform: translateX(calc(var(--active-index) * (100% + 10px)));
      transition: transform .38s cubic-bezier(.2, .86, .22, 1), box-shadow .28s ease;
    }

    .floating-bottom-nav a {
      position: relative;
      z-index: 1;
      height: 64px;
      min-width: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: transform .26s cubic-bezier(.2, .86, .22, 1);
    }

    .floating-bottom-nav img {
      max-width: 76px;
      max-height: 48px;
      object-fit: contain;
      filter: grayscale(1) saturate(0) opacity(.48) drop-shadow(0 5px 8px rgba(0, 0, 0, .08));
      transform: scale(.86);
      transition: filter .22s ease, transform .22s ease;
    }

    .floating-bottom-nav a[aria-current="page"] {
      transform: translateY(-2px);
    }

    .floating-bottom-nav a[aria-current="page"] img {
      filter: grayscale(0) saturate(1.08) opacity(1) drop-shadow(0 9px 12px rgba(255, 124, 85, .22));
      transform: scale(1.06);
    }

    .floating-bottom-nav a:focus-visible {
      outline: 3px solid rgba(240, 97, 103, .38);
      outline-offset: 3px;
    }

    h1,
    .brand-copy strong,
    .metric-value,
    .behavior-count,
    .room-count,
    .count-badge {
      font-weight: 760;
    }

    .goodgood-link,
    .live,
    .status,
    .segmented button,
    .tab,
    .chip,
    .primary-button,
    .ghost-button,
    .date-value,
    .sort-button,
    .tag,
    .room-name,
    .student-name,
    .back-button,
    .empty {
      font-weight: 640;
    }

    .search input,
    .student-meta,
    .metric-label,
    .behavior-detail,
    .brand small,
    .history-date {
      font-weight: 480;
    }

    body :where(button, input, select, a, .status, .tag, .student-name, .student-meta, .metric-label, .behavior-name, .behavior-detail, .room-name, .bar-name, .bar-count, .date-value, .sort-button, .chip, .tab) {
      font-weight: 460;
    }

    body :where(h1, h2, .metric-value, .behavior-count, .room-count, .count-badge) {
      font-weight: 640;
    }

    .filter-symbol {
      color: #1f65c7;
      background: rgba(237, 247, 255, .86);
      border: 1px solid rgba(66, 126, 213, .16);
      box-shadow: 0 8px 18px rgba(66, 126, 213, .08), inset 0 1px 0 rgba(255, 255, 255, .92);
    }

    .filter-symbol.date-icon {
      background:
        linear-gradient(#fff, #fff) 6px 9px / 12px 2px no-repeat,
        linear-gradient(#fff, #fff) 6px 14px / 5px 2px no-repeat,
        linear-gradient(#fff, #fff) 13px 14px / 5px 2px no-repeat,
        linear-gradient(180deg, #ff5a57, #f13f3e);
      border-color: rgba(218, 68, 85, .22);
      box-shadow: 0 8px 18px rgba(184, 50, 60, .1), inset 0 1px 0 rgba(255, 255, 255, .34);
    }

    .filter-symbol.date-icon::before {
      border-left-color: #fff;
      border-right-color: #fff;
    }

    .sort-symbol {
      background: rgba(237, 247, 255, .86);
    }

    .sort-symbol::before {
      background:
        linear-gradient(#1f65c7, #1f65c7) left top / 13px 2px no-repeat,
        linear-gradient(#1f65c7, #1f65c7) left center / 9px 2px no-repeat,
        linear-gradient(#1f65c7, #1f65c7) left bottom / 5px 2px no-repeat;
      opacity: .86;
    }

    .behavior-card {
      background: rgba(255, 255, 255, .58);
      border-color: rgba(92, 139, 174, .14);
      box-shadow: 0 10px 22px rgba(55, 72, 92, .06), inset 0 1px 0 rgba(255, 255, 255, .86);
    }

    .behavior-card.active {
      color: #1f65c7;
      background: linear-gradient(180deg, rgba(237, 247, 255, .94), rgba(222, 238, 255, .86));
      border-color: rgba(66, 126, 213, .22);
      box-shadow: 0 14px 28px rgba(66, 126, 213, .12), inset 0 1px 0 rgba(255, 255, 255, .94);
    }

    .behavior-name,
    .behavior-detail {
      font-weight: 440;
    }

    .behavior-count {
      font-weight: 560;
    }

    .behavior-card.active .behavior-detail {
      color: #5f7d9b;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeLift {
      from {
        opacity: .72;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes grow {
      from {
        transform: scaleX(.08);
        transform-origin: left;
      }
      to {
        transform: scaleX(1);
        transform-origin: left;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(.78);
        opacity: .55;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes bounceDot {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: .38;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      .top {
        top: 6px;
      }

      .toolbar {
        grid-template-columns: 1fr auto;
      }

      .search {
        grid-column: 1 / -1;
        order: 3;
      }

      .filter-panel {
        grid-template-columns: 1fr;
      }

      .room-nav {
        grid-template-columns: minmax(0, 1fr);
      }

      .room-arrow {
        display: none;
      }
    }

    @media (max-width: 430px) {
      body {
        padding-inline: 10px;
      }

      .top,
      .toolbar,
      .panel,
      .filter-panel {
        border-radius: 18px;
      }

      .segmented {
        min-width: 158px;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
        font-size: 14px;
      }

      .brand small {
        font-size: 11px;
      }

      .brand-logo {
        width: min(205px, 43vw);
        max-height: 58px;
      }

      .goodgood-link {
        max-width: 92px;
        min-height: 32px;
        padding-inline: 10px;
        justify-content: center;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 9.5px;
      }

      .tabs {
        grid-template-columns: repeat(4, max-content);
        overflow-x: auto;
      }

      .tab {
        min-width: 72px;
      }

      .bar-row {
        grid-template-columns: minmax(84px, 112px) 1fr 32px;
      }

      .room-grid {
        grid-template-columns: 1fr;
      }

      .behavior-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    .panel .bar-name,
    .panel .bar-count,
    .panel .unit-note {
      font-weight: 420 !important;
    }

    .panel .bar-name {
      color: #34475a;
    }

    .panel .bar-count {
      color: #718094;
    }

    .floating-bottom-nav {
      width: min(78vw, 306px);
      height: 68px;
      padding: 8px 14px;
      gap: 8px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      box-shadow: 0 16px 34px rgba(42, 57, 82, .15), inset 0 1px 0 rgba(255, 255, 255, .96);
    }

    .floating-bottom-nav::before {
      top: 8px;
      bottom: 8px;
      left: 14px;
      width: calc((100% - 28px - 16px) / 3);
      transform: translateX(calc(var(--active-index) * (100% + 8px)));
    }

    .floating-bottom-nav a {
      height: 52px;
    }

    .floating-bottom-nav img {
      max-width: 62px;
      max-height: 38px;
    }

    .floating-bottom-nav a[aria-current="page"] img {
      transform: scale(1.02);
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .toolbar,
      .filter-panel,
      .bottom-actions,
      .floating-bottom-nav {
        display: none !important;
      }

      .card {
        box-shadow: none;
        border-color: #ddd;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top card">
      <div class="title-row">
        <div class="brand">
          <img class="brand-logo" src="m1dd-logo-transparent.webp" alt="M1 ดี๊ดี ระบบข้อมูลสถิตินักเรียน">
        </div>
        <div class="top-actions">
          <div class="live" id="liveBadge">พร้อม</div>
        </div>
      </div>

      <div id="status" class="status">กำลังเตรียมข้อมูล</div>

          <button class="sort-option" type="button" data-sort="name-asc">เรียงตามชื่อ</button>

    <a href="index.html" data-index="0" aria-label="M1 Good Good">

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzQ8YCMoXcem6E64Eqfdbl-7ogx5mIfVor6kjV5xivy34xSjItMmU56rGVN6KhU-YAgiA/exec";
    const ROOMS = ["ALL", "ม.1/1", "ม.1/2", "ม.1/3", "ม.1/4", "ม.1/5", "ม.1/6", "ม.1/7", "ม.1/A", "ม.1/B"];
    const FALLBACK = {
      success: true,
      mode: "daily",
      total: 15,
      byType: {"สายเช้า": 4, "สายเที่ยง": 3, "สายพัก 10": 5, "ขาดแถวเที่ยง": 3, "เครื่องแต่งกาย": 4, "อื่น ๆ": 0},
      byRoom: {"ม.1/1": 2, "ม.1/2": 1, "ม.1/3": 1, "ม.1/4": 0},
      topStudents: [
        {fullName: "ชื่อ - สกุล", room: "ม.1/1", number: "12", studentId: "10001", count: 3, behaviorType: "สายเที่ยง"},
        {fullName: "ชื่อ - สกุล", room: "ม.1/3", number: "18", studentId: "10002", count: 2, behaviorType: "สายพัก 10"}
      ],
      recentRecords: [
        {time: "07:55", fullName: "ชื่อ - สกุล", room: "ม.1/1", number: "12", studentId: "10001", behaviorType: "สายเช้า"},
        {time: "12:35", fullName: "ชื่อ - สกุล", room: "ม.1/3", number: "18", studentId: "10002", behaviorType: "สายพัก 10"}
      ],
      demo: true
    };

    const $ = id => document.getElementById(id);
    const state = {
      mode: "daily",
      page: "overview",
      room: "ALL",
      behavior: "ALL",
      query: "",
      sort: "count-desc",
      searchResults: [],
      searchLoading: false,
      data: FALLBACK
    };
    let searchTimer = null;
    let latestSearchQuery = "";
    const SORT_LABELS = {
      "count-desc": "เรียงตามจำนวนมากสุด",
      "name-asc": "เรียงตามชื่อ",
      "room-asc": "เรียงตามห้อง",
      "latest": "เรียงล่าสุด"
    };
    const MONTH_NAMES = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const WEEKDAYS = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
    const pickerState = {
      dateView: new Date(),
      monthView: new Date().getFullYear()
    };

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function thisMonth() {
      return new Date().toISOString().slice(0, 7);
    }

    function parseDateValue(value) {
      const [year, month, day] = String(value || today()).split("-").map(Number);
      return new Date(year, (month || 1) - 1, day || 1);
    }

    function formatDateDisplay(value) {
      const [year, month, day] = String(value || today()).split("-");
      return `${day}/${month}/${year}`;
    }

    function formatMonthDisplay(value) {
      const [year, month] = String(value || thisMonth()).split("-");
      return `${month}/${year}`;
    }

    function updateDateLabels() {
      $("dateButton").textContent = formatDateDisplay($("date").value);
      $("monthButton").textContent = formatMonthDisplay($("month").value);
      const calendarIcon = document.querySelector(".calendar-icon");
      if (calendarIcon) {
        const selected = parseDateValue($("date").value);
        calendarIcon.dataset.month = selected.toLocaleDateString("en-US", {month: "short"}).toUpperCase();
        calendarIcon.dataset.day = String(selected.getDate());
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, s => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[s]));
    }

    function asNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function jsonp(params, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const cb = "__m1dd_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const url = new URL(GAS_URL);
        Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value == null ? "" : String(value)));
        url.searchParams.set("callback", cb);
        const script = document.createElement("script");
        let done = false;
        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("เชื่อมต่อช้าเกินไป"));
        }, timeoutMs);

        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          script.remove();
        }

        window[cb] = data => {
          if (done) return;
          done = true;
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("เชื่อมต่อ Apps Script ไม่สำเร็จ"));
        };
        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    function normalizeStudent(record, fallbackType = "") {
      return {
        fullName: record.fullName || record.name || record.studentName || "ชื่อ - สกุล",
        room: record.room || record.classroom || record.class || "ห้องเรียน",
        number: record.number || record.no || record.studentNo || "เลขที่",
        studentId: record.studentId || record.student_id || record.id || "เลขประจำตัว",
        count: asNumber(record.count || record.total || 1),
        behaviorType: record.behaviorType || record.type || fallbackType || "รายการ",
        time: record.time || record.recordedAt || record.date || ""
      };
    }

    function normalizeData(raw) {
      const data = raw && raw.success ? raw : FALLBACK;
      const byType = data.byType || {};
      const byRoom = data.byRoom || {};
      const topStudents = (data.topStudents || []).map(item => normalizeStudent(item));
      const recentRecords = (data.recentRecords || []).map(item => normalizeStudent(item));
      return {
        ...data,
        total: asNumber(data.total || Object.values(byType).reduce((sum, value) => sum + asNumber(value), 0)),
        byType,
        byRoom,
        topStudents,
        recentRecords
      };
    }

    function mergedStudents(mode = state.page) {
      const source = mode === "recent" ? state.data.recentRecords : (state.data.topStudents.length ? state.data.topStudents : state.data.recentRecords);
      const query = state.query.trim().toLowerCase();
      return [...source]
        .filter(student => state.room === "ALL" || student.room === state.room)
        .filter(student => {
          if (!query) return true;
          return [student.fullName, student.room, student.number, student.studentId, student.behaviorType]
            .join(" ")
            .toLowerCase()
            .includes(query);
        })
        .sort((a, b) => {
          if (state.sort === "name-asc") return a.fullName.localeCompare(b.fullName, "th");
          if (state.sort === "room-asc") return a.room.localeCompare(b.room, "th");
          if (state.sort === "latest") return String(b.time).localeCompare(String(a.time));
          return b.count - a.count;
        });
    }

    function roomBehaviorStudents() {
      const source = state.data.recentRecords.length ? state.data.recentRecords : state.data.topStudents;
      const query = state.query.trim().toLowerCase();
      return aggregateStudents(source, state.behavior !== "ALL")
        .filter(student => state.room === "ALL" || student.room === state.room)
        .filter(student => state.behavior === "ALL" || student.behaviorType === state.behavior)
        .filter(student => {
          if (!query) return true;
          return [student.fullName, student.room, student.number, student.studentId, student.behaviorType]
            .join(" ")
            .toLowerCase()
            .includes(query);
        })
        .sort((a, b) => {
          if (state.sort === "name-asc") return a.fullName.localeCompare(b.fullName, "th");
          if (state.sort === "room-asc") return a.room.localeCompare(b.room, "th");
          if (state.sort === "latest") return String(b.time).localeCompare(String(a.time));
          return b.count - a.count;
        });
    }

    function lunchLateStudents() {
      const source = state.data.recentRecords.length ? state.data.recentRecords : state.data.topStudents;
      const query = state.query.trim().toLowerCase();
      return aggregateStudents(source.filter(student => student.behaviorType === "สายเที่ยง"), false)
        .filter(student => state.room === "ALL" || student.room === state.room)
        .filter(student => {
          if (!query) return true;
          return [student.fullName, student.room, student.number, student.studentId]
            .join(" ")
            .toLowerCase()
            .includes(query);
        })
        .sort((a, b) => {
          if (state.sort === "name-asc") return a.fullName.localeCompare(b.fullName, "th");
          if (state.sort === "room-asc") return a.room.localeCompare(b.room, "th");
          return b.count - a.count;
        });
    }

    function sortNamedEntries(entries) {
      return [...entries].sort((a, b) => {
        const [nameA, countA] = a;
        const [nameB, countB] = b;
        if (state.sort === "name-asc" || state.sort === "room-asc") return nameA.localeCompare(nameB, "th");
        return asNumber(countB) - asNumber(countA);
      });
    }

    function studentKey(student, includeBehavior = true) {
      return [
        student.studentId || "",
        student.fullName || "",
        student.room || "",
        includeBehavior ? (student.behaviorType || "") : ""
      ].join("|");
    }

    function aggregateStudents(records, includeBehavior = true) {
      const map = new Map();
      records.forEach(record => {
        const key = studentKey(record, includeBehavior);
        const existing = map.get(key);
        if (existing) {
          existing.count += Math.max(1, asNumber(record.count));
          if (!existing.time && record.time) existing.time = record.time;
          if (!includeBehavior && existing.behaviorType !== record.behaviorType) existing.behaviorType = "หลายพฤติกรรม";
          return;
        }
        map.set(key, {...record, count: Math.max(1, asNumber(record.count))});
      });
      return [...map.values()];
    }

    function studentHistoryHref(student) {
      const params = new URLSearchParams({
        studentId: student.studentId || "",
        q: student.studentId || student.fullName || "",
        view: "history"
      });
      return `index.html?${params.toString()}`;
    }

    function dashboardSearchStudents() {
      const query = state.query.trim().toLowerCase();
      if (!query) return [];
      if (state.searchResults.length) {
        return state.searchResults.map(student => normalizeStudent(student));
      }
      const source = [
        ...(state.data.recentRecords || []),
        ...(state.data.topStudents || [])
      ];
      return aggregateStudents(source, false)
        .filter(student => [student.fullName, student.room, student.number, student.studentId, student.behaviorType]
          .join(" ")
          .toLowerCase()
          .includes(query))
        .sort((a, b) => {
          if (state.sort === "name-asc") return a.fullName.localeCompare(b.fullName, "th");
          if (state.sort === "room-asc") return a.room.localeCompare(b.room, "th");
          return b.count - a.count;
        });
    }

    async function runDashboardSearch(query) {
      const q = query.trim();
      latestSearchQuery = q;
      state.query = q;
      state.searchResults = [];
      if (q.length < 2) {
        state.searchLoading = false;
        renderMainPanel();
        return;
      }
      state.searchLoading = true;
      renderMainPanel();
      try {
        const res = await jsonp({action: "searchStudent", q}, 12000);
        if (q !== latestSearchQuery) return;
        state.searchResults = res && res.success ? (res.students || []) : [];
      } catch (error) {
        if (q !== latestSearchQuery) return;
        state.searchResults = [];
      }
      state.searchLoading = false;
      renderMainPanel();
    }

    function roomSourceRecords() {
      const source = state.data.recentRecords.length ? state.data.recentRecords : state.data.topStudents;
      return source.filter(student => state.room === "ALL" || student.room === state.room);
    }

    function behaviorStats(behavior, totalTimes) {
      const records = roomSourceRecords().filter(student => behavior === "ALL" || student.behaviorType === behavior);
      const people = new Set(records.map(student => [
        student.studentId || "",
        student.fullName || "",
        student.room || ""
      ].join("|"))).size;
      const countedTimes = records.reduce((sum, student) => sum + Math.max(1, asNumber(student.count)), 0);
      return {
        people,
        times: behavior === "ALL" ? Math.max(asNumber(state.data.total), countedTimes) : Math.max(asNumber(totalTimes), countedTimes)
      };
    }

    function renderRooms() {
      $("roomStrip").innerHTML = ROOMS.map(room => {
        const label = room === "ALL" ? "ทุกห้อง" : room;
        return `<button class="chip ${state.room === room ? "active" : ""}" type="button" data-room="${escapeHtml(room)}">${escapeHtml(label)}</button>`;
      }).join("");
      updateRoomArrows();
    }

    function closeDateMenus() {
      $("dateMenu").classList.add("hidden");
      $("monthMenu").classList.add("hidden");
    }

    function renderDateMenu() {
      const selected = parseDateValue($("date").value);
      const view = new Date(pickerState.dateView.getFullYear(), pickerState.dateView.getMonth(), 1);
      const firstDay = view.getDay();
      const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      const title = `${MONTH_NAMES[view.getMonth()]} ${view.getFullYear()}`;
      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(`<button class="date-cell muted" type="button" tabindex="-1"></button>`);
      for (let day = 1; day <= daysInMonth; day++) {
        const value = `${view.getFullYear()}-${String(view.getMonth() + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const active = selected.getFullYear() === view.getFullYear() && selected.getMonth() === view.getMonth() && selected.getDate() === day;
        cells.push(`<button class="date-cell ${active ? "active" : ""}" type="button" data-date-value="${value}">${day}</button>`);
      }
      $("dateMenu").innerHTML = `
        <div class="date-head">
          <button class="date-nav" type="button" data-date-move="-1">‹</button>
          <div class="date-title">${escapeHtml(title)}</div>
          <button class="date-nav" type="button" data-date-move="1">›</button>
        </div>
        <div class="date-grid">
          ${WEEKDAYS.map(day => `<div class="weekday">${day}</div>`).join("")}
          ${cells.join("")}
        </div>
      `;
    }

    function renderMonthMenu() {
      const selected = $("month").value || thisMonth();
      $("monthMenu").innerHTML = `
        <div class="date-head">
          <button class="date-nav" type="button" data-month-move="-1">‹</button>
          <div class="date-title">${pickerState.monthView}</div>
          <button class="date-nav" type="button" data-month-move="1">›</button>
        </div>
        <div class="month-grid">
          ${MONTH_NAMES.map((name, index) => {
            const value = `${pickerState.monthView}-${String(index + 1).padStart(2, "0")}`;
            return `<button class="month-cell ${selected === value ? "active" : ""}" type="button" data-month-value="${value}">${name}</button>`;
          }).join("")}
        </div>
      `;
    }

    function openDateMenu(kind) {
      $("sortMenu").classList.add("hidden");
      $("sortButton").setAttribute("aria-expanded", "false");
      if (kind === "date") {
        pickerState.dateView = parseDateValue($("date").value);
        renderDateMenu();
        $("monthMenu").classList.add("hidden");
        $("dateMenu").classList.toggle("hidden");
      } else {
        pickerState.monthView = Number(($("month").value || thisMonth()).slice(0, 4));
        renderMonthMenu();
        $("dateMenu").classList.add("hidden");
        $("monthMenu").classList.toggle("hidden");
      }
    }

    function updateRoomArrows() {
      const strip = $("roomStrip");
      const left = $("roomLeft");
      const right = $("roomRight");
      if (!strip || !left || !right) return;
      const maxScroll = Math.max(0, strip.scrollWidth - strip.clientWidth - 1);
      left.disabled = strip.scrollLeft <= 1;
      right.disabled = strip.scrollLeft >= maxScroll;
    }

    function scrollRooms(direction) {
      const strip = $("roomStrip");
      const distance = Math.max(160, Math.round(strip.clientWidth * .72));
      strip.scrollBy({left: direction * distance, behavior: "smooth"});
      setTimeout(updateRoomArrows, 260);
    }

    function renderStatus() {
      $("liveBadge").textContent = "พร้อม";
      $("status").textContent = "";
    }

    function renderBars(title, object) {
      const entries = sortNamedEntries(Object.entries(object || {}));
      const max = Math.max(1, ...entries.map(([, count]) => asNumber(count)));
      if (!entries.length) return `<div class="empty">ยังไม่มีข้อมูล</div>`;
      return `
        <div class="panel-head">
          <h2>${escapeHtml(title)}</h2>
          <div class="status">${entries.length} ประเภท</div>
        </div>
        <div class="unit-note">ตัวเลขด้านขวาเป็นจำนวนครั้ง</div>
        <div class="bars">
          ${entries.map(([name, count]) => `
            <div class="bar-row">
              <div class="bar-name">${escapeHtml(name)}</div>
              <div class="bar-track"><span style="--w:${Math.round(asNumber(count) / max * 100)}%"></span></div>
              <div class="bar-count">${asNumber(count)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function studentCard(student, options = {}) {
      return `
        <a class="student-card" href="${escapeHtml(studentHistoryHref(student))}" aria-label="ดูประวัติ ${escapeHtml(student.fullName)}">
          <div class="student-main">
            <div class="student-name">${escapeHtml(student.fullName)}</div>
            <div class="student-meta">
              <span class="tag">${escapeHtml(student.room)}</span>
              <span class="tag">เลขที่ ${escapeHtml(student.number)}</span>
              <span class="tag">${escapeHtml(student.studentId)}</span>
              ${student.time ? `<span class="tag">${escapeHtml(student.time)}</span>` : ""}
              <span class="tag behavior">${escapeHtml(student.behaviorType)}</span>
            </div>
          </div>
          ${options.hideCount ? "" : `<div class="count-badge">${student.count}</div>`}
        </a>
      `;
    }

    function renderStudentList(title, emptyText, mode) {
      const students = mergedStudents(mode);
      return `
        <div class="panel-head">
          <h2>${escapeHtml(title)}</h2>
          <div class="status">${students.length} รายการ</div>
        </div>
        <div class="student-list">
          ${students.length ? students.map(student => studentCard(student, {hideCount: mode === "recent"})).join("") : `<div class="empty">${escapeHtml(emptyText)}</div>`}
        </div>
      `;
    }

    function trackingCard(student) {
      const count = asNumber(student.count);
      const completedRounds = Math.floor(count / 3);
      const currentStep = count === 0 ? 0 : (count % 3 || 3);
      const percent = Math.min(100, Math.round(currentStep / 3 * 100));
      const nextText = count >= 3 && count % 3 === 0 ? "ครบเกณฑ์รอบนี้แล้ว" : `${currentStep}/3 ครั้ง`;
      return `
        <a class="tracking-card student-card" href="${escapeHtml(studentHistoryHref(student))}" aria-label="ดูประวัติ ${escapeHtml(student.fullName)}">
          <div class="tracking-top">
            <div class="student-main">
              <div class="student-name">${escapeHtml(student.fullName)}</div>
              <div class="student-meta">
                <span class="tag">${escapeHtml(student.room)}</span>
                <span class="tag">เลขที่ ${escapeHtml(student.number)}</span>
                <span class="tag">${escapeHtml(student.studentId)}</span>
                <span class="tag behavior">สายเที่ยง</span>
              </div>
            </div>
            <div class="round-badge">${completedRounds}<br>รอบ</div>
          </div>
          <div class="tracking-progress">
            <div class="tracking-bar"><span style="--w:${percent}%"></span></div>
            <div class="tracking-caption">
              <span>สายเที่ยง ${count} ครั้ง</span>
              <span>${escapeHtml(nextText)}</span>
            </div>
          </div>
        </a>
      `;
    }

    function renderFollowPage() {
      const students = lunchLateStudents();
      const reached = students.filter(student => asNumber(student.count) >= 3).length;
      return `
        <div class="panel-head">
          <h2>ติดตามสายเที่ยง</h2>
          <div class="status">${reached} คนครบ 3 ครั้ง</div>
        </div>
        <div class="unit-note">เกณฑ์ติดตาม: สายเที่ยงครบ 3 ครั้งต่อ 1 รอบ</div>
        <div class="student-list">
          ${students.length ? students.map(trackingCard).join("") : `<div class="empty">ยังไม่มีนักเรียนสายเที่ยงในช่วงเวลานี้</div>`}
        </div>
      `;
    }

    function renderRoomsPage() {
      if (state.room !== "ALL") return renderRoomBehaviorPage();

      const entries = sortNamedEntries(Object.entries(state.data.byRoom || {}));
      const max = Math.max(1, ...entries.map(([, count]) => asNumber(count)));
      if (!entries.length) return `<div class="empty">ยังไม่มีข้อมูลแยกตามห้อง</div>`;
      return `
        <div class="panel-head">
          <h2>ภาพรวมห้องเรียน</h2>
          <div class="status">แตะห้องเพื่อกรอง</div>
        </div>
        <div class="room-grid">
          ${entries.map(([room, count]) => `
            <button class="room-card" type="button" data-room="${escapeHtml(room)}">
              <div>
                <div class="room-name">${escapeHtml(room)}</div>
                <div class="room-count">${asNumber(count)}</div>
              </div>
              <div class="bar-track"><span style="--w:${Math.round(asNumber(count) / max * 100)}%"></span></div>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderRoomBehaviorPage() {
      const entries = sortNamedEntries(Object.entries(state.data.byType || {})
        .filter(([, count]) => asNumber(count) > 0));
      const students = roomBehaviorStudents();
      const activeLabel = state.behavior === "ALL" ? "ทุกพฤติกรรม" : state.behavior;
      const allStats = behaviorStats("ALL", state.data.total);
      return `
        <div class="panel-head">
          <h2>${escapeHtml(state.room)}</h2>
          <button class="back-button" type="button" data-room="ALL">ดูทุกห้อง</button>
        </div>
        ${entries.length ? `
          <div class="behavior-grid">
            <button class="behavior-card ${state.behavior === "ALL" ? "active" : ""}" type="button" data-behavior="ALL">
              <span>
                <span class="behavior-name">ทุกพฤติกรรม</span>
                <span class="behavior-detail">${allStats.people} คน</span>
              </span>
              <span class="behavior-count">${allStats.times}</span>
            </button>
            ${entries.map(([behavior, count]) => {
              const stats = behaviorStats(behavior, count);
              return `
                <button class="behavior-card ${state.behavior === behavior ? "active" : ""}" type="button" data-behavior="${escapeHtml(behavior)}">
                  <span>
                    <span class="behavior-name">${escapeHtml(behavior)}</span>
                    <span class="behavior-detail">${stats.people} คน</span>
                  </span>
                  <span class="behavior-count">${stats.times}</span>
                </button>
              `;
            }).join("")}
          </div>
        ` : `<div class="empty">ยังไม่มีข้อมูลพฤติกรรมของห้องนี้ในช่วงเวลาที่เลือก</div>`}
        <div class="panel-head">
          <h2>${escapeHtml(activeLabel)}</h2>
          <div class="status">${students.length} คน · ${students.reduce((sum, student) => sum + asNumber(student.count), 0)} ครั้ง</div>
        </div>
        <div class="student-list">
          ${students.length ? students.map(studentCard).join("") : `<div class="empty">ยังไม่มีรายชื่อนักเรียนในพฤติกรรมนี้</div>`}
        </div>
      `;
    }

    function renderMainPanel() {
      document.body.classList.toggle("untimed-page", isUntimedPage());
      if (isUntimedPage()) $("filterPanel").classList.add("hidden");
      if (state.query.trim()) {
        const students = dashboardSearchStudents();
        $("mainPanel").innerHTML = `
          <div class="panel-head">
            <h2>ผลการค้นหา</h2>
            <div class="status">${state.searchLoading ? "กำลังค้นหา..." : `${students.length} รายการ`}</div>
          </div>
          <div class="student-list">
            ${state.searchLoading ? `<div class="empty">กำลังค้นหาจากรายชื่อนักเรียน</div>` : students.length ? students.map(student => studentCard(student)).join("") : `<div class="empty">ไม่พบนักเรียนจากคำค้นนี้</div>`}
          </div>
        `;
      } else if (state.page === "rooms") {
        $("mainPanel").innerHTML = renderRoomsPage();
      } else if (state.page === "follow") {
        $("mainPanel").innerHTML = renderFollowPage();
      } else if (state.page === "recent") {
        $("mainPanel").innerHTML = renderStudentList("รายการล่าสุด", "ยังไม่มีรายการล่าสุด", "recent");
      } else {
        $("mainPanel").innerHTML = renderBars("แยกตามประเภทพฤติกรรม", state.data.byType);
      }
      $("mainPanel").style.animation = "none";
      $("mainPanel").offsetHeight;
      $("mainPanel").style.animation = "";
      renderStatus();
      renderRooms();
    }

    function isUntimedPage() {
      return state.page === "follow" || state.page === "recent";
    }

    async function loadDashboard() {
      document.body.classList.add("is-loading");
      $("liveBadge").innerHTML = `<span class="loading-dots" aria-label="กำลังโหลด"><span></span><span></span><span></span></span>`;
      $("status").textContent = "";
      try {
        const params = {
          action: "getDashboard",
          mode: isUntimedPage() ? "all" : state.mode,
          room: state.room
        };
        if (!isUntimedPage()) {
          params.date = $("date").value;
          params.month = $("month").value;
        }
        const data = await jsonp(params);
        if (!data.success) throw new Error(data.message || "โหลดข้อมูลไม่สำเร็จ");
        state.data = normalizeData(data);
      } catch (error) {
        state.data = normalizeData({...FALLBACK, mode: state.mode});
      }
      document.body.classList.remove("is-loading");
      renderMainPanel();
    }

    $("date").value = today();
    $("month").value = thisMonth();
    updateDateLabels();
    $("monthWrap").classList.add("hidden");

    $("dailyBtn").addEventListener("click", () => {
      state.mode = "daily";
      $("dailyBtn").classList.add("active");
      $("monthlyBtn").classList.remove("active");
      $("dateWrap").classList.remove("hidden");
      $("monthWrap").classList.add("hidden");
      loadDashboard();
    });

    $("monthlyBtn").addEventListener("click", () => {
      state.mode = "monthly";
      $("monthlyBtn").classList.add("active");
      $("dailyBtn").classList.remove("active");
      $("monthWrap").classList.remove("hidden");
      $("dateWrap").classList.add("hidden");
      loadDashboard();
    });

    $("filterBtn").addEventListener("click", () => $("filterPanel").classList.toggle("hidden"));
    $("dateButton").addEventListener("click", () => openDateMenu("date"));
    $("monthButton").addEventListener("click", () => openDateMenu("month"));
    $("dateMenu").addEventListener("click", event => {
      const move = event.target.closest("[data-date-move]");
      const value = event.target.closest("[data-date-value]");
      if (move) {
        pickerState.dateView = new Date(pickerState.dateView.getFullYear(), pickerState.dateView.getMonth() + Number(move.dataset.dateMove), 1);
        renderDateMenu();
      }
      if (value) {
        $("date").value = value.dataset.dateValue;
        updateDateLabels();
        closeDateMenus();
        loadDashboard();
      }
    });
    $("monthMenu").addEventListener("click", event => {
      const move = event.target.closest("[data-month-move]");
      const value = event.target.closest("[data-month-value]");
      if (move) {
        pickerState.monthView += Number(move.dataset.monthMove);
        renderMonthMenu();
      }
      if (value) {
        $("month").value = value.dataset.monthValue;
        updateDateLabels();
        closeDateMenus();
        loadDashboard();
      }
    });
    $("roomLeft").addEventListener("click", () => scrollRooms(-1));
    $("roomRight").addEventListener("click", () => scrollRooms(1));
    $("roomStrip").addEventListener("scroll", updateRoomArrows, {passive: true});
    window.addEventListener("resize", updateRoomArrows);
    $("date").addEventListener("change", loadDashboard);
    $("month").addEventListener("change", loadDashboard);
    $("searchInput").addEventListener("input", event => {
      const value = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runDashboardSearch(value), 220);
    });
    function updateSort(value) {
      state.sort = value;
      $("sortButton").textContent = SORT_LABELS[value] || SORT_LABELS["count-desc"];
      $("sortMenu").classList.add("hidden");
      $("sortButton").setAttribute("aria-expanded", "false");
      document.querySelectorAll("[data-sort]").forEach(button => button.classList.toggle("active", button.dataset.sort === value));
      renderMainPanel();
    }
    $("sortButton").addEventListener("click", () => {
      const open = $("sortMenu").classList.toggle("hidden");
      $("sortButton").setAttribute("aria-expanded", String(!open));
    });
    document.querySelectorAll("[data-sort]").forEach(button => {
      button.addEventListener("click", () => updateSort(button.dataset.sort));
    });
    $("pdfBtn").addEventListener("click", () => window.print());
    document.querySelectorAll(".floating-bottom-nav a").forEach(link => {
      link.addEventListener("click", event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        document.querySelector(".floating-bottom-nav")?.style.setProperty("--active-index", link.dataset.index || 1);
        document.querySelectorAll(".floating-bottom-nav a").forEach(item => item.setAttribute("aria-current", item === link ? "page" : "false"));
        setTimeout(() => document.body.classList.add("page-leaving"), 140);
        setTimeout(() => {
          window.location.href = link.href;
        }, 440);
      });
    });

    document.addEventListener("click", event => {
      const tab = event.target.closest("[data-page]");
      const room = event.target.closest("[data-room]");
      const behavior = event.target.closest("[data-behavior]");
      if (!event.target.closest(".sort-control")) {
        $("sortMenu").classList.add("hidden");
        $("sortButton").setAttribute("aria-expanded", "false");
      }
      if (!event.target.closest(".date-control")) closeDateMenus();
      if (tab) {
        state.page = tab.dataset.page;
        if (state.page !== "rooms") state.behavior = "ALL";
        document.querySelectorAll("[data-page]").forEach(button => button.classList.toggle("active", button === tab));
        loadDashboard();
      }
      if (room) {
        state.room = room.dataset.room;
        state.behavior = "ALL";
        loadDashboard();
      }
      if (behavior) {
        state.behavior = behavior.dataset.behavior;
        renderMainPanel();
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(() => {});
    }
    if ("caches" in window) {
      caches.keys().then(keys => keys.forEach(key => caches.delete(key))).catch(() => {});
    }

    renderMainPanel();
    loadDashboard();
  </script>
</body>
</html>
