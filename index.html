<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>M1 Good Good | ระบบบันทึกพฤติกรรมนักเรียน</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Favicon / Home Screen Icon -->
  <link rel="icon" href="app-icon.webp" type="image/webp">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#eef6ff">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <style>
    :root{
      --ink:#172033; --muted:#697386; --soft:#f4f7fb; --glass:rgba(255,255,255,.68);
      --glass-strong:rgba(255,255,255,.86); --line:rgba(55,70,95,.14);
      --black:#08090c; --blue:#54a4ff; --blue-deep:#2577f4; --violet:#8f7aff; --cyan:#49dbff; --teal:#32d6c1; --green:#61d394; --rose:#ff7aa9; --amber:#ffc35a;
      --accent:linear-gradient(135deg,#4fd8ff 0%,#5ca7ff 48%,#8f7aff 100%);
      --shadow:0 28px 80px rgba(31,45,70,.22),0 3px 10px rgba(31,45,70,.08);
      --inner:inset 0 1px 0 rgba(255,255,255,.92),inset 0 -18px 32px rgba(235,242,250,.55);
    }
    *{box-sizing:border-box;font-family:'LINE Seed Sans TH','Noto Sans Thai','Helvetica Neue',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;color:var(--ink)}
    body{
      background:
        linear-gradient(115deg,rgba(84,164,255,.32),transparent 34%),
        linear-gradient(245deg,rgba(50,214,193,.28),transparent 35%),
        linear-gradient(20deg,rgba(255,122,169,.24),transparent 44%),
        linear-gradient(160deg,#f8fbff 0%,#eaf3ff 46%,#fff8ea 100%);
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;
      background-image:linear-gradient(rgba(255,255,255,.38) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.38) 1px,transparent 1px);
      background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,black 18%,black 78%,transparent);
    }
    .app-shell{min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .app{width:min(100%,430px);min-height:min(860px,calc(100dvh - 40px));background:var(--glass);border:1px solid rgba(255,255,255,.72);border-radius:38px;box-shadow:var(--shadow),var(--inner);backdrop-filter:blur(26px) saturate(1.22);display:flex;align-items:stretch;justify-content:center;padding:14px;position:relative;overflow:hidden}
    .app:before{content:"";position:absolute;inset:10px;border-radius:31px;border:1px solid rgba(255,255,255,.7);pointer-events:none}
    .screen{display:none;width:100%;position:relative;z-index:1;animation:fadeScale .24s ease-out}
    .screen.active{display:flex;flex-direction:column;min-height:calc(min(860px,100dvh - 40px) - 28px)}
    @keyframes fadeScale{from{opacity:0;transform:scale(.985) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .panel,.student-card,.section-card{background:var(--glass-strong);border:1px solid rgba(255,255,255,.76);border-radius:28px;box-shadow:0 18px 44px rgba(38,55,82,.14),var(--inner);backdrop-filter:blur(18px) saturate(1.12)}
    .panel{width:100%;min-height:100%;padding:26px 18px 18px;margin:0 auto;position:relative;display:flex;flex-direction:column}
    .brand-logo{width:min(330px,86vw);display:block;margin:82px auto 38px;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(28,42,66,.16))}
    h1{font-size:clamp(30px,8vw,42px);font-weight:900;margin:0;text-align:center;line-height:1.05}.subtitle{text-align:center;color:var(--muted);font-weight:800;margin:8px 0 24px}
    .search-wrap{position:relative}.search-wrap:before{content:"";position:absolute;inset:-4px;border-radius:999px;background:linear-gradient(100deg,rgba(79,216,255,.9),rgba(143,122,255,.55),rgba(255,122,169,.48),rgba(79,216,255,.72));filter:blur(12px);opacity:.48;pointer-events:none;transition:opacity .22s ease}.search-wrap:focus-within:before{opacity:.82}.search-row{display:flex;width:100%;border:1px solid rgba(255,255,255,.86);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(244,250,255,.76));border-radius:999px;overflow:hidden;box-shadow:0 18px 36px rgba(52,111,190,.16),0 0 0 1px rgba(84,164,255,.18),inset 0 1px 0 rgba(255,255,255,.98);position:relative}
    .search-row:before{content:"";position:absolute;inset:1px;border-radius:999px;border:1px solid rgba(112,211,255,.22);pointer-events:none}
    .search-input{border:0;outline:0;flex:1;min-width:0;min-height:54px;padding:0 16px;font-size:18px!important;font-weight:900;color:var(--ink);background:transparent}
    .search-input::-webkit-search-cancel-button,.search-input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
    .clear-btn{width:34px;border:0;background:transparent;color:#8aa1b8;font-size:22px;font-weight:900;display:none;align-items:center;justify-content:center}.clear-btn.show{display:flex}
    .search-btn{width:58px;min-height:54px;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:999px;margin:0;box-shadow:0 10px 24px rgba(37,119,244,.34),0 0 22px rgba(73,219,255,.28),inset 0 1px 0 rgba(255,255,255,.52);position:relative;z-index:1}.search-btn:before{content:"";position:absolute;inset:8px;border-radius:999px;background:rgba(255,255,255,.18);filter:blur(8px);pointer-events:none}.search-btn svg{position:relative;z-index:1}
    .search-btn svg{width:23px;height:23px;stroke-width:2.8}.search-btn.loading svg{display:none}.search-btn.loading:before{content:'';position:static;inset:auto;width:24px;height:24px;border-radius:50%;background:transparent;filter:none;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .suggestions{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:20;display:none;max-height:280px;overflow:auto;padding:8px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:0 20px 44px rgba(29,45,74,.2);backdrop-filter:blur(16px)}
    .suggestions.has-results{display:grid;gap:8px}.suggestion-item{width:100%;min-height:58px;text-align:left;border:1px solid rgba(58,73,99,.11);background:rgba(255,255,255,.86);border-radius:18px;padding:10px 12px;font-weight:900;color:var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:center}.suggestion-item:hover{background:#f4f9ff}.suggestion-meta{font-size:13px;color:var(--muted);font-weight:900;white-space:nowrap}.suggestion-name{line-height:1.25;word-break:break-word}.hint{text-align:center;color:var(--muted);font-weight:800;margin-top:14px;font-size:13px}
    .btn{min-height:50px;border:0;border-radius:999px;font-weight:900;box-shadow:0 12px 26px rgba(32,47,72,.13);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
    .btn:disabled,.btn.disabled{background:linear-gradient(135deg,#d9dee8,#b8c0cf)!important;color:#ffffff!important;box-shadow:none!important;cursor:not-allowed!important;opacity:.9!important}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 12px 28px rgba(37,119,244,.26),inset 0 1px 0 rgba(255,255,255,.48)}.btn-soft{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid rgba(255,255,255,.84)}.btn-green{background:linear-gradient(135deg,var(--green),var(--teal));color:#073225}.btn-orange{background:linear-gradient(135deg,var(--amber),#ff8f70);color:#392000}.btn-danger{background:linear-gradient(135deg,#ff5968,#d7192f);color:#fff;box-shadow:0 14px 28px rgba(215,25,47,.28),inset 0 1px 0 rgba(255,255,255,.36)}
    .home-actions{margin-top:auto;display:grid;gap:10px}.dock-row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}.dock-row.single{justify-content:center}.dock-btn{flex:1;min-height:48px;border-radius:999px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.68);box-shadow:0 12px 24px rgba(38,55,82,.11);font-weight:900;color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}.dock-btn svg{width:25px;height:25px}.dock-board svg{display:none}.dock-group,.dock-board{text-shadow:0 1px 8px rgba(0,0,0,.18)}.dock-group{width:min(180px,56%);flex:none;min-height:48px;margin:18px auto 0;background:linear-gradient(135deg,rgba(104,229,153,.95),rgba(50,214,193,.9));color:#fff;box-shadow:0 14px 28px rgba(54,190,139,.22),inset 0 1px 0 rgba(255,255,255,.42)}.dock-board{background:linear-gradient(135deg,rgba(255,137,183,.95),rgba(255,112,153,.88));color:#fff;box-shadow:0 14px 28px rgba(255,112,153,.22),inset 0 1px 0 rgba(255,255,255,.42)}
    .topbar{display:flex;align-items:center;gap:10px;margin:0 0 12px;width:100%;padding:2px 2px 0}.back-btn{width:46px;height:46px;border:0;background:transparent;color:transparent;font-size:0;line-height:1;box-shadow:none;position:relative}.back-btn:before{content:"";position:absolute;left:17px;top:12px;width:18px;height:18px;border-left:7px solid #05070b;border-bottom:7px solid #05070b;border-radius:5px;transform:rotate(45deg)}.page-title{flex:1;text-align:center;font-size:19px;font-weight:900;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.82);box-shadow:0 10px 24px rgba(38,55,82,.11)}.top-spacer{width:46px}
    .main-layout{display:grid;gap:12px;width:100%;padding-bottom:2px}
    .student-card,.section-card{padding:14px}.profile-row{display:flex;gap:12px;align-items:center}.profile-text{min-width:0;flex:1}.avatar{width:92px;height:92px;border-radius:32px;background:linear-gradient(145deg,#f7fbff,#e8f0f9);border:1px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:43px;flex:0 0 auto;box-shadow:inset 0 -14px 26px rgba(119,145,179,.14),0 14px 26px rgba(39,55,81,.12);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.student-name{font-size:clamp(20px,5.1vw,25px);font-weight:900;line-height:1.12;word-break:normal;overflow-wrap:normal;text-wrap:balance}.student-sub{color:var(--muted);font-weight:800;margin-top:4px;font-size:13px;line-height:1.25}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.info-pill{border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.86);padding:10px;font-weight:900;text-align:center;min-height:42px;box-shadow:inset 0 1px 0 rgba(255,255,255,.92)}.button-stack{display:grid;gap:8px;margin-top:12px}.button-stack .switch-control{margin-bottom:0}.button-stack .wide{width:100%}
    .switch-control{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;padding:5px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.86);border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 12px 24px rgba(38,55,82,.08);margin-bottom:12px;overflow:hidden}.switch-control:before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background:var(--accent);box-shadow:0 12px 26px rgba(37,119,244,.28),0 0 20px rgba(73,219,255,.22),inset 0 1px 0 rgba(255,255,255,.42);transition:transform .24s cubic-bezier(.2,.8,.2,1)}.switch-control.is-history:before{transform:translateX(100%)}.switch-option{position:relative;z-index:1;min-height:42px;border:0;border-radius:999px;background:transparent;color:#607086;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 12px;transition:color .2s ease,transform .2s ease}.switch-option[aria-pressed="true"]{color:#fff;text-shadow:0 1px 8px rgba(36,89,165,.26)}.switch-option:active{transform:scale(.98)}
    .section-title{font-size:18px;font-weight:900;margin:0 0 12px;display:flex;align-items:center;justify-content:center;gap:8px}.selection-hint{text-align:center;color:var(--muted);font-weight:800;font-size:13px;margin:-2px 0 10px}
    .behavior-grid{display:grid;gap:9px}.behavior-option{min-height:43px;border-radius:999px;border:1px solid rgba(43,59,85,.12);background:rgba(255,255,255,.74);box-shadow:0 10px 22px rgba(36,52,76,.1),inset 0 1px 0 rgba(255,255,255,.95);padding:7px 13px;display:grid;grid-template-columns:30px 1fr;align-items:center;gap:8px;font-weight:900;cursor:pointer;text-align:center;color:var(--ink)}.behavior-option .emoji{font-size:22px;line-height:1}.behavior-option small{display:none}.behavior-option.active,.behavior-option[aria-pressed="true"]{border-color:rgba(84,164,255,.48);background:var(--accent);color:#fff;box-shadow:0 12px 28px rgba(37,119,244,.24),0 0 18px rgba(73,219,255,.2),inset 0 1px 0 rgba(255,255,255,.42)}textarea.form-control{min-height:86px;border-radius:20px;border:1px solid rgba(43,59,85,.12);font-weight:700;resize:vertical;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}textarea.form-control:focus{border-color:rgba(84,164,255,.45);box-shadow:0 0 0 4px rgba(84,164,255,.14)}
    .history-list{display:grid;gap:10px}.history-item{background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.84);border-radius:20px;padding:13px;box-shadow:0 12px 24px rgba(38,55,82,.1)}.history-date{color:var(--muted);font-weight:800;font-size:13px}.history-type{font-weight:900;font-size:24px;line-height:1.15;margin-top:4px}.history-type .badge{background:transparent!important;color:var(--ink)!important;padding:0}.history-note{margin-top:7px;color:var(--ink);background:rgba(244,247,251,.86);border-radius:14px;padding:8px 10px}.pdf-btn{background:linear-gradient(135deg,#ff4d5d,#d7192f);color:#fff;box-shadow:0 14px 28px rgba(215,25,47,.26),inset 0 1px 0 rgba(255,255,255,.36)}.empty-state{text-align:center;color:var(--muted);font-weight:900;padding:28px 10px}.loading-overlay{position:fixed;inset:0;background:rgba(238,246,255,.58);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:9999}.loading-overlay.show{display:flex}.loader-card{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:22px 26px;box-shadow:var(--shadow);font-weight:900;text-align:center}.spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(84,164,255,.2);border-top-color:var(--blue);animation:spin .8s linear infinite;margin:0 auto}
    .group-list{display:grid;gap:9px;margin-top:12px}.group-student{display:grid;grid-template-columns:48px 1fr 34px;align-items:center;gap:10px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.86);border-radius:22px;padding:9px;box-shadow:0 10px 22px rgba(36,52,76,.09),inset 0 1px 0 rgba(255,255,255,.95)}.group-avatar{width:48px;height:48px;border-radius:18px;background:linear-gradient(145deg,#f7fbff,#e6f2ff);display:flex;align-items:center;justify-content:center;font-size:23px;border:1px solid rgba(255,255,255,.9);overflow:hidden}.group-avatar img{width:100%;height:100%;object-fit:cover;display:block}.group-name{font-weight:900;line-height:1.2}.group-meta{font-size:12px;color:var(--muted);font-weight:800;margin-top:2px}.remove-student{width:34px;height:34px;border:0;border-radius:999px;background:rgba(255,255,255,.72);color:#607086;font-size:20px;font-weight:900}.group-count{font-weight:900;color:#2577f4;text-align:center;margin-top:8px}
    button.back-btn{background:transparent!important;background-image:none!important;border:0!important;box-shadow:none!important;color:transparent!important}
    button.back-btn:before{border-left-color:#05070b!important;border-bottom-color:#05070b!important;background:transparent!important}
    button.back-btn:after{display:none!important}
    @media (min-width:760px){.app{width:430px}.app-shell{padding-top:34px;padding-bottom:34px}}
    @media (max-width:460px){.app-shell{padding:0;align-items:stretch}.app{width:100%;min-height:100dvh;border-radius:0;padding:10px}.app:before{inset:7px;border-radius:24px}.screen.active{min-height:calc(100dvh - 20px)}.panel{padding:22px 14px 14px}.brand-logo{width:min(290px,82vw);margin-top:74px;margin-bottom:36px}.avatar{width:82px;height:82px;border-radius:28px}.suggestions{max-height:45dvh}.button-stack .btn{white-space:normal;min-height:48px}}
  </style>
</head>
<body>
  <div class="app-shell"><main class="app">
    <section id="searchScreen" class="screen active">
      <div class="panel">
        <img class="brand-logo" src="logo.webp" alt="M1 Good Good ระบบบันทึกพฤติกรรมนักเรียน">
        <div class="search-wrap">
          <div class="search-row">
            <input id="studentIdInput" class="search-input" type="search" placeholder="เลขประจำตัว หรือชื่อ" autocomplete="off">
            <button id="clearBtn" class="clear-btn" type="button" onclick="clearSearchBox()">×</button>
            <button id="searchBtn" class="search-btn" type="button" onclick="searchStudent()" aria-label="ค้นหา">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            </button>
          </div>
          <div id="suggestions" class="suggestions"></div>
        </div>
        <button id="groupBtn" class="dock-btn dock-group" type="button" onclick="goToGroup()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          กลุ่ม
        </button>
        <div class="home-actions">
          <div class="dock-row single">
            <a class="dock-btn dock-board" href="dashboard.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="12" rx="1"/></svg>
              M1 ดี๊ดี
            </a>
          </div>
        </div>
      </div>
    </section>
    <section id="groupScreen" class="screen">
      <div class="topbar"><button class="back-btn" onclick="goToSearch()">‹</button><div class="page-title">บันทึกกลุ่ม</div><div class="top-spacer"></div></div>
      <div class="main-layout">
        <div class="section-card">
          <div class="search-wrap">
            <div class="search-row">
              <input id="groupSearchInput" class="search-input" type="search" placeholder="ค้นหานักเรียนเข้ากลุ่ม" autocomplete="off">
              <button id="groupClearBtn" class="clear-btn" type="button" onclick="clearGroupSearchBox()">×</button>
              <button id="groupSearchBtn" class="search-btn" type="button" onclick="searchGroupStudent()" aria-label="ค้นหา">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
              </button>
            </div>
            <div id="groupSuggestions" class="suggestions"></div>
          </div>
          <div id="groupCount" class="group-count">ยังไม่ได้เลือกนักเรียน</div>
          <div id="groupList" class="group-list"></div>
        </div>
        <div class="section-card">
          <div class="selection-hint">เลือกพฤติกรรมได้มากกว่า 1 รายการ</div>
          <div class="behavior-grid">
            <button class="behavior-option group-behavior-option" type="button" aria-pressed="false" onclick="selectGroupBehavior(this,'สายเช้า')"><span class="emoji">☀️</span><span>สายเช้า</span><small>มาไม่ทันช่วงเช้า</small></button>
            <button class="behavior-option group-behavior-option" type="button" aria-pressed="false" onclick="selectGroupBehavior(this,'สายเที่ยง')"><span class="emoji">🔆</span><span>สายเที่ยง</span><small>เข้าแถวเที่ยงช้า</small></button>
            <button class="behavior-option group-behavior-option" type="button" aria-pressed="false" onclick="selectGroupBehavior(this,'สายพัก 10')"><span class="emoji">🏃</span><span>สายพัก 10</span><small>กลับจากพักช้า</small></button>
            <button class="behavior-option group-behavior-option" type="button" aria-pressed="false" onclick="selectGroupBehavior(this,'ขาดแถวเที่ยง')"><span class="emoji">🚫</span><span>ขาดแถวเที่ยง</span><small>ไม่มาเข้าแถว</small></button>
            <button class="behavior-option group-behavior-option" type="button" aria-pressed="false" onclick="selectGroupBehavior(this,'เครื่องแต่งกาย')"><span class="emoji">👕</span><span>เครื่องแต่งกาย</span><small>ตรวจระเบียบ</small></button>
            <button class="behavior-option group-behavior-option" type="button" aria-pressed="false" onclick="selectGroupBehavior(this,'อื่น ๆ')"><span class="emoji">•••</span><span>อื่น ๆ</span><small>ระบุหมายเหตุ</small></button>
          </div>
          <label class="form-label fw-bold mt-3" for="groupNoteInput">หมายเหตุ</label>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

const STUDENT_BOY_IMG='student-boy.webp';
const STUDENT_GIRL_IMG='student-girl.webp';
const GAS_URL='https://script.google.com/macros/s/AKfycbzQ8YCMoXcem6E64Eqfdbl-7ogx5mIfVor6kjV5xivy34xSjItMmU56rGVN6KhU-YAgiA/exec';
let currentStudent=null, selectedBehaviors=[], typingTimer=null, groupTypingTimer=null, lastSuggestions=[], lastGroupSuggestions=[], groupStudents=[], selectedGroupBehaviors=[], currentHistory=[], isSaving=false;
const screens={search:document.getElementById('searchScreen'),group:document.getElementById('groupScreen'),student:document.getElementById('studentScreen'),form:document.getElementById('formScreen'),history:document.getElementById('historyScreen')};
function jsonp(action,params={}){return new Promise((resolve,reject)=>{const cb='m1gg_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);const script=document.createElement('script');const timeout=setTimeout(()=>{cleanup();reject(new Error('เชื่อมต่อช้าเกินไป กรุณาลองใหม่'));},12000);function cleanup(){clearTimeout(timeout);delete window[cb];script.remove();}window[cb]=data=>{cleanup();resolve(data)};const qs=new URLSearchParams(Object.assign({},params,{action,callback:cb}));script.onerror=()=>{cleanup();reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ'))};script.src=GAS_URL+'?'+qs.toString();document.body.appendChild(script);});}
async function clearOldServiceWorker(){try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs) await r.unregister();} if(window.caches){const keys=await caches.keys(); for(const k of keys) await caches.delete(k);}}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>{clearOldServiceWorker();const input=document.getElementById('studentIdInput');input.addEventListener('input',handleTyping);input.addEventListener('keydown',e=>{if(e.key==='Enter') searchStudent()});const groupInput=document.getElementById('groupSearchInput');groupInput.addEventListener('input',handleGroupTyping);groupInput.addEventListener('keydown',e=>{if(e.key==='Enter') searchGroupStudent()});updateSaveButtonState();updateGroupSaveButtonState();input.focus();});
function showScreen(name){Object.values(screens).forEach(s=>s.classList.remove('active'));screens[name].classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}function setSearchLoading(on){document.getElementById('searchBtn').classList.toggle('loading',!!on)}function setLoading(on){document.getElementById('loading').classList.toggle('show',!!on)}function escapeHtml(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function escapeAttr(v){return escapeHtml(v).replace(/'/g,'&#39;')}
function handleTyping(){const input=document.getElementById('studentIdInput');document.getElementById('clearBtn').classList.toggle('show',!!input.value);clearTimeout(typingTimer);typingTimer=setTimeout(()=>loadSuggestions(input.value.trim()),250)}
async function loadSuggestions(q){if(q.length<2){clearSuggestions();return}setSearchLoading(true);try{const res=await jsonp('searchStudent',{q});if(res&&res.success){lastSuggestions=res.students||[];renderSuggestions(lastSuggestions,q)}else{renderMessage(res.message||'ไม่พบนักเรียน')}}catch(e){renderMessage(e.message||String(e))}finally{setSearchLoading(false)}}
function renderSuggestions(students,q){const box=document.getElementById('suggestions');if(!students.length){box.innerHTML=`<div class="p-3 text-center fw-bold text-muted">ไม่พบนักเรียนจากคำค้น “${escapeHtml(q)}”</div>`;box.classList.add('has-results');return}box.innerHTML=students.slice(0,12).map(s=>`<button class="suggestion-item" type="button" onclick="chooseStudent('${escapeAttr(s.studentId)}')"><span class="suggestion-name">${escapeHtml(s.fullName)}</span><span class="suggestion-meta">${escapeHtml(s.room)} · เลขที่ ${escapeHtml(s.number)}</span></button>`).join('');box.classList.add('has-results')}
function renderMessage(msg){const box=document.getElementById('suggestions');box.innerHTML=`<div class="p-3 text-center fw-bold text-muted">${escapeHtml(msg)}</div>`;box.classList.add('has-results')}
function clearSuggestions(){const box=document.getElementById('suggestions');box.innerHTML='';box.classList.remove('has-results')}
function clearSearchBox(){document.getElementById('studentIdInput').value='';document.getElementById('clearBtn').classList.remove('show');clearSuggestions();}
function chooseStudent(id){const found=lastSuggestions.find(s=>String(s.studentId)===String(id));if(found){selectStudent(found);return}document.getElementById('studentIdInput').value=id;searchStudent();}
async function searchStudent(){const q=document.getElementById('studentIdInput').value.trim();if(!q){Swal.fire('กรุณากรอกข้อมูล','กรอกเลขประจำตัว หรือเลือกจากรายชื่อที่ระบบแนะนำ','warning');return}setSearchLoading(true);try{const res=await jsonp('searchStudent',{q});if(!res.success){Swal.fire('ค้นหาไม่สำเร็จ',res.message||'เกิดข้อผิดพลาด','error');return}if(!res.students||!res.students.length){renderMessage('ไม่พบนักเรียนจากคำค้น “'+q+'”');return}selectStudent(res.students[0]);}catch(e){Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error')}finally{setSearchLoading(false)}}
function setGroupSearchLoading(on){document.getElementById('groupSearchBtn').classList.toggle('loading',!!on)}
function handleGroupTyping(){const input=document.getElementById('groupSearchInput');document.getElementById('groupClearBtn').classList.toggle('show',!!input.value);clearTimeout(groupTypingTimer);groupTypingTimer=setTimeout(()=>loadGroupSuggestions(input.value.trim()),250)}
async function loadGroupSuggestions(q){if(q.length<2){clearGroupSuggestions();return}setGroupSearchLoading(true);try{const res=await jsonp('searchStudent',{q});if(res&&res.success){lastGroupSuggestions=res.students||[];renderGroupSuggestions(lastGroupSuggestions,q)}else{renderGroupMessage(res.message||'ไม่พบนักเรียน')}}catch(e){renderGroupMessage(e.message||String(e))}finally{setGroupSearchLoading(false)}}
function renderGroupSuggestions(students,q){const box=document.getElementById('groupSuggestions');if(!students.length){box.innerHTML=`<div class="p-3 text-center fw-bold text-muted">ไม่พบนักเรียนจากคำค้น “${escapeHtml(q)}”</div>`;box.classList.add('has-results');return}box.innerHTML=students.slice(0,12).map(s=>`<button class="suggestion-item" type="button" onclick="addGroupStudent('${escapeAttr(s.studentId)}')"><span class="suggestion-name">${escapeHtml(s.fullName)}</span><span class="suggestion-meta">${escapeHtml(s.room)} · เลขที่ ${escapeHtml(s.number)}</span></button>`).join('');box.classList.add('has-results')}
function renderGroupMessage(msg){const box=document.getElementById('groupSuggestions');box.innerHTML=`<div class="p-3 text-center fw-bold text-muted">${escapeHtml(msg)}</div>`;box.classList.add('has-results')}
function clearGroupSuggestions(){const box=document.getElementById('groupSuggestions');box.innerHTML='';box.classList.remove('has-results')}
function clearGroupSearchBox(){document.getElementById('groupSearchInput').value='';document.getElementById('groupClearBtn').classList.remove('show');clearGroupSuggestions()}
async function searchGroupStudent(){const q=document.getElementById('groupSearchInput').value.trim();if(!q){Swal.fire('กรุณากรอกข้อมูล','กรอกเลขประจำตัว หรือเลือกจากรายชื่อที่ระบบแนะนำ','warning');return}setGroupSearchLoading(true);try{const res=await jsonp('searchStudent',{q});if(!res.success){Swal.fire('ค้นหาไม่สำเร็จ',res.message||'เกิดข้อผิดพลาด','error');return}if(!res.students||!res.students.length){renderGroupMessage('ไม่พบนักเรียนจากคำค้น “'+q+'”');return}lastGroupSuggestions=res.students;addGroupStudent(res.students[0].studentId);}catch(e){Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error')}finally{setGroupSearchLoading(false)}}
function addGroupStudent(id){const found=lastGroupSuggestions.find(s=>String(s.studentId)===String(id));if(!found)return;if(groupStudents.some(s=>String(s.studentId)===String(found.studentId))){clearGroupSearchBox();Swal.fire({toast:true,position:'top-end',icon:'info',title:'มีนักเรียนคนนี้ในกลุ่มแล้ว',showConfirmButton:false,timer:1400});return}groupStudents.push(found);clearGroupSearchBox();renderGroupStudents()}
function removeGroupStudent(id){groupStudents=groupStudents.filter(s=>String(s.studentId)!==String(id));renderGroupStudents()}
function getStudentAvatarSrc(student){const name=String(student?.fullName||'').trim();if(/^(เด็กชาย|ด\.ช\.|นาย)/.test(name))return STUDENT_BOY_IMG;if(/^(เด็กหญิง|ด\.ญ\.|นางสาว|น\.ส\.)/.test(name))return STUDENT_GIRL_IMG;return ''}
function renderAvatarHtml(student){const src=getStudentAvatarSrc(student);return src?`<img src="${src}" alt="">`:'🎓'}
function renderGroupStudents(){const list=document.getElementById('groupList');document.getElementById('groupCount').textContent=groupStudents.length?`เลือกแล้ว ${groupStudents.length} คน`:'ยังไม่ได้เลือกนักเรียน';if(!groupStudents.length){list.innerHTML='<div class="empty-state">ค้นหาแล้วเลือกนักเรียนเข้ากลุ่ม</div>';return}list.innerHTML=groupStudents.map(s=>`<div class="group-student"><div class="group-avatar">${renderAvatarHtml(s)}</div><div><div class="group-name">${escapeHtml(s.fullName||'-')}</div><div class="group-meta">${escapeHtml(s.room||'-')} · เลขที่ ${escapeHtml(s.number||'-')} · ${escapeHtml(s.studentId||'-')}</div></div><button class="remove-student" type="button" onclick="removeGroupStudent('${escapeAttr(s.studentId)}')" aria-label="ลบ">×</button></div>`).join('')}
function selectStudent(student){currentStudent=student;clearSearchBox();goToForm();}
function renderStudent(){if(!currentStudent)return;const full=`${currentStudent.room||'-'} · เลขที่ ${currentStudent.number||'-'} · เลขประจำตัว ${currentStudent.studentId||'-'}`;['studentName','formStudentName','historyStudentName'].forEach(id=>document.getElementById(id).textContent=currentStudent.fullName||'-');['studentDetail','formStudentDetail','historyStudentDetail'].forEach(id=>document.getElementById(id).textContent=full);['studentAvatar','formStudentAvatar','historyStudentAvatar'].forEach(id=>document.getElementById(id).innerHTML=renderAvatarHtml(currentStudent));document.getElementById('studentRoom').textContent='ห้อง '+(currentStudent.room||'-');document.getElementById('studentNumber').textContent='เลขที่ '+(currentStudent.number||'-');}
function goToSearch(){currentStudent=null;selectedBehaviors=[];clearSearchBox();clearGroupSearchBox();showScreen('search');setTimeout(()=>document.getElementById('studentIdInput').focus(),100)}function goToStudent(){if(!currentStudent)return goToSearch();showScreen('student')}function resetBehaviorSelection(){selectedBehaviors=[];document.querySelectorAll('#formScreen .behavior-option').forEach(e=>{e.classList.remove('active');e.setAttribute('aria-pressed','false')});updateSaveButtonState()}function resetGroupBehaviorSelection(){selectedGroupBehaviors=[];document.querySelectorAll('.group-behavior-option').forEach(e=>{e.classList.remove('active');e.setAttribute('aria-pressed','false')});updateGroupSaveButtonState()}
function updateSaveButtonState(){const btn=document.getElementById('saveBtn');if(btn)btn.disabled=selectedBehaviors.length===0}
function updateGroupSaveButtonState(){const btn=document.getElementById('groupSaveBtn');if(btn)btn.disabled=selectedGroupBehaviors.length===0}
function goToGroup(){currentStudent=null;groupStudents=[];clearGroupSearchBox();resetGroupBehaviorSelection();document.getElementById('groupNoteInput').value='';renderGroupStudents();showScreen('group');setTimeout(()=>document.getElementById('groupSearchInput').focus(),100)}function goToForm(){if(!currentStudent)return goToSearch();resetBehaviorSelection();document.getElementById('noteInput').value='';renderStudent();showScreen('form')}function selectBehavior(el,type){const isSelected=selectedBehaviors.includes(type);if(isSelected){selectedBehaviors=selectedBehaviors.filter(v=>v!==type);el.classList.remove('active');el.setAttribute('aria-pressed','false');updateSaveButtonState();return}selectedBehaviors.push(type);el.classList.add('active');el.setAttribute('aria-pressed','true');updateSaveButtonState()}function selectGroupBehavior(el,type){const isSelected=selectedGroupBehaviors.includes(type);if(isSelected){selectedGroupBehaviors=selectedGroupBehaviors.filter(v=>v!==type);el.classList.remove('active');el.setAttribute('aria-pressed','false');updateGroupSaveButtonState();return}selectedGroupBehaviors.push(type);el.classList.add('active');el.setAttribute('aria-pressed','true');updateGroupSaveButtonState()}
async function submitBehavior(){
  if(isSaving||document.getElementById('saveBtn')?.disabled)return;
  if(!currentStudent)return goToSearch();
  if(!selectedBehaviors.length){
    Swal.fire('ยังไม่ได้เลือกประเภท','กรุณาเลือกประเภทพฤติกรรมอย่างน้อย 1 รายการก่อนบันทึก','warning');
    return;
  }

  isSaving=true;
  setLoading(true);
  const note=document.getElementById('noteInput').value.trim();

  try{
    for(const behaviorType of selectedBehaviors){
      const data={
        studentId:currentStudent.studentId,
        room:currentStudent.room,
        number:currentStudent.number,
        fullName:currentStudent.fullName,
        behaviorType,
        note
      };
      const res=await jsonp('saveBehavior',data);
      if(!res.success){
        setLoading(false);
        isSaving=false;
        Swal.fire('บันทึกไม่สำเร็จ',res.message||`บันทึก ${behaviorType} ไม่สำเร็จ`,'error');
        return;
      }
    }

    const savedStudent=currentStudent;
    const savedBehaviors=[...selectedBehaviors];
    const typeList=savedBehaviors.map(type=>`<li>${escapeHtml(type)}</li>`).join('');

    setLoading(false);
    isSaving=false;

    await Swal.fire({
      icon:'success',
      title:'บันทึกเรียบร้อย!',
      html:`<div style="text-align:left;background:#f3fbff;padding:15px;border-radius:15px;margin-top:10px;font-size:16px"><b>${escapeHtml(savedStudent.fullName)}</b><br><br><b>ประเภท:</b><ul style="margin:8px 0 0 20px;padding:0;color:#2577f4;font-weight:800">${typeList}</ul><br><b>หมายเหตุ:</b> ${escapeHtml(note)||'-'}</div>`,
      confirmButtonColor:'#5ca7ff'
    });

    goToSearch();
  }catch(e){
    setLoading(false);
    isSaving=false;
    Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error');
  }
}
async function submitGroupBehavior(){
  if(isSaving||document.getElementById('groupSaveBtn')?.disabled)return;
  if(!groupStudents.length){
    Swal.fire('ยังไม่ได้เลือกนักเรียน','กรุณาเลือกนักเรียนเข้ากลุ่มอย่างน้อย 1 คน','warning');
    return;
  }
  if(!selectedGroupBehaviors.length){
    Swal.fire('ยังไม่ได้เลือกประเภท','กรุณาเลือกพฤติกรรมอย่างน้อย 1 รายการ','warning');
    return;
  }

  isSaving=true;
  setLoading(true);
  const note=document.getElementById('groupNoteInput').value.trim();

  try{
    for(const student of groupStudents){
      for(const behaviorType of selectedGroupBehaviors){
        const data={
          studentId:student.studentId,
          room:student.room,
          number:student.number,
          fullName:student.fullName,
          behaviorType,
          note
        };
        const res=await jsonp('saveBehavior',data);
        if(!res.success){
          setLoading(false);
          isSaving=false;
          Swal.fire('บันทึกไม่สำเร็จ',res.message||`บันทึก ${student.fullName} / ${behaviorType} ไม่สำเร็จ`,'error');
          return;
        }
      }
    }

    const savedStudents=[...groupStudents];
    const savedBehaviors=[...selectedGroupBehaviors];
    const studentList=savedStudents.map(s=>`<li>${escapeHtml(s.fullName||'-')}</li>`).join('');
    const typeList=savedBehaviors.map(type=>`<li>${escapeHtml(type)}</li>`).join('');

    setLoading(false);
    isSaving=false;

    await Swal.fire({
      icon:'success',
      title:'บันทึกกลุ่มเรียบร้อย!',
      html:`<div style="text-align:left;background:#f3fbff;padding:15px;border-radius:15px;margin-top:10px;font-size:16px"><b>นักเรียน ${savedStudents.length} คน</b><ul style="margin:8px 0 10px 20px;padding:0">${studentList}</ul><b>พฤติกรรม:</b><ul style="margin:8px 0 0 20px;padding:0;color:#2577f4;font-weight:800">${typeList}</ul><br><b>หมายเหตุ:</b> ${escapeHtml(note)||'-'}</div>`,
      confirmButtonColor:'#5ca7ff'
    });

    goToSearch();
  }catch(e){
    setLoading(false);
    isSaving=false;
    Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error');
  }
}
async function loadHistory(){if(!currentStudent)return goToSearch();setLoading(true);try{const res=await jsonp('getHistory',{studentId:currentStudent.studentId});if(!res.success){Swal.fire('โหลดประวัติไม่ได้',res.message||'เกิดข้อผิดพลาด','error');return}currentHistory=res.history||[];renderStudent();renderHistory(currentHistory);showScreen('history')}catch(e){Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error')}finally{setLoading(false)}}
function renderHistory(history){const list=document.getElementById('historyList');document.getElementById('pdfBtn').style.display=history.length?'inline-flex':'none';if(!history.length){list.innerHTML='<div class="empty-state">ยังไม่มีประวัติพฤติกรรม</div>';return}list.innerHTML=history.map(item=>`<div class="history-item"><div class="history-date">${escapeHtml(item.date||'-')} เวลา ${escapeHtml(item.time||'-')}</div><div class="history-type"><span class="badge text-bg-secondary">${escapeHtml(item.behaviorType||'-')}</span></div>${item.note?`<div class="history-note"><b>หมายเหตุ:</b> ${escapeHtml(item.note)}</div>`:''}</div>`).join('')}
function exportHistoryPdf(){if(!currentStudent)return;if(!currentHistory.length){Swal.fire('ยังไม่มีข้อมูล','ไม่มีประวัติสำหรับส่งออก PDF','info');return}const rows=currentHistory.map((item,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(item.date||'-')}</td><td>${escapeHtml(item.time||'-')}</td><td>${escapeHtml(item.behaviorType||'-')}</td><td>${escapeHtml(item.note||'-')}</td></tr>`).join('');const html=`<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>ประวัติพฤติกรรม ${escapeHtml(currentStudent.fullName||'')}</title><link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet"><style>*{box-sizing:border-box;font-family:'LINE Seed Sans TH','Noto Sans Thai',Arial,sans-serif}body{margin:0;padding:28px;color:#172033}h1{font-size:26px;margin:0 0 8px}.meta{font-weight:700;color:#58657a;margin-bottom:20px}.card{border:1px solid #d9e2ef;border-radius:16px;padding:18px;margin-bottom:18px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #d9e2ef;padding:10px;text-align:left;vertical-align:top}th{background:#eef6ff;font-weight:900}.footer{margin-top:18px;color:#697386;font-size:12px}@media print{body{padding:18mm}.no-print{display:none}}</style></head><body><div class="card"><h1>ประวัติพฤติกรรม</h1><div class="meta">${escapeHtml(currentStudent.fullName||'-')}<br>${escapeHtml(currentStudent.room||'-')} · เลขที่ ${escapeHtml(currentStudent.number||'-')} · เลขประจำตัว ${escapeHtml(currentStudent.studentId||'-')}</div></div><table><thead><tr><th>#</th><th>วันที่</th><th>เวลา</th><th>พฤติกรรม</th><th>หมายเหตุ</th></tr></thead><tbody>${rows}</tbody></table><div class="footer">ส่งออกจาก M1 Good Good</div><script>window.addEventListener('load',()=>setTimeout(()=>window.print(),250));<\\/script></body></html>`;const win=window.open('','_blank');if(!win){Swal.fire('เปิดหน้าต่างไม่ได้','กรุณาอนุญาต popup เพื่อส่งออก PDF','warning');return}win.document.open();win.document.write(html);win.document.close()}
