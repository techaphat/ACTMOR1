<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>M1 Good Good | ระบบบันทึกพฤติกรรมนักเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1pg6mdHDSxiEVWfW58QHkncqzd8jt_YNS&sz=w1000">
  <meta name="theme-color" content="#fff7fb">
  <style>
    :root{
      --pink:#ff8fbc; --pink-dark:#f05b93; --blue:#75b8ff; --green:#55c78a; --orange:#ffae42; --red:#ef5b5b;
      --ink:#3f3b52; --muted:#7b7890; --line:rgba(143,132,170,.18); --card:rgba(255,255,255,.94);
      --shadow:0 16px 40px rgba(96,79,122,.16);
    }
    *{box-sizing:border-box;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;color:var(--ink)}
    body{background:radial-gradient(circle at 15% 8%,rgba(255,194,219,.75) 0,transparent 28%),radial-gradient(circle at 86% 10%,rgba(196,232,255,.82) 0,transparent 30%),linear-gradient(135deg,#fff7ec,#eef8ff)}
    .app-shell{min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .app{width:100%;max-width:1040px;min-height:min(780px,calc(100dvh - 28px));background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.82);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px}
    .screen{display:none;width:100%;animation:fadeScale .25s ease-out}.screen.active{display:block}
    @keyframes fadeScale{from{opacity:0;transform:scale(.98) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .panel,.student-card,.section-card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 28px rgba(96,79,122,.10)}
    .panel{width:100%;max-width:560px;padding:24px;margin:0 auto;position:relative}
    .brand-logo{width:min(160px,48vw);display:block;margin:0 auto 10px;border-radius:24px;object-fit:contain}
    h1{font-size:clamp(30px,7vw,42px);font-weight:900;letter-spacing:-.5px;margin:0;text-align:center}.subtitle{text-align:center;color:var(--muted);font-weight:800;margin:4px 0 18px}
    .search-wrap{position:relative}.search-row{display:flex;width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 18px rgba(96,79,122,.07)}
    .search-input{border:0;outline:0;flex:1;min-width:0;min-height:58px;padding:0 14px;font-size:20px!important;font-weight:900;color:var(--ink);background:#fff}
    .clear-btn{width:38px;border:0;background:#fff;color:#9b4a83;font-size:24px;font-weight:900;display:none}.clear-btn.show{display:block}
    .search-btn{width:58px;min-height:58px;border:0;background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:#fff;display:flex;align-items:center;justify-content:center}
    .search-btn svg{width:23px;height:23px;stroke-width:2.8}.search-btn.loading svg{display:none}.search-btn.loading:before{content:'';width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.55);border-top-color:#fff;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .suggestions{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;display:none;max-height:280px;overflow:auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 34px rgba(96,79,122,.18)}
    .suggestions.has-results{display:grid;gap:8px}.suggestion-item{width:100%;min-height:58px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;font-weight:900;color:var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:center}.suggestion-item:hover{background:#fff7fb}.suggestion-meta{font-size:13px;color:var(--muted);font-weight:900;white-space:nowrap}.suggestion-name{line-height:1.25;word-break:break-word}.hint{text-align:center;color:var(--muted);font-weight:800;margin-top:16px;font-size:14px}
    .btn{min-height:50px;border:0;border-radius:18px;font-weight:900;box-shadow:0 10px 20px rgba(96,79,122,.12);display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:#fff}.btn-soft{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-green{background:linear-gradient(135deg,#40bb7a,#83dda9);color:#fff}.btn-orange{background:linear-gradient(135deg,#ff9e32,#ffc46f);color:#fff}
    .topbar{display:flex;align-items:center;gap:10px;margin:0 auto 14px;max-width:980px;width:100%}.back-btn{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:900;font-size:22px}.page-title{font-size:20px;font-weight:900}.main-layout{display:grid;gap:14px;max-width:980px;margin:0 auto;width:100%}
    .student-card,.section-card{padding:18px}.profile-row{display:flex;gap:14px;align-items:center}.avatar{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#bde0fe,#ffd6e7);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}.student-name{font-size:clamp(24px,6vw,32px);font-weight:900;line-height:1.12;word-break:break-word}.student-sub{color:var(--muted);font-weight:800;margin-top:4px}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.info-pill{border-radius:18px;background:#f8f7ff;border:1px solid var(--line);padding:12px;font-weight:900;text-align:center;min-height:48px}.button-stack{display:grid;gap:10px;margin-top:14px}
    .section-title{font-size:20px;font-weight:900;margin:0 0 14px;display:flex;align-items:center;gap:8px}.behavior-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.behavior-option{min-height:78px;border-radius:20px;border:2px solid transparent;background:#fff;box-shadow:0 8px 18px rgba(96,79,122,.08);padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;font-weight:900;cursor:pointer;text-align:left}.behavior-option .emoji{font-size:24px}.behavior-option small{color:var(--muted);font-weight:800}.behavior-option.active{border-color:var(--pink-dark);background:#fff0f6;box-shadow:0 0 0 4px rgba(240,91,147,.12)}textarea.form-control{min-height:100px;border-radius:18px;border:1px solid var(--line);font-weight:700;resize:vertical}.history-list{display:grid;gap:10px}.history-item{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.history-date{color:var(--muted);font-weight:800;font-size:14px}.history-type{font-weight:900;font-size:17px;margin-top:4px}.history-note{margin-top:6px;color:var(--ink);background:#fff7fb;border-radius:14px;padding:8px 10px}.empty-state{text-align:center;color:var(--muted);font-weight:900;padding:28px 10px}.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999}.loading-overlay.show{display:flex}.loader-card{background:#fff;border-radius:24px;padding:22px 26px;box-shadow:var(--shadow);font-weight:900;text-align:center}.spinner{width:36px;height:36px;border-radius:50%;border:4px solid #ffd6e7;border-top-color:var(--pink-dark);animation:spin .8s linear infinite;margin:0 auto}
    @media (min-width:700px){.button-stack{grid-template-columns:1fr 1fr}.button-stack .wide{grid-column:1/-1}.behavior-grid{grid-template-columns:repeat(3,1fr)}}
    @media (min-width:980px){.main-layout.two-col,.main-layout.history-layout{grid-template-columns:.9fr 1.1fr;align-items:start}.button-stack{grid-template-columns:1fr}.button-stack .wide{grid-column:auto}}
    @media (max-width:700px){.app-shell{padding:10px;align-items:stretch}.app{min-height:calc(100dvh - 20px);max-width:100%;border-radius:22px;padding:12px}.panel{padding:18px}.brand-logo{width:min(145px,46vw)}.info-grid{grid-template-columns:1fr}.student-card,.section-card{padding:14px}.suggestions{max-height:45dvh}.button-stack .btn{width:100%;white-space:normal;min-height:54px}}
  </style>
</head>
<body>
  <div class="app-shell"><main class="app">
    <section id="searchScreen" class="screen active">
      <div class="panel">
        <img class="brand-logo" src="https://drive.google.com/thumbnail?id=1pg6mdHDSxiEVWfW58QHkncqzd8jt_YNS&sz=w1000" alt="M1 Good Good Logo">
        <h1>M1 Good Good</h1><div class="subtitle">ระบบบันทึกพฤติกรรมนักเรียน</div>
        <label class="form-label fw-bold" for="studentIdInput">ค้นหานักเรียน</label>
        <div class="search-wrap">
          <div class="search-row">
            <input id="studentIdInput" class="search-input" type="search" placeholder="กรอกเลขประจำตัว หรือพิมพ์ชื่อ" autocomplete="off">
            <button id="clearBtn" class="clear-btn" type="button" onclick="clearSearchBox()">×</button>
            <button id="searchBtn" class="search-btn" type="button" onclick="searchStudent()" aria-label="ค้นหา">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            </button>
          </div>
          <div id="suggestions" class="suggestions"></div>
        </div>
        <button id="refreshBtn" class="btn btn-soft w-100 mt-3" type="button" onclick="refreshStudents()">🔄 อัปเดตรายชื่อนักเรียน</button>
        <a class="btn btn-soft w-100 mt-2" href="dashboard-v2.html">📊 เปิด M1 DD Dashboard</a>
        <div class="hint">พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อให้ระบบช่วยค้นหา</div>
      </div>
    </section>
    <section id="studentScreen" class="screen"><div class="topbar"><button class="back-btn" onclick="goToSearch()">‹</button><div class="page-title">ข้อมูลนักเรียน</div></div><div class="main-layout"><div class="student-card"><div class="profile-row"><div class="avatar">🎓</div><div class="min-w-0"><div id="studentName" class="student-name">-</div><div id="studentDetail" class="student-sub"></div></div></div><div class="info-grid"><div id="studentRoom" class="info-pill">ห้อง -</div><div id="studentNumber" class="info-pill">เลขที่ -</div></div><div class="button-stack"><button class="btn btn-primary" onclick="goToForm()">📝 บันทึกพฤติกรรม</button><button class="btn btn-green" onclick="loadHistory()">🕘 ดูประวัติ</button><button class="btn btn-soft wide" onclick="goToSearch()">🔎 ค้นหาคนใหม่</button></div></div></div></section>
    <section id="formScreen" class="screen"><div class="topbar"><button class="back-btn" onclick="goToStudent()">‹</button><div class="page-title">บันทึกพฤติกรรม</div></div><div class="main-layout two-col"><div class="student-card"><div class="profile-row"><div class="avatar">🎓</div><div><div id="formStudentName" class="student-name">-</div><div id="formStudentDetail" class="student-sub"></div></div></div></div><div class="section-card"><h2 class="section-title">📋 เลือกประเภทพฤติกรรม</h2><div class="behavior-grid"><button class="behavior-option" onclick="selectBehavior(this,'สายเช้า')"><span class="emoji">🌅</span><span>สายเช้า</span><small>มาไม่ทันช่วงเช้า</small></button><button class="behavior-option" onclick="selectBehavior(this,'สายเที่ยง')"><span class="emoji">☀️</span><span>สายเที่ยง</span><small>เข้าแถวเที่ยงช้า</small></button><button class="behavior-option" onclick="selectBehavior(this,'สายพัก 10')"><span class="emoji">🕙</span><span>สายพัก 10</span><small>กลับจากพักช้า</small></button><button class="behavior-option" onclick="selectBehavior(this,'ขาดแถวเที่ยง')"><span class="emoji">🚶‍♂️</span><span>ขาดแถวเที่ยง</span><small>ไม่มาเข้าแถว</small></button><button class="behavior-option" onclick="selectBehavior(this,'เครื่องแต่งกาย')"><span class="emoji">👕</span><span>เครื่องแต่งกาย</span><small>ตรวจระเบียบ</small></button><button class="behavior-option" onclick="selectBehavior(this,'อื่น ๆ')"><span class="emoji">📝</span><span>อื่น ๆ</span><small>ระบุหมายเหตุ</small></button></div><label class="form-label fw-bold mt-3" for="noteInput">หมายเหตุ</label><textarea id="noteInput" class="form-control" placeholder="เช่น มาเข้าแถวช้า / แต่งกายไม่เรียบร้อย / อื่น ๆ"></textarea><button id="saveBtn" class="btn btn-primary w-100 mt-3" onclick="submitBehavior()">💾 บันทึก</button></div></div></section>
    <section id="historyScreen" class="screen"><div class="topbar"><button class="back-btn" onclick="goToStudent()">‹</button><div class="page-title">ประวัติพฤติกรรม</div></div><div class="main-layout history-layout"><div class="student-card"><div class="profile-row"><div class="avatar">🎓</div><div><div id="historyStudentName" class="student-name">-</div><div id="historyStudentDetail" class="student-sub"></div></div></div></div><div class="section-card"><h2 class="section-title">🕘 รายการย้อนหลัง</h2><div id="historyList" class="history-list"></div></div></div></section>
  </main></div>
  <div id="loading" class="loading-overlay"><div class="loader-card"><div class="spinner"></div><div class="mt-2">กำลังทำงาน...</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzQ8YCMoXcem6E64Eqfdbl-7ogx5mIfVor6kjV5xivy34xSjItMmU56rGVN6KhU-YAgiA/exec';
let currentStudent=null, selectedBehavior='', typingTimer=null, lastSuggestions=[], isSaving=false;
const screens={search:document.getElementById('searchScreen'),student:document.getElementById('studentScreen'),form:document.getElementById('formScreen'),history:document.getElementById('historyScreen')};
function jsonp(action,params={}){return new Promise((resolve,reject)=>{const cb='m1gg_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);const script=document.createElement('script');const timeout=setTimeout(()=>{cleanup();reject(new Error('เชื่อมต่อช้าเกินไป กรุณาลองใหม่'));},12000);function cleanup(){clearTimeout(timeout);delete window[cb];script.remove();}window[cb]=data=>{cleanup();resolve(data)};const qs=new URLSearchParams(Object.assign({},params,{action,callback:cb}));script.onerror=()=>{cleanup();reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ'))};script.src=GAS_URL+'?'+qs.toString();document.body.appendChild(script);});}
async function clearOldServiceWorker(){try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs) await r.unregister();} if(window.caches){const keys=await caches.keys(); for(const k of keys) await caches.delete(k);}}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>{clearOldServiceWorker();const input=document.getElementById('studentIdInput');input.addEventListener('input',handleTyping);input.addEventListener('keydown',e=>{if(e.key==='Enter') searchStudent()});input.focus();});
function showScreen(name){Object.values(screens).forEach(s=>s.classList.remove('active'));screens[name].classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}function setSearchLoading(on){document.getElementById('searchBtn').classList.toggle('loading',!!on)}function setLoading(on){document.getElementById('loading').classList.toggle('show',!!on)}function escapeHtml(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function escapeAttr(v){return escapeHtml(v).replace(/'/g,'&#39;')}
function handleTyping(){const input=document.getElementById('studentIdInput');document.getElementById('clearBtn').classList.toggle('show',!!input.value);clearTimeout(typingTimer);typingTimer=setTimeout(()=>loadSuggestions(input.value.trim()),250)}
async function loadSuggestions(q){if(q.length<2){clearSuggestions();return}setSearchLoading(true);try{const res=await jsonp('searchStudent',{q});if(res&&res.success){lastSuggestions=res.students||[];renderSuggestions(lastSuggestions,q)}else{renderMessage(res.message||'ไม่พบนักเรียน')}}catch(e){renderMessage(e.message||String(e))}finally{setSearchLoading(false)}}
function renderSuggestions(students,q){const box=document.getElementById('suggestions');if(!students.length){box.innerHTML=`<div class="p-3 text-center fw-bold text-muted">ไม่พบนักเรียนจากคำค้น “${escapeHtml(q)}”</div>`;box.classList.add('has-results');return}box.innerHTML=students.slice(0,12).map(s=>`<button class="suggestion-item" type="button" onclick="chooseStudent('${escapeAttr(s.studentId)}')"><span class="suggestion-name">${escapeHtml(s.fullName)}</span><span class="suggestion-meta">${escapeHtml(s.room)} · เลขที่ ${escapeHtml(s.number)}</span></button>`).join('');box.classList.add('has-results')}
function renderMessage(msg){const box=document.getElementById('suggestions');box.innerHTML=`<div class="p-3 text-center fw-bold text-muted">${escapeHtml(msg)}</div>`;box.classList.add('has-results')}
function clearSuggestions(){const box=document.getElementById('suggestions');box.innerHTML='';box.classList.remove('has-results')}
function clearSearchBox(){document.getElementById('studentIdInput').value='';document.getElementById('clearBtn').classList.remove('show');clearSuggestions();}
function chooseStudent(id){const found=lastSuggestions.find(s=>String(s.studentId)===String(id));if(found){selectStudent(found);return}document.getElementById('studentIdInput').value=id;searchStudent();}
async function searchStudent(){const q=document.getElementById('studentIdInput').value.trim();if(!q){Swal.fire('กรุณากรอกข้อมูล','กรอกเลขประจำตัว หรือเลือกจากรายชื่อที่ระบบแนะนำ','warning');return}setSearchLoading(true);try{const res=await jsonp('searchStudent',{q});if(!res.success){Swal.fire('ค้นหาไม่สำเร็จ',res.message||'เกิดข้อผิดพลาด','error');return}if(!res.students||!res.students.length){renderMessage('ไม่พบนักเรียนจากคำค้น “'+q+'”');return}selectStudent(res.students[0]);}catch(e){Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error')}finally{setSearchLoading(false)}}
function selectStudent(student){currentStudent=student;clearSearchBox();renderStudent();showScreen('student');}
function renderStudent(){if(!currentStudent)return;const full=`${currentStudent.room||'-'} · เลขที่ ${currentStudent.number||'-'} · เลขประจำตัว ${currentStudent.studentId||'-'}`;['studentName','formStudentName','historyStudentName'].forEach(id=>document.getElementById(id).textContent=currentStudent.fullName||'-');['studentDetail','formStudentDetail','historyStudentDetail'].forEach(id=>document.getElementById(id).textContent=full);document.getElementById('studentRoom').textContent='ห้อง '+(currentStudent.room||'-');document.getElementById('studentNumber').textContent='เลขที่ '+(currentStudent.number||'-');}
function goToSearch(){currentStudent=null;selectedBehavior='';clearSearchBox();showScreen('search');setTimeout(()=>document.getElementById('studentIdInput').focus(),100)}function goToStudent(){if(!currentStudent)return goToSearch();showScreen('student')}function goToForm(){if(!currentStudent)return goToSearch();selectedBehavior='';document.querySelectorAll('.behavior-option').forEach(e=>e.classList.remove('active'));document.getElementById('noteInput').value='';renderStudent();showScreen('form')}function selectBehavior(el,type){selectedBehavior=type;document.querySelectorAll('.behavior-option').forEach(e=>e.classList.remove('active'));el.classList.add('active')}
async function submitBehavior(){if(isSaving)return;if(!currentStudent)return goToSearch();if(!selectedBehavior){Swal.fire('ยังไม่ได้เลือกประเภท','กรุณาเลือกประเภทพฤติกรรมก่อนบันทึก','warning');return}isSaving=true;setLoading(true);const data={studentId:currentStudent.studentId,room:currentStudent.room,number:currentStudent.number,fullName:currentStudent.fullName,behaviorType:selectedBehavior,note:document.getElementById('noteInput').value.trim()};try{const res=await jsonp('saveBehavior',data);if(!res.success){Swal.fire('บันทึกไม่สำเร็จ',res.message||'เกิดข้อผิดพลาด','error');return}await Swal.fire({icon:'success',title:'บันทึกเรียบร้อย!',html:`<div style="text-align:left;background:#fff7fb;padding:15px;border-radius:15px;margin-top:10px;font-size:16px"><b>${escapeHtml(currentStudent.fullName)}</b><br><br><b>ประเภท:</b> <span style="color:#f05b93">${escapeHtml(selectedBehavior)}</span><br><b>หมายเหตุ:</b> ${escapeHtml(data.note)||'-'}</div>`,confirmButtonColor:'#f05b93'});goToSearch();}catch(e){Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error')}finally{isSaving=false;setLoading(false)}}
async function loadHistory(){if(!currentStudent)return goToSearch();setLoading(true);try{const res=await jsonp('getHistory',{studentId:currentStudent.studentId});if(!res.success){Swal.fire('โหลดประวัติไม่ได้',res.message||'เกิดข้อผิดพลาด','error');return}renderStudent();renderHistory(res.history||[]);showScreen('history')}catch(e){Swal.fire('เชื่อมต่อไม่ได้',e.message||String(e),'error')}finally{setLoading(false)}}
function renderHistory(history){const list=document.getElementById('historyList');if(!history.length){list.innerHTML='<div class="empty-state">🙂<br>ยังไม่มีประวัติพฤติกรรม</div>';return}list.innerHTML=history.map(item=>`<div class="history-item"><div class="history-date">${escapeHtml(item.date||'-')} เวลา ${escapeHtml(item.time||'-')}</div><div class="history-type"><span class="badge text-bg-secondary">${escapeHtml(item.behaviorType||'-')}</span></div>${item.note?`<div class="history-note"><b>หมายเหตุ:</b> ${escapeHtml(item.note)}</div>`:''}</div>`).join('')}
function refreshStudents(){clearSuggestions();clearSearchBox();Swal.fire({toast:true,position:'top-end',icon:'success',title:'พร้อมค้นหารายชื่อนักเรียนล่าสุดแล้ว',showConfirmButton:false,timer:1600});}
</script>
