<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>M1 Good Good</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#fff7fb" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    :root {
      --pink:#ff8fbc; --pink-dark:#f05b93; --blue:#75b8ff; --green:#55c78a;
      --orange:#ffae42; --red:#ef5b5b; --ink:#433d5b; --muted:#817991;
      --line:rgba(110,95,140,.16); --card:rgba(255,255,255,.92);
      --shadow:0 24px 70px rgba(75,68,102,.14);
    }
    *{box-sizing:border-box;font-family: system-ui,-apple-system,BlinkMacSystemFont,"Sarabun","Noto Sans Thai",sans-serif}
    body{margin:0;min-height:100vh;color:var(--ink);background:
      radial-gradient(circle at 10% 20%, rgba(255,143,188,.35), transparent 34%),
      radial-gradient(circle at 90% 10%, rgba(117,184,255,.35), transparent 30%),
      linear-gradient(135deg,#fff7fb,#eef8ff);}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(640px,100%);background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:30px;box-shadow:var(--shadow);padding:28px}
    .logo{width:96px;height:96px;display:block;margin:0 auto 12px;border-radius:24px}
    h1{text-align:center;font-size:clamp(34px,6vw,48px);margin:0;font-weight:900;letter-spacing:-1px}
    .sub{text-align:center;color:var(--muted);font-weight:800;margin:4px 0 24px}
    label{display:block;font-weight:900;margin:0 0 8px}
    .searchbar{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:white;box-shadow:0 8px 20px rgba(75,68,102,.06)}
    input,textarea,button,select{font-size:18px}
    input{flex:1;border:0;padding:16px;outline:0;font-weight:800;min-width:0}
    .clear{border:0;background:white;color:#566;min-width:44px;font-weight:900}
    .search{border:0;background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:white;min-width:76px;font-weight:900}
    .ghost{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;margin-top:14px;font-weight:900;color:var(--ink);box-shadow:0 8px 20px rgba(75,68,102,.06)}
    .hint,.status{text-align:center;color:var(--muted);font-weight:800;margin:14px 0 0}
    .status.err{color:var(--red)} .status.ok{color:var(--green)}
    .list{display:grid;gap:10px;margin-top:14px}
    .student-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px;text-align:left;font-weight:900;color:var(--ink);box-shadow:0 8px 18px rgba(75,68,102,.06)}
    .student-btn small{display:block;color:var(--muted);margin-top:4px;font-weight:800}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
    .back{border:0;background:#fff;border-radius:16px;width:48px;height:48px;font-weight:900;box-shadow:0 8px 18px rgba(75,68,102,.08)}
    .pill{display:inline-flex;align-items:center;justify-content:center;background:#f8f4ff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:900;color:var(--muted)}
    .profile{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
    .name{font-size:clamp(24px,5vw,34px);font-weight:900}
    .meta{color:var(--muted);font-weight:900;margin-top:4px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .option{border:2px solid transparent;background:#fff;border-radius:20px;padding:14px;min-height:72px;font-weight:900;text-align:left;box-shadow:0 8px 18px rgba(75,68,102,.06)}
    .option.active{border-color:var(--pink-dark);background:#fff0f6}
    textarea{width:100%;border:1px solid var(--line);border-radius:20px;padding:14px;font-weight:800;min-height:96px;outline:0;resize:vertical;margin-top:14px}
    .save{width:100%;border:0;background:linear-gradient(135deg,#40bb7a,#82dca8);color:#fff;border-radius:20px;padding:16px;margin-top:14px;font-weight:900}
    .dash{display:block;text-align:center;text-decoration:none;color:var(--ink);font-weight:900;margin-top:18px}
    .hidden{display:none!important}
    .spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.55);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.wrap{padding:14px}.card{padding:22px;border-radius:28px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" id="searchScreen">
      <img class="logo" src="icons/icon-192.png" alt="M1 Good Good">
      <h1>M1 Good Good</h1>
      <div class="sub">ระบบบันทึกพฤติกรรมนักเรียน</div>

      <label for="q">ค้นหานักเรียน</label>
      <div class="searchbar">
        <input id="q" autocomplete="off" placeholder="พิมพ์เลขประจำตัว / ชื่อ / ห้อง" />
        <button class="clear" id="clearBtn" title="ล้าง">×</button>
        <button class="search" id="searchBtn">⌕</button>
      </div>

      <button class="ghost" id="refreshBtn">↻ อัปเดตรายชื่อนักเรียน</button>
      <div id="status" class="status">พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อให้ระบบช่วยค้นหา</div>
      <div id="list" class="list"></div>
      <a class="dash" href="dashboard.html">เปิด M1 DD Dashboard →</a>
    </section>

    <section class="card hidden" id="recordScreen">
      <div class="top">
        <button class="back" id="backBtn">‹</button>
        <span class="pill">บันทึกพฤติกรรม</span>
      </div>

      <div class="profile">
        <div class="name" id="studentName">-</div>
        <div class="meta" id="studentMeta">-</div>
      </div>

      <label>เลือกประเภทพฤติกรรม</label>
      <div class="grid" id="behaviorGrid"></div>

      <textarea id="note" placeholder="หมายเหตุเพิ่มเติม (ไม่บังคับ)"></textarea>
      <button class="save" id="saveBtn">บันทึกข้อมูล</button>
      <div id="recordStatus" class="status"></div>
      <div id="history" class="list"></div>
    </section>
  </main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzQ8YCMoXcem6E64Eqfdbl-7ogx5mIfVor6kjV5xivy34xSjItMmU56rGVN6KhU-YAgiA/exec";
const BEHAVIOR_TYPES = ['สายเช้า','สายเที่ยง','สายพัก 10','ขาดแถวเที่ยง','เครื่องแต่งกาย','อื่น ๆ'];

let currentStudent = null;
let selectedBehavior = '';
let isBusy = false;
let searchTimer = null;

const $ = id => document.getElementById(id);

function jsonp(params, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cb = '__m1gg_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = new URL(GAS_URL);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v == null ? '' : String(v)));
    url.searchParams.set('callback', cb);

    const script = document.createElement('script');
    let done = false;

    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('เชื่อมต่อช้าเกินไป กรุณาลองใหม่'));
    }, timeoutMs);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    }

    window[cb] = data => {
      if (done) return;
      done = true;
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ'));
    };

    script.src = url.toString();
    document.body.appendChild(script);
  });
}

function setStatus(text, type='') {
  $('status').textContent = text;
  $('status').className = 'status ' + type;
}

function setRecordStatus(text, type='') {
  $('recordStatus').textContent = text;
  $('recordStatus').className = 'status ' + type;
}

function setSearchBusy(busy) {
  isBusy = busy;
  $('searchBtn').disabled = busy;
  $('searchBtn').innerHTML = busy ? '<span class="spinner"></span>กำลังทำงาน...' : '⌕';
}

function escapeHtml(v) {
  return String(v || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

async function searchStudent() {
  const q = $('q').value.trim();
  $('list').innerHTML = '';

  if (q.length < 2) {
    setStatus('พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อให้ระบบช่วยค้นหา');
    return;
  }

  setSearchBusy(true);
  setStatus('กำลังค้นหานักเรียน...');

  try {
    const res = await jsonp({ action:'searchStudent', q });
    if (!res.success) throw new Error(res.message || 'ค้นหาไม่สำเร็จ');

    const students = res.students || [];
    if (!students.length) {
      setStatus('ไม่พบนักเรียนจากคำค้นนี้', 'err');
      return;
    }

    setStatus(`พบ ${students.length} รายการ`, 'ok');
    $('list').innerHTML = students.map((s, i) => `
      <button class="student-btn" data-i="${i}">
        ${escapeHtml(s.fullName)}
        <small>รหัส ${escapeHtml(s.studentId)} · ห้อง ${escapeHtml(s.room)} · เลขที่ ${escapeHtml(s.number)}</small>
      </button>
    `).join('');

    [...document.querySelectorAll('.student-btn')].forEach(btn => {
      btn.addEventListener('click', () => selectStudent(students[Number(btn.dataset.i)]));
    });
  } catch (err) {
    setStatus(err.message, 'err');
  } finally {
    setSearchBusy(false);
  }
}

function selectStudent(s) {
  currentStudent = s;
  selectedBehavior = '';
  $('studentName').textContent = s.fullName;
  $('studentMeta').textContent = `รหัส ${s.studentId} · ห้อง ${s.room} · เลขที่ ${s.number}`;
  $('note').value = '';
  setRecordStatus('');
  renderBehavior();
  $('searchScreen').classList.add('hidden');
  $('recordScreen').classList.remove('hidden');
  loadHistory();
}

function renderBehavior() {
  $('behaviorGrid').innerHTML = BEHAVIOR_TYPES.map(t => `
    <button class="option ${selectedBehavior === t ? 'active' : ''}" data-type="${t}">${t}</button>
  `).join('');
  [...document.querySelectorAll('.option')].forEach(btn => {
    btn.addEventListener('click', () => {
      selectedBehavior = btn.dataset.type;
      renderBehavior();
    });
  });
}

async function loadHistory() {
  if (!currentStudent) return;
  $('history').innerHTML = '';
  try {
    const res = await jsonp({ action:'getHistory', studentId: currentStudent.studentId });
    const items = res.history || [];
    if (!items.length) return;
    $('history').innerHTML = '<div class="status">ประวัติล่าสุด</div>' + items.slice(0,5).map(h => `
      <div class="student-btn">
        ${escapeHtml(h.behaviorType)}
        <small>${escapeHtml(h.date)} ${escapeHtml(h.time)} ${h.note ? '· ' + escapeHtml(h.note) : ''}</small>
      </div>
    `).join('');
  } catch(e) {}
}

async function saveBehavior() {
  if (!currentStudent) return;
  if (!selectedBehavior) {
    setRecordStatus('กรุณาเลือกประเภทพฤติกรรม', 'err');
    return;
  }

  $('saveBtn').disabled = true;
  $('saveBtn').innerHTML = '<span class="spinner"></span>กำลังบันทึก...';
  setRecordStatus('กำลังบันทึกข้อมูล...');

  try {
    const res = await jsonp({
      action:'saveBehavior',
      studentId: currentStudent.studentId,
      room: currentStudent.room,
      number: currentStudent.number,
      fullName: currentStudent.fullName,
      behaviorType: selectedBehavior,
      note: $('note').value.trim()
    });

    if (!res.success) throw new Error(res.message || 'บันทึกไม่สำเร็จ');

    setRecordStatus('บันทึกข้อมูลเรียบร้อยแล้ว', 'ok');
    selectedBehavior = '';
    $('note').value = '';
    renderBehavior();
    loadHistory();
  } catch (err) {
    setRecordStatus(err.message, 'err');
  } finally {
    $('saveBtn').disabled = false;
    $('saveBtn').textContent = 'บันทึกข้อมูล';
  }
}

$('searchBtn').addEventListener('click', searchStudent);
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchStudent, 450);
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchStudent();
});
$('clearBtn').addEventListener('click', () => {
  $('q').value = '';
  $('list').innerHTML = '';
  setStatus('พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อให้ระบบช่วยค้นหา');
});
$('refreshBtn').addEventListener('click', searchStudent);
$('backBtn').addEventListener('click', () => {
  $('recordScreen').classList.add('hidden');
  $('searchScreen').classList.remove('hidden');
});
$('saveBtn').addEventListener('click', saveBehavior);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});
}
</script>
</body>
</html>
