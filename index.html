<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>M1 Good Good | ระบบบันทึกพฤติกรรมนักเรียน</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fff7fb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1pg6mdHDSxiEVWfW58QHkncqzd8jt_YNS&sz=w1000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="M1 Good Good">
  <meta name="theme-color" content="#fff7fb">

  <style>
    :root{
      --pink:#ff8fbc;
      --pink-dark:#f05b93;
      --blue:#75b8ff;
      --green:#55c78a;
      --orange:#ffae42;
      --red:#ef5b5b;
      --ink:#3f3b52;
      --muted:#7b7890;
      --line:rgba(143,132,170,.18);
      --card:rgba(255,255,255,.92);
      --shadow:0 16px 40px rgba(96,79,122,.16);
      --vv-left:0px;
      --vv-top:0px;
      --vv-width:100vw;
      --vv-height:100vh;
    }
    *{box-sizing:border-box;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
    
    html, body {
      margin: 0; padding: 0;
      width: 100%; min-width: 0; height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      color: var(--ink);
      overscroll-behavior-x: none;
    }
    
    body {
      background:
        radial-gradient(circle at 15% 8%,rgba(255,194,219,.75) 0,transparent 28%),
        radial-gradient(circle at 86% 10%,rgba(196,232,255,.82) 0,transparent 30%),
        linear-gradient(135deg,#fff7ec,#eef8ff);
    }

    .app-shell {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)) 14px;
      display: flex;
      flex-direction: column;
      width: 100vw;
      max-width: 100vw;
    }

    .app {
      width: 100%;
      max-width: 1040px;
      min-width: 0;
      min-height: 100%;
      margin: 0 auto;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    button,input,textarea,select{font-size:18px!important}
    
    .screen { display: none; width: 100%; }
    .screen.active { 
      display: block; 
      margin-top: auto; 
      margin-bottom: auto; 
      animation: fadeScale 0.3s ease-out;
    }

    @keyframes fadeScale {
      0% { opacity: 0; transform: scale(0.97) translateY(15px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .panel,.student-card,.section-card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 28px rgba(96,79,122,.10)}
    .panel{width:100%;max-width:560px;padding:24px;margin:0 auto;min-width:0}
    .brand-logo{width:min(190px,58vw);display:block;margin:0 auto 12px;border-radius:24px}
    h1{font-size:clamp(28px,7vw,42px);font-weight:900;letter-spacing:-.5px;margin:0;text-align:center}
    .subtitle{text-align:center;color:var(--muted);font-weight:700;margin:6px 0 18px}
    .form-control,.form-select{min-height:54px;border-radius:18px;border:1px solid var(--line);font-weight:700;background:#fff;max-width:100%}
    .input-group .form-control{border-radius:18px 0 0 18px}
    .input-group .btn{border-radius:0 18px 18px 0}
    .btn{min-height:48px;border:0;border-radius:18px;font-weight:900;box-shadow:0 10px 20px rgba(96,79,122,.12);display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
    .btn-primary{background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:#fff}
    .btn-soft{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .btn-green{background:linear-gradient(135deg,#40bb7a,#83dda9);color:#fff}
    .btn-orange{background:linear-gradient(135deg,#ff9e32,#ffc46f);color:#fff}
    .btn:disabled{opacity:.65;box-shadow:none}
    .suggestions{margin-top:10px;display:none;gap:8px;max-height:260px;overflow:auto}
    .suggestions.has-results{display:grid}
    .suggestion-item{width:100%;min-height:54px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:10px 12px;font-weight:800;color:var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:center}
    .suggestion-meta{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap}
    
    .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px; max-width:980px; margin-left:auto; margin-right:auto; width:100%; min-width:0}
    .back-btn{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:900}
    .page-title{font-size:20px;font-weight:900}
    .main-layout{display:grid;gap:14px; max-width:980px; margin:0 auto; width:100%; min-width:0}
    
    .student-card{padding:18px}
    .profile-row{display:flex;gap:14px;align-items:center}
    
    /* 🔥 จัดการให้ชื่อขึ้นบรรทัดใหม่ได้แบบเต็มๆ ไม่มีจุดไข่ปลา 🔥 */
    .min-w-0 { min-width: 0; flex: 1; } 
    .student-name {
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 900;
      line-height: 1.1;
      display: block;
      word-break: break-word; /* ยอมให้ตัดคำถ้าจอแคบมากๆ */
      margin-bottom: 2px;
    }
    
    .avatar{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#bde0fe,#ffd6e7);display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}
    .student-sub{color:var(--muted);font-weight:800;margin-top:4px}
    .info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .info-pill{border-radius:18px;background:#f8f7ff;border:1px solid var(--line);padding:12px;font-weight:900;text-align:center;min-height:48px}
    .button-stack{display:grid;gap:10px;margin-top:14px}
    .section-card{padding:18px}
    .section-title{font-size:20px;font-weight:900;margin:0 0 14px;display:flex;align-items:center;gap:8px}
    .behavior-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .behavior-option{min-height:76px;border-radius:20px;border:2px solid transparent;background:#fff;box-shadow:0 8px 18px rgba(96,79,122,.08);padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;font-weight:900;cursor:pointer}
    .behavior-option i{font-size:20px}
    .behavior-option small{color:var(--muted);font-weight:800}
    .behavior-option.active{border-color:var(--pink-dark);background:#fff0f6;box-shadow:0 0 0 4px rgba(240,91,147,.12)}
    .positive i{color:var(--green)}.warning i{color:var(--orange)}.negative i{color:var(--red)}.neutral i{color:var(--blue)}
    textarea.form-control{min-height:92px;resize:vertical;padding-top:12px}
    .history-list{display:grid;gap:10px}.history-item{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.history-date{color:var(--muted);font-weight:800;font-size:14px}.history-type{font-weight:900;font-size:17px;margin-top:4px}.history-note{margin-top:6px;color:var(--ink);background:#fff7fb;border-radius:14px;padding:8px 10px}
    .empty-state{text-align:center;color:var(--muted);font-weight:800;padding:28px 10px}
    
    .loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999}.loading-overlay.show{display:flex}.loader-card{background:#fff;border-radius:24px;padding:22px 26px;box-shadow:var(--shadow);font-weight:900;text-align:center}.spinner-border{width:2.2rem;height:2.2rem;color:var(--pink-dark)}
    
    @media (min-width:700px){.content{padding:24px}.button-stack{grid-template-columns:1fr 1fr}.button-stack .wide{grid-column:1/-1}.behavior-grid{grid-template-columns:repeat(3,1fr)}}
    @media (min-width:980px){.main-layout.two-col,.main-layout.history-layout{grid-template-columns:.9fr 1.1fr;align-items:start}.button-stack{grid-template-columns:1fr}.button-stack .wide{grid-column:auto}.behavior-grid{grid-template-columns:repeat(3,1fr)}}
    
    @media (max-width:700px){
      html,body{width:100%;max-width:100%;touch-action:pan-y}
      .app-shell{
        position:absolute;
        inset:0;
        width:100vw;
        max-width:100vw;
        height:100%;
        padding:8px;
        align-items:center;
      }
      body.keyboard-active .app-shell{
        position:fixed;
        left:var(--vv-left);
        top:var(--vv-top);
        right:auto;
        bottom:auto;
        width:var(--vv-width);
        max-width:var(--vv-width);
        height:var(--vv-height);
      }
      .app{width:100%;max-width:100%;border-radius:22px;overflow:hidden}
      .content{padding:12px;width:100%;max-width:100%}
      .screen{max-width:100%;overflow-x:hidden}
      .panel,.student-card,.section-card{border-radius:22px}
      .panel{padding:18px;width:100%;max-width:100%;margin-left:0;margin-right:0}
      .input-group{width:100%;max-width:100%;flex-wrap:nowrap}
      .input-group .form-control{min-width:0;width:1%;font-size:18px!important}
      .input-group .btn{flex:0 0 52px;min-width:52px;padding-left:0;padding-right:0}
      .behavior-option{min-height:68px;padding:10px}
      .student-card,.section-card{padding:14px}
      .info-grid{grid-template-columns:1fr}
      .button-stack .btn{width:100%;max-width:100%;white-space:normal;min-height:54px}
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <main class="app">
      <div class="content">
        
        <section id="searchScreen" class="screen active">
          <div class="panel">
            <img class="brand-logo" src="https://drive.google.com/thumbnail?id=1pg6mdHDSxiEVWfW58QHkncqzd8jt_YNS&sz=w1000" alt="M1 Good Good Logo">
            <h1>M1 Good Good</h1>
            <div class="subtitle">ระบบบันทึกพฤติกรรมนักเรียน</div>
            <label class="form-label fw-bold" for="studentIdInput">ค้นหานักเรียน</label>
            <div class="input-group">
              <input id="studentIdInput" class="form-control" type="search" placeholder="กรอกเลขประจำตัว หรือพิมพ์ชื่อ" autocomplete="off">
              <button id="searchBtn" class="btn btn-primary" type="button" onclick="searchStudent()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div id="suggestions" class="suggestions"></div>
            <button id="refreshCacheBtn" class="btn btn-soft w-100 mt-3" type="button" onclick="refreshCache()"><i class="fa-solid fa-rotate"></i> อัปเดตรายชื่อนักเรียน</button>
            <div class="text-center text-muted fw-bold mt-3 small">พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อให้ระบบช่วยค้นหา</div>
          </div>
        </section>

        <section id="studentScreen" class="screen">
          <div class="topbar">
            <button class="back-btn" type="button" onclick="goToSearch()"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="page-title">ข้อมูลนักเรียน</div>
          </div>
          <div class="main-layout">
            <div class="student-card">
              <div class="profile-row">
                <div class="avatar"><i class="fa-solid fa-user-graduate"></i></div>
                <div class="min-w-0">
                  <div id="studentName" class="student-name">-</div>
                  <div id="studentDetail" class="student-sub"></div>
                </div>
              </div>
              <div class="info-grid">
                <div id="studentRoom" class="info-pill">ห้อง -</div>
                <div id="studentNumber" class="info-pill">เลขที่ -</div>
              </div>
              <div class="button-stack">
                <button class="btn btn-primary" type="button" onclick="goToForm()"><i class="fa-solid fa-pen-to-square"></i> บันทึกพฤติกรรม</button>
                <button class="btn btn-green" type="button" onclick="loadHistory()"><i class="fa-solid fa-clock-rotate-left"></i> ดูประวัติ</button>
                <button class="btn btn-soft wide" type="button" onclick="goToSearch()"><i class="fa-solid fa-magnifying-glass"></i> ค้นหาคนใหม่</button>
              </div>
            </div>
          </div>
        </section>

        <section id="formScreen" class="screen">
          <div class="topbar">
            <button class="back-btn" type="button" onclick="goToStudent()"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="page-title">บันทึกพฤติกรรม</div>
          </div>
          <div class="main-layout two-col">
            <div class="student-card">
              <div class="profile-row">
                <div class="avatar"><i class="fa-solid fa-user-graduate"></i></div>
                <div class="min-w-0">
                  <div id="formStudentName" class="student-name">-</div>
                  <div id="formStudentDetail" class="student-sub"></div>
                </div>
              </div>
            </div>
            <div class="section-card">
              <h2 class="section-title"><i class="fa-solid fa-list-check"></i> เลือกประเภทพฤติกรรม</h2>
              <div class="behavior-grid">
                <button class="behavior-option warning" type="button" onclick="selectBehavior(this,'สายเช้า')"><i class="fa-solid fa-sun"></i><span>สายเช้า</span><small>มาไม่ทันช่วงเช้า</small></button>
                <button class="behavior-option warning" type="button" onclick="selectBehavior(this,'สายเที่ยง')"><i class="fa-solid fa-cloud-sun"></i><span>สายเที่ยง</span><small>เข้าแถวเที่ยงช้า</small></button>
                <button class="behavior-option warning" type="button" onclick="selectBehavior(this,'สายพัก 10')"><i class="fa-solid fa-mug-hot"></i><span>สายพัก 10</span><small>กลับจากพักช้า</small></button>
                <button class="behavior-option negative" type="button" onclick="selectBehavior(this,'ขาดแถวเที่ยง')"><i class="fa-solid fa-person-circle-xmark"></i><span>ขาดแถวเที่ยง</span><small>ไม่มาเข้าแถว</small></button>
                <button class="behavior-option negative" type="button" onclick="selectBehavior(this,'เครื่องแต่งกาย')"><i class="fa-solid fa-shirt"></i><span>เครื่องแต่งกาย</span><small>ตรวจระเบียบ</small></button>
                <button class="behavior-option neutral" type="button" onclick="selectBehavior(this,'อื่น ๆ')"><i class="fa-solid fa-ellipsis"></i><span>อื่น ๆ</span><small>ระบุหมายเหตุ</small></button>
              </div>
              <label class="form-label fw-bold mt-3" for="noteInput">หมายเหตุ</label>
              <textarea id="noteInput" class="form-control" placeholder="เช่น มาเข้าแถวช้า / แต่งกายไม่เรียบร้อย / อื่น ๆ"></textarea>
              <button id="saveBtn" class="btn btn-primary w-100 mt-3" type="button" onclick="submitBehavior()"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>
            </div>
          </div>
        </section>

        <section id="historyScreen" class="screen">
          <div class="topbar">
            <button class="back-btn" type="button" onclick="goToStudent()"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="page-title">ประวัติพฤติกรรม</div>
          </div>
          <div class="main-layout history-layout">
            <div class="student-card">
              <div class="profile-row">
                <div class="avatar"><i class="fa-solid fa-user-graduate"></i></div>
                <div class="min-w-0">
                  <div id="historyStudentName" class="student-name">-</div>
                  <div id="historyStudentDetail" class="student-sub"></div>
                </div>
              </div>
            </div>
            <div class="section-card">
              <h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> รายการย้อนหลัง</h2>
              <div id="historyList" class="history-list"></div>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div id="loading" class="loading-overlay">
    <div class="loader-card">
      <div class="spinner-border" role="status"></div>
      <div class="mt-2">กำลังทำงาน...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    let currentStudent = null;
    let selectedBehavior = '';
    let typingTimer = null;
    let isSaving = false;

    /*
      สำคัญ: หลัง Deploy Apps Script เป็น Web app แล้ว
      ให้นำ URL ที่ลงท้ายด้วย /exec มาแทนค่าด้านล่างก่อนอัปขึ้น GitHub Pages
      ตัวอย่าง: https://script.google.com/macros/s/AKfycbxxxxxxxx/exec
    */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzgIqLb0DxpAIj_dRO1wH6jR7bE-4vgJ4S-oRMLYcKwAeIVlLpa5wvgJtSxE2QYzAg4/exec';

    function getGasUrl(){
      const url = String(GAS_URL || '').trim();
      if(!url || url === 'https://script.google.com/macros/s/AKfycbzgIqLb0DxpAIj_dRO1wH6jR7bE-4vgJ4S-oRMLYcKwAeIVlLpa5wvgJtSxE2QYzAg4/exec'){
        throw new Error('ยังไม่ได้ตั้งค่า GAS_URL ในไฟล์ index.html');
      }
      return url;
    }

    function apiGet(action, params = {}){
      const url = new URL(getGasUrl());
      url.searchParams.set('action', action);
      Object.keys(params).forEach(key => {
        if(params[key] !== undefined && params[key] !== null) url.searchParams.set(key, params[key]);
      });
      return fetch(url.toString(), { method: 'GET', cache: 'no-store' })
        .then(res => {
          if(!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        });
    }

    function apiPost(action, data = {}){
      const formData = new FormData();
      formData.append('action', action);
      Object.keys(data).forEach(key => formData.append(key, data[key] == null ? '' : data[key]));
      return fetch(getGasUrl(), { method: 'POST', body: formData })
        .then(res => {
          if(!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        });
    }

    const screens = {
      search: document.getElementById('searchScreen'),
      student: document.getElementById('studentScreen'),
      form: document.getElementById('formScreen'),
      history: document.getElementById('historyScreen')
    };

    const behaviorStyle = {
      'สายเช้า': 'warning',
      'สายเที่ยง': 'warning',
      'สายพัก 10': 'warning',
      'ขาดแถวเที่ยง': 'danger',
      'เครื่องแต่งกาย': 'danger',
      'อื่น ๆ': 'info'
    };

    document.addEventListener('DOMContentLoaded', () => {
      setupVisualViewportLock();
      const input = document.getElementById('studentIdInput');
      if (window.innerWidth > 700) input.focus();
      
      input.value = '';
      clearSuggestions();
      input.addEventListener('input', handleSearchTyping);
      input.addEventListener('focus', keepSearchCentered);
      input.addEventListener('blur', releaseKeyboardViewport);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') searchStudent();
      });
    });

    window.addEventListener('pageshow', () => {
      syncVisualViewport();
      const input = document.getElementById('studentIdInput');
      if(input && !input.value.trim()) clearSuggestions();
    });

    function setupVisualViewportLock(){
      syncVisualViewport();
      if(window.visualViewport){
        window.visualViewport.addEventListener('resize', syncVisualViewport);
        window.visualViewport.addEventListener('scroll', syncVisualViewport);
      }
      window.addEventListener('resize', syncVisualViewport);
      window.addEventListener('orientationchange', () => {
        syncVisualViewport();
        setTimeout(syncVisualViewport, 250);
      });
    }

    function syncVisualViewport(){
      const root = document.documentElement;
      const viewport = window.visualViewport;
      const left = viewport ? viewport.offsetLeft : 0;
      const top = viewport ? viewport.offsetTop : 0;
      const width = viewport ? viewport.width : window.innerWidth;
      const height = viewport ? viewport.height : window.innerHeight;
      root.style.setProperty('--vv-left', `${left}px`);
      root.style.setProperty('--vv-top', `${top}px`);
      root.style.setProperty('--vv-width', `${width}px`);
      root.style.setProperty('--vv-height', `${height}px`);
    }

    function safeScrollToTop(){
      if(document.activeElement && typeof document.activeElement.blur === 'function'){
        document.activeElement.blur();
      }
      releaseKeyboardViewport();
      resetViewportPosition();
      setTimeout(resetViewportPosition, 120);
      setTimeout(resetViewportPosition, 320);
    }

    function setKeyboardViewport(active){
      document.body.classList.toggle('keyboard-active', !!active);
      syncVisualViewport();
    }

    function releaseKeyboardViewport(){
      setKeyboardViewport(false);
      resetViewportPosition();
    }

    function resetViewportPosition(){
      syncVisualViewport();
      const shell = document.getElementById('appShell');
      if(shell) {
        shell.scrollTop = 0;
        shell.scrollLeft = 0;
      }
      document.documentElement.scrollLeft = 0;
      document.body.scrollLeft = 0;
      window.scrollTo(0, 0);
    }

    function showScreen(screenName){
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[screenName].classList.add('active');
      safeScrollToTop();
    }

    function keepSearchCentered(){
      if(window.innerWidth > 700) return;
      setKeyboardViewport(true);
      const shell = document.getElementById('appShell');
      const centerTarget = () => {
        syncVisualViewport();
        document.documentElement.scrollLeft = 0;
        document.body.scrollLeft = 0;
        if(shell) {
          shell.scrollLeft = 0;
          const panel = document.querySelector('#searchScreen .panel');
          if(panel){
            const top = Math.max(0, panel.offsetTop - Math.max(0, (shell.clientHeight - panel.offsetHeight) / 2));
            shell.scrollTop = top;
          }
        }
      };
      centerTarget();
      setTimeout(centerTarget, 60);
      setTimeout(centerTarget, 180);
      setTimeout(centerTarget, 420);
    }

    function setLoading(show){
      document.getElementById('loading').classList.toggle('show', !!show);
    }

    function setButtonLoading(buttonId, loading, text){
      const btn = document.getElementById(buttonId);
      if(!btn) return;
      btn.disabled = !!loading;
      if(loading){
        btn.dataset.original = btn.innerHTML;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> ${text || 'กำลังทำงาน...'}`;
      }else if(btn.dataset.original){
        btn.innerHTML = btn.dataset.original;
      }
    }

    function alertBox(icon, title, text){
      Swal.fire({icon,title,text,confirmButtonText:'ตกลง',confirmButtonColor:'#f05b93'});
    }

    function escapeHtml(text){
      return String(text || '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    }

    function escapeAttr(text){
      return escapeHtml(text).replace(/'/g, '&#39;');
    }

    function handleSearchTyping(){
      clearTimeout(typingTimer);
      const q = document.getElementById('studentIdInput').value.trim();
      if(q.length < 2){
        clearSuggestions();
        return;
      }
      loadLocalSuggestions(q);
      typingTimer = setTimeout(() => loadSuggestions(q), 220);
    }

    function saveLocalSuggestions(students){
      try{ localStorage.setItem('m1goodgood_students', JSON.stringify(students || [])); }catch(e){}
    }

    function getLocalSuggestions(){
      try{ return JSON.parse(localStorage.getItem('m1goodgood_students') || '[]'); }catch(e){ return []; }
    }

    function suggestionScore(student, q){
      const key = String(q || '').trim().toLowerCase();
      const studentId = String(student.studentId || '').toLowerCase();
      const fullName = String(student.fullName || '').toLowerCase();
      const room = String(student.room || '').toLowerCase();
      const number = String(student.number || '').toLowerCase();
      const all = `${studentId} ${fullName} ${room} ${number}`;
      if(!key) return 0;
      if(studentId === key) return 0;
      if(studentId.startsWith(key)) return 1;
      if(number === key) return 2;
      if(fullName.startsWith(key)) return 3;
      if(fullName.includes(key)) return 4;
      if(studentId.includes(key)) return 5;
      if(room.includes(key)) return 6;
      if(all.includes(key)) return 7;
      return 999;
    }

    function sortStudentSuggestions(students, q){
      return (students || [])
        .map(student => ({...student, _score:suggestionScore(student, q)}))
        .filter(student => student._score < 999)
        .sort((a,b) => {
          if(a._score !== b._score) return a._score - b._score;
          return String(a.studentId || '').localeCompare(String(b.studentId || ''), 'th', {numeric:true});
        })
        .map(student => { delete student._score; return student; });
    }

    function clearSearchBox(){
      document.getElementById('studentIdInput').value = '';
      clearSuggestions();
    }

    function resetStudentText(){
      // อัปเดตโครงสร้างตั้งต้นให้มีลักษณะเหมือนตอนแยกบรรทัด
      ['studentName','formStudentName','historyStudentName'].forEach(id => {
        const el = document.getElementById(id); 
        if(el) el.innerHTML = 'ชื่อ<br><span style="font-size: 0.75em; color: var(--muted); font-weight: 800;">นามสกุล</span>';
      });
      ['studentDetail','formStudentDetail','historyStudentDetail'].forEach(id => {
        const el = document.getElementById(id); if(el) el.textContent = 'ห้อง / เลขที่ / เลขประจำตัว';
      });
      const room = document.getElementById('studentRoom'); if(room) room.textContent = 'ห้อง -';
      const number = document.getElementById('studentNumber'); if(number) number.textContent = 'เลขที่ -';
    }

    function clearSuggestions(){
      const box = document.getElementById('suggestions');
      if(!box) return;
      box.innerHTML = '';
      box.classList.remove('has-results');
    }

    function loadLocalSuggestions(q=''){
      if(String(q || '').trim().length < 2){
        clearSuggestions();
        return;
      }
      const students = getLocalSuggestions();
      if(!students.length){
        clearSuggestions();
        return;
      }
      const result = sortStudentSuggestions(students, q).slice(0,8);
      renderSuggestions(result);
    }

    function loadSuggestions(query){
      if(String(query || '').trim().length < 2){
        clearSuggestions();
        return;
      }
      apiGet('getStudentSuggestions', { query })
        .then(response => {
          if(response && response.success){
            saveLocalSuggestions(response.students || []);
            renderSuggestions(sortStudentSuggestions(response.students || [], query));
          }
        })
        .catch(error => console.error(error));
    }

    function renderSuggestions(students){
      const box = document.getElementById('suggestions');
      const q = document.getElementById('studentIdInput').value.trim();
      if(q.length < 2 || !students || !students.length){ clearSuggestions(); return; }
      
      // ปลดล็อกการซ่อนข้อความให้แสดงเต็มที่
      box.innerHTML = students.slice(0,10).map(student => `
        <button class="suggestion-item" type="button" onclick="chooseStudent('${escapeAttr(student.studentId)}')">
          <span style="flex:1; line-height:1.3; padding-right:10px;">${escapeHtml(student.fullName)}</span>
          <span class="suggestion-meta">${escapeHtml(student.room)} · เลขที่ ${escapeHtml(student.number)}</span>
        </button>
      `).join('');
      box.classList.toggle('has-results', box.children.length > 0);
    }

    function chooseStudent(studentId){
      const input = document.getElementById('studentIdInput');
      input.value = studentId;
      if(document.activeElement && typeof document.activeElement.blur === 'function'){
        document.activeElement.blur();
      }
      clearSuggestions();
      releaseKeyboardViewport();
      searchStudent();
    }

    function searchStudent(){
      const studentId = document.getElementById('studentIdInput').value.trim();
      if(!studentId){ alertBox('warning','กรุณากรอกข้อมูล','กรอกเลขประจำตัว หรือเลือกจากรายชื่อที่ระบบแนะนำ'); return; }
      
      if(document.activeElement && typeof document.activeElement.blur === 'function'){
        document.activeElement.blur();
      }
      releaseKeyboardViewport();
      
      setButtonLoading('searchBtn', true, '');
      
      apiGet('searchStudent', { studentId })
        .then(response => {
          setButtonLoading('searchBtn', false);
          if(!response.success){ alertBox('error','ค้นหาไม่พบ',response.message); return; }
          currentStudent = response.student;
          clearSearchBox();
          renderStudent();
          releaseKeyboardViewport();
          setTimeout(() => {
            showScreen('student');
            releaseKeyboardViewport();
          }, window.innerWidth <= 700 ? 220 : 0);
        })
        .catch(error => {
          setButtonLoading('searchBtn', false);
          alertBox('error','เกิดข้อผิดพลาด',error.message || String(error));
        });
    }

    function renderStudent(){
      if(!currentStudent) return;
      const detail = `เลขประจำตัว ${currentStudent.studentId}`;
      const full = `${currentStudent.room || '-'} · เลขที่ ${currentStudent.number || '-'} · ${detail}`;
      
      const safeName = escapeHtml(currentStudent.fullName || '-');
      let displayHtml = safeName;
      
      // 🔥 ค้นหาช่องว่าง ถ้ามีให้แยก "ชื่อ" กับ "นามสกุล" คนละบรรทัด 🔥
      const firstSpace = safeName.indexOf(' ');
      if(firstSpace > -1) {
        const firstName = safeName.substring(0, firstSpace);
        const lastName = safeName.substring(firstSpace + 1);
        // ประกอบร่างใหม่ แทรก <br> และปรับแต่งสี/ขนาดนามสกุลให้ดูมีมิติ
        displayHtml = `${firstName}<br><span style="font-size: 0.75em; color: var(--muted); font-weight: 800;">${lastName}</span>`;
      }
      
      ['studentName','formStudentName','historyStudentName'].forEach(id => {
        document.getElementById(id).innerHTML = displayHtml;
      });
      
      ['studentDetail','formStudentDetail','historyStudentDetail'].forEach(id => document.getElementById(id).textContent = full);
      document.getElementById('studentRoom').textContent = `ห้อง ${currentStudent.room || '-'}`;
      document.getElementById('studentNumber').textContent = `เลขที่ ${currentStudent.number || '-'}`;
    }

    function goToSearch(){
      currentStudent = null;
      selectedBehavior = '';
      clearSearchBox();
      resetStudentText();
      showScreen('search');
      if(window.innerWidth > 700){
        setTimeout(() => document.getElementById('studentIdInput').focus(), 120);
      }
    }

    function goToStudent(){ showScreen('student'); }

    function goToForm(){
      if(!currentStudent) return goToSearch();
      clearBehaviorSelection();
      document.getElementById('noteInput').value = '';
      renderStudent();
      showScreen('form');
    }

    function clearBehaviorSelection(){
      selectedBehavior = '';
      document.querySelectorAll('.behavior-option').forEach(el => el.classList.remove('active'));
    }

    function selectBehavior(element, behaviorType){
      clearBehaviorSelection();
      selectedBehavior = behaviorType;
      element.classList.add('active');
    }

    function submitBehavior(){
      if(isSaving) return;
      if(!currentStudent) return goToSearch();
      if(!selectedBehavior){ alertBox('warning','ยังไม่ได้เลือกประเภท','กรุณาเลือกประเภทพฤติกรรมก่อนบันทึก'); return; }
      
      if(document.activeElement && typeof document.activeElement.blur === 'function'){
        document.activeElement.blur();
      }
      
      const noteValue = document.getElementById('noteInput').value.trim();
      
      isSaving = true;
      setButtonLoading('saveBtn', true, 'กำลังบันทึก...');
      const data = {
        studentId: currentStudent.studentId,
        room: currentStudent.room,
        number: currentStudent.number,
        fullName: currentStudent.fullName,
        behaviorType: selectedBehavior,
        note: noteValue
      };
      apiPost('saveBehavior', data)
        .then(response => {
          isSaving = false;
          setButtonLoading('saveBtn', false);
          
          if(!response.success){ 
            alertBox('error','บันทึกไม่สำเร็จ',response.message); 
            return; 
          }
          
          // หน้าต่าง Popup ทวนข้อมูล หลังบันทึกสำเร็จ
          Swal.fire({
            icon: 'success',
            title: 'บันทึกเรียบร้อย!',
            html: `
              <div style="text-align:left; background:#fff7fb; padding:15px; border-radius:15px; margin-top:10px; font-size:16px;">
                <b style="color:var(--ink); font-size:18px;">${escapeHtml(currentStudent.fullName)}</b><br><br>
                <b>ประเภท:</b> <span style="color:var(--pink-dark);">${escapeHtml(selectedBehavior)}</span><br>
                <b>หมายเหตุ:</b> ${escapeHtml(noteValue) || '-'}
              </div>
            `,
            confirmButtonText: 'ตกลง',
            confirmButtonColor: '#f05b93',
            allowOutsideClick: false
          }).then((result) => {
            if (result.isConfirmed) {
              selectedBehavior = '';
              clearBehaviorSelection();
              document.getElementById('noteInput').value = '';
              currentStudent = null;
              showScreen('search');
              clearSearchBox();
              resetStudentText();
              if(window.innerWidth > 700){
                setTimeout(() => document.getElementById('studentIdInput').focus(), 150);
              }
            }
          });
          
        })
        .catch(error => {
          isSaving = false;
          setButtonLoading('saveBtn', false);
          alertBox('error','ไม่สามารถเชื่อมต่อระบบได้', error.message || 'กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตของท่านอีกครั้ง');
        });
    }

    function loadHistory(){
      if(!currentStudent) return goToSearch();
      setLoading(true);
      apiGet('getBehaviorHistory', { studentId: currentStudent.studentId })
        .then(response => {
          setLoading(false);
          if(!response.success){ alertBox('error','โหลดประวัติไม่ได้',response.message); return; }
          renderStudent();
          renderHistory(response.history || []);
          showScreen('history');
        })
        .catch(error => {
          setLoading(false);
          alertBox('error','เกิดข้อผิดพลาด',error.message || String(error));
        });
    }

    function renderHistory(history){
      const list = document.getElementById('historyList');
      if(!history.length){
        list.innerHTML = '<div class="empty-state"><i class="fa-regular fa-face-smile"></i><br>ยังไม่มีประวัติพฤติกรรม</div>';
        return;
      }
      list.innerHTML = history.map(item => {
        const style = behaviorStyle[item.behaviorType] || 'secondary';
        const note = item.note ? `<div class="history-note"><b>หมายเหตุ:</b> ${escapeHtml(item.note)}</div>` : '';
        return `<div class="history-item">
          <div class="history-date">${escapeHtml(item.date || '-')} เวลา ${escapeHtml(item.time || '-')}</div>
          <div class="history-type"><span class="badge text-bg-${style}">${escapeHtml(item.behaviorType || '-')}</span></div>
          ${note}
        </div>`;
      }).join('');
    }

    function refreshCache(){
      setButtonLoading('refreshCacheBtn', true, 'กำลังอัปเดต...');
      apiGet('refreshStudentCache')
        .then(response => {
          setButtonLoading('refreshCacheBtn', false);
          if(response && response.success){
            Swal.fire({icon:'success',title:'อัปเดตแล้ว',text:response.message,confirmButtonColor:'#f05b93'});
          }else{
            alertBox('error','อัปเดตไม่สำเร็จ',response.message || 'เกิดข้อผิดพลาด');
          }
        })
        .catch(error => {
          setButtonLoading('refreshCacheBtn', false);
          alertBox('error','เกิดข้อผิดพลาด',error.message || String(error));
        });
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function(error){
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
