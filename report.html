<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ม.1 Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "LINE Seed Sans TH", "IBM Plex Sans Thai", Arial, sans-serif;
      color: #223049;
      background:
        radial-gradient(circle at 24% 7%, rgba(255,255,255,.72) 0 12%, transparent 27%),
        radial-gradient(circle at 82% 0%, rgba(184,224,255,.58), transparent 32%),
        linear-gradient(180deg, rgba(233,244,255,.18), rgba(255,255,255,.72) 78%, #eef7ff),
        url("m1-dashboard-bg.webp");
      background-size: cover;
      background-position: center;
      display: grid;
      place-items: center;
      padding: 18px 18px 150px;
    }

    body.page-leaving .phone {
      opacity: .18;
      filter: blur(7px);
      transform: translateY(12px) scale(.985);
      transition: opacity .32s ease, filter .32s ease, transform .32s ease;
    }

    body.page-leaving .bottom-nav {
      opacity: .24;
      transform: translateX(-50%) translateY(16px) scale(.96);
      transition: opacity .32s ease, transform .32s ease;
    }

    body.document-ready {
      display: block;
      background-attachment: fixed;
    }

    body.preview-open {
      overflow: hidden;
    }

    .phone {
      width: min(430px, 100%);
      min-height: min(892px, calc(100vh - 28px));
      border: 1.5px solid rgba(255,255,255,.48);
      border-radius: 34px;
      padding: 28px 14px 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.56) 82%, rgba(239,249,255,.72)),
        rgba(255,255,255,.08);
      box-shadow: 0 30px 90px rgba(62,86,122,.18), inset 0 1px 0 rgba(255,255,255,.58);
      backdrop-filter: blur(5px) saturate(1.08);
      position: relative;
      overflow: visible;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.34);
      pointer-events: none;
    }

    body.document-ready .phone {
      margin: 0 auto 26px;
    }

    body.document-ready .bottom-nav {
      display: grid;
    }

    .logo {
      width: 100%;
      min-height: 112px;
      border-radius: 27px;
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.56));
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 16px 36px rgba(50,74,111,.12), inset 0 1px 0 rgba(255,255,255,.94);
      backdrop-filter: blur(18px) saturate(1.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .logo img {
      width: min(248px, 76%);
      max-height: 78px;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(31,45,70,.16));
    }

    .bottom-nav {
      --active-index: 2;
      position: fixed;
      z-index: 60;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(80vw, 330px);
      height: 78px;
      padding: 10px 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
      border-radius: 999px;
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(255,255,255,.94);
      box-shadow: 0 18px 42px rgba(42,57,82,.14), 0 0 44px rgba(255,255,255,.48), inset 0 1px 0 rgba(255,255,255,.96);
      backdrop-filter: blur(24px) saturate(1.18);
      transition: opacity .24s ease, transform .24s ease, box-shadow .24s ease;
    }

    .bottom-nav::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 10px;
      bottom: 10px;
      left: 18px;
      width: calc((100% - 36px - 16px) / 3);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,247,248,.96), rgba(255,236,236,.78));
      box-shadow: 0 10px 24px rgba(255,124,85,.14), 0 0 34px rgba(255,131,118,.14), inset 0 1px 0 rgba(255,255,255,.9);
      transform: translateX(calc(var(--active-index) * (100% + 8px)));
      transition: transform .28s cubic-bezier(.2,.9,.2,1), background .22s ease, box-shadow .22s ease;
    }

    .bottom-nav-item {
      position: relative;
      z-index: 1;
      height: 58px;
      min-width: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      display: grid;
      place-items: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .2s cubic-bezier(.2,.9,.2,1), filter .2s ease;
    }

    .bottom-nav-item img {
      max-width: 66px;
      max-height: 42px;
      object-fit: contain;
      filter: grayscale(1) saturate(0) opacity(.48) drop-shadow(0 5px 8px rgba(0,0,0,.08));
      transform: scale(.86);
      transition: transform .2s cubic-bezier(.2,.9,.2,1), filter .2s ease, opacity .2s ease;
    }

    .bottom-nav-item.is-active {
      transform: translateY(-2px);
    }

    .bottom-nav-item.is-active img {
      filter: grayscale(0) saturate(1.08) opacity(1) drop-shadow(0 9px 12px rgba(255,124,85,.22));
      transform: scale(1.02);
    }

    .report-launcher {
      position: fixed;
      inset: 0;
      z-index: 78;
      display: none;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(2px) saturate(1.02);
    }

    body.report-launcher-open .phone {
      filter: blur(2px);
      transform: scale(.992);
      transition: filter .22s ease, transform .22s ease;
    }

    .report-launcher.show {
      display: block;
    }

    .report-launch-card {
      position: fixed;
      left: 50%;
      bottom: calc(112px + env(safe-area-inset-bottom));
      width: min(80vw, 330px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      pointer-events: none;
    }

    .report-launch-button,
    .report-update-button {
      grid-column: 3;
      width: 122px;
      height: 58px;
      justify-self: center;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 18px 34px rgba(31,45,70,.2), inset 0 1px 0 rgba(255,255,255,.96);
      display: grid;
      place-items: center;
      padding: 9px 13px;
      text-decoration: none;
      pointer-events: auto;
    }

    .report-update-button {
      grid-row: 1;
      color: #1f65c7;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0;
      cursor: pointer;
      background: rgba(255,255,255,.94);
    }

    .report-launch-button {
      grid-row: 2;
    }

    .report-update-button:disabled {
      color: #7a8798;
      cursor: wait;
      background: rgba(244,247,251,.94);
    }

    .report-update-button img {
      width: 100%;
      max-height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(255,97,103,.2));
    }

    .report-update-button.is-updating img {
      opacity: .55;
    }

    .report-launch-button img {
      width: 100%;
      max-height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(31,45,70,.16));
    }

    .form-card {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 11px;
    }

    .tabs,
    .search,
    .section-title,
    .period,
    .note-strip,
    .room-buttons-panel,
    .actions {
      width: 100%;
      margin-top: 10px;
    }

    .tabs,
    .search,
    .period,
    .note-strip {
      display: flex;
      gap: 8px;
      border-radius: 28px;
      background: rgba(255,255,255,.68);
      padding: 7px;
      box-shadow: 0 10px 24px rgba(38,55,82,.09), inset 0 1px 0 rgba(255,255,255,.96);
      border: 1px solid rgba(255,255,255,.72);
      backdrop-filter: blur(18px) saturate(1.1);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button {
      transition: transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s ease, background .18s ease, opacity .18s ease;
    }

    button:active,
    a:active {
      transform: scale(.97);
    }

    button:disabled {
      cursor: wait;
      opacity: .72;
      transform: none;
    }

    #createPdf:disabled {
      background: linear-gradient(180deg, rgba(213,220,231,.95), rgba(189,199,213,.9));
      color: rgba(82,96,119,.82);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.46);
      cursor: not-allowed;
    }

    .feedback-pop {
      animation: feedbackPop .34s cubic-bezier(.2,.9,.2,1);
    }

    .feedback-wiggle {
      animation: feedbackWiggle .38s cubic-bezier(.2,.9,.2,1);
    }

    @keyframes feedbackPop {
      0% { transform: scale(1); }
      38% { transform: scale(.92); }
      72% { transform: scale(1.055); }
      100% { transform: scale(1); }
    }

    @keyframes feedbackWiggle {
      0%, 100% { transform: translateY(-2px) rotate(0) scale(1.02); }
      25% { transform: translateY(-3px) rotate(-4deg) scale(1.08); }
      55% { transform: translateY(-2px) rotate(3deg) scale(1.04); }
    }

    .tab,
    .period button,
    .note-strip button {
      flex: 1;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 11px 10px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      color: #5e738f;
    }

    .tab.active,
    .period button.active {
      background: rgba(232,243,255,.9);
      color: #3169c7;
      box-shadow: 0 8px 20px rgba(61,116,202,.12), inset 0 0 0 2px rgba(98,154,225,.16), inset 0 1px 0 rgba(255,255,255,.72);
    }

    .note-strip button {
      background: rgba(255,255,255,.58);
      color: #34425b;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }

    .student-finder.hide {
      display: none;
    }

    .room-buttons-panel {
      display: none;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.52));
      padding: 10px;
      box-shadow: 0 12px 24px rgba(38,55,82,.07), inset 0 1px 0 rgba(255,255,255,.96);
      border: 1px solid rgba(255,255,255,.82);
      backdrop-filter: blur(22px) saturate(1.08);
      overflow: hidden;
    }

    .room-buttons-panel.show {
      display: grid;
      gap: 7px;
    }

    .room-buttons-title {
      font-size: 15px;
      font-weight: 700;
      color: #566984;
      text-align: left;
      padding: 2px 10px 0;
    }

    .room-buttons {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 7px;
    }

    .room-buttons::-webkit-scrollbar {
      display: none;
    }

    .room-button {
      flex: 0 0 auto;
      min-width: 74px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: rgba(255,255,255,.9);
      color: #60738f;
      cursor: pointer;
      font-weight: 700;
      scroll-snap-align: start;
      box-shadow: 0 9px 18px rgba(38,55,82,.055), inset 0 1px 0 rgba(255,255,255,.92);
    }

    .room-button.active {
      background: rgba(232,243,255,.94);
      color: #3169c7;
      box-shadow: 0 9px 20px rgba(61,116,202,.12), inset 0 0 0 2px rgba(98,154,225,.16), inset 0 1px 0 rgba(255,255,255,.72);
    }

    .room-picker {
      display: grid;
      gap: 10px;
    }

    .room-select {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .room-modal-buttons {
      border-radius: 24px;
      padding: 8px;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.84);
    }

    .room-modal-buttons .room-button {
      min-width: 82px;
      text-align: center;
    }

    .date-fields {
      display: grid;
      gap: 10px;
    }

    .date-fields label {
      display: grid;
      gap: 6px;
      min-height: auto;
      border-radius: 22px;
      padding: 10px 12px;
      background: rgba(255,255,255,.66);
      border: 1px solid rgba(255,255,255,.72);
      font-weight: 700;
    }

    .date-fields input,
    .date-fields textarea {
      width: 100%;
      border: 1px solid rgba(126,151,184,.16);
      border-radius: 17px;
      padding: 10px 12px;
      background: rgba(255,255,255,.88);
      color: #172033;
      font-weight: 600;
      outline: none;
    }

    .date-fields textarea {
      min-height: 128px;
      resize: vertical;
      line-height: 1.55;
    }

    .room-list {
      display: none;
      max-height: 260px;
      overflow: auto;
      gap: 7px;
      border-radius: 24px;
      padding: 8px;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(255,255,255,.74);
      box-shadow: 0 14px 28px rgba(38,55,82,.08);
    }

    .room-list.show {
      display: grid;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(49,67,96,.22);
      padding: 24px;
      place-items: center;
      backdrop-filter: blur(12px) saturate(1.08);
    }

    .modal-backdrop.show {
      display: grid;
    }

    .room-modal {
      width: min(430px, 100%);
      max-height: min(760px, 88vh);
      overflow: hidden;
      border-radius: 30px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: 0 24px 70px rgba(31,45,70,.18), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(22px) saturate(1.1);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      color: #223049;
    }

    .modal-close {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: rgba(235,244,254,.86);
      color: #697386;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      background: transparent;
      padding: 15px 14px;
      outline: none;
      font-weight: 600;
      color: #223049;
      font-size: 16px;
    }

    .folder-btn {
      width: 54px;
      min-height: 54px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(230,245,255,.98), rgba(214,235,255,.88));
      color: #356ec7;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 20px rgba(52,112,176,.12), inset 0 1px 0 rgba(255,255,255,.92);
      position: relative;
    }

    .folder-btn svg {
      width: 29px;
      height: 29px;
      display: block;
      filter: drop-shadow(0 5px 8px rgba(28,39,76,.12));
    }

    .search input::placeholder {
      color: rgba(105,115,134,.7);
    }

    .search-panel {
      position: relative;
    }

    .suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 20;
      max-height: 230px;
      overflow: auto;
      border-radius: 24px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 20px 44px rgba(29,45,74,.16);
      padding: 8px;
      border: 1px solid rgba(255,255,255,.82);
      backdrop-filter: blur(14px);
    }

    .suggestions.show {
      display: grid;
      gap: 6px;
    }

    .suggestion {
      width: 100%;
      border: 1px solid rgba(126,151,184,.12);
      border-radius: 18px;
      background: rgba(255,255,255,.76);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      color: #172033;
    }

    .suggestion strong,
    .suggestion small {
      display: block;
    }

    .suggestion small {
      margin-top: 2px;
      color: #666;
    }

    .section-title {
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,199,91,.95), rgba(255,173,88,.92));
      color: white;
      padding: 13px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(255,143,112,.20), inset 0 1px 0 rgba(255,255,255,.42);
      cursor: pointer;
    }

    button.section-title {
      font: inherit;
      width: 100%;
    }

    .panel {
      margin-top: 10px;
      border-radius: 28px;
      background: rgba(255,255,255,.72);
      padding: 16px;
      box-shadow: 0 18px 44px rgba(38,55,82,.10), inset 0 1px 0 rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.76);
      backdrop-filter: blur(16px);
    }

    .student-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .student-fields input,
    .student-fields select {
      width: 100%;
      border: 1px solid rgba(126,151,184,.16);
      border-radius: 18px;
      padding: 11px 12px;
      background: rgba(255,255,255,.84);
      font-weight: 600;
      outline: none;
      color: #172033;
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px 10px;
      font-size: 16px;
    }

    .selection-hint {
      text-align: center;
      color: #697386;
      font-size: 13px;
      font-weight: 600;
    }

    .behavior-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-height: min(520px, 58vh);
      overflow: auto;
      padding-right: 2px;
    }

    .behavior-option {
      --pill-bg: rgba(236,247,255,.9);
      --pill-border: rgba(87,154,226,.28);
      --pill-ink: #1f65c7;
      min-height: 54px;
      border: 1.5px solid var(--pill-border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--pill-bg) 42%, white);
      color: var(--pill-ink);
      box-shadow: 0 8px 18px rgba(31,45,70,.045), inset 0 1px 0 rgba(255,255,255,.88);
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: 700;
      text-align: center;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    }

    .behavior-option:nth-child(1) {
      --pill-bg: rgba(255,247,218,.9);
      --pill-border: rgba(223,161,45,.32);
      --pill-ink: #b87a0d;
    }

    .behavior-option:nth-child(2) {
      --pill-bg: rgba(235,249,255,.92);
      --pill-border: rgba(60,154,210,.3);
      --pill-ink: #1575a8;
    }

    .behavior-option:nth-child(3) {
      --pill-bg: rgba(237,231,255,.9);
      --pill-border: rgba(115,85,218,.28);
      --pill-ink: #6742c2;
    }

    .behavior-option:nth-child(4) {
      --pill-bg: rgba(255,235,237,.92);
      --pill-border: rgba(219,80,89,.28);
      --pill-ink: #b8323c;
    }

    .behavior-option:nth-child(5) {
      --pill-bg: rgba(232,250,238,.92);
      --pill-border: rgba(54,164,97,.28);
      --pill-ink: #23804d;
    }

    .behavior-option:nth-child(6) {
      --pill-bg: rgba(244,244,246,.95);
      --pill-border: rgba(118,125,135,.24);
      --pill-ink: #5e6670;
    }

    .behavior-option .emoji {
      width: 28px;
      height: 28px;
      border: 1.5px solid currentColor;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 15px;
      background: rgba(255,255,255,.66);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
    }

    .behavior-option small {
      display: none;
    }

    .behavior-option.active,
    .behavior-option[aria-pressed="true"] {
      border-color: var(--pill-ink);
      background: linear-gradient(180deg, color-mix(in srgb, var(--pill-bg) 78%, white), color-mix(in srgb, var(--pill-ink) 16%, var(--pill-bg)));
      color: var(--pill-ink);
      box-shadow: 0 7px 14px rgba(31,45,70,.055), inset 0 1px 0 rgba(255,255,255,.96);
      transform: translateY(-1px);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .modal-cancel {
      background: rgba(234,243,253,.94);
      color: #697386;
    }

    .modal-confirm {

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzcGLXGlsvtjfNXn-qw9R-LJSEVHXjm7dLIoUG5yY_7CA4QvO0BhGNvY7uF_ruOi55Qxw/exec";
    const periodButtons = document.querySelectorAll(".period button[data-period]");
    const modeButtons = document.querySelectorAll(".tab");
    const studentFinder = document.getElementById("studentFinder");
    const roomButtonsPanel = document.getElementById("roomButtonsPanel");

    const roomSelect = document.getElementById("roomSelect");
    const roomModalButtons = document.getElementById("roomModalButtons");

    const behaviorModal = document.getElementById("behaviorModal");
    const dayModal = document.getElementById("dayModal");
    const monthModal = document.getElementById("monthModal");
    const noteModal = document.getElementById("noteModal");
    const displayModal = document.getElementById("displayModal");
    const previewModal = document.getElementById("previewModal");
    const suggestions = document.getElementById("suggestions");
    const selectedStudentInfo = document.getElementById("selectedStudentInfo");
    let selectedPeriod = "ปีการศึกษา";
    let selectedDateFrom = "";
    let selectedDateTo = "";
    let selectedMonth = "";
    let selectedNote = "";
    let hiddenFields = [];
    let selectedMode = "person";
    let selectedBehaviors = [];

    let selectedReportRoom = "";

    let allStudents = [];

    let lastFeedbackAt = 0;

    function canCreateDocument() {
      if (selectedMode === "room") return Boolean(selectedReportRoom);
      return Boolean(selectedStudent);
    }

    function updateCreateButtonState() {
      const button = document.getElementById("createPdf");
      if (!button) return;
      const ready = canCreateDocument();
      button.disabled = !ready;
      button.textContent = "สร้างเอกสาร";
    }

    function updateMobileSheetScale() {
      const viewport = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 390);
      const scale = Math.min(1, Math.max(.38, (viewport - 28) / 794));
      document.documentElement.style.setProperty("--mobile-sheet-scale", scale.toFixed(4));
    }

    function openPreviewModal() {
      previewModal.classList.add("show");
      previewModal.setAttribute("aria-hidden", "false");
      document.body.classList.add("preview-open");
      const panel = previewModal.querySelector(".preview-panel");
      if (panel) panel.scrollTop = 0;
    }

    function closePreviewModal() {
      previewModal.classList.remove("show");
      previewModal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("preview-open");
    }

    function safeFilePart(value) {
      return String(value || "")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function pdfFileName() {
      const target = selectedMode === "room"
        ? selectedReportRoom
        : (selectedStudent?.fullName || selectedStudent?.studentId || document.getElementById("studentName").value || "รายบุคคล");
      const date = localIsoDate();
      return `m1-report-${safeFilePart(target) || "document"}-${date}.pdf`;
    }

    async function downloadPdfDocument() {
      const button = document.getElementById("downloadPdf");
      const sheets = document.getElementById("printSheets");
      if (!sheets || !sheets.children.length) return;

      const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
      if (!window.html2canvas || !jsPDFCtor) {
        alert("ยังโหลดเครื่องมือดาวน์โหลด PDF ไม่สำเร็จ กรุณาต่ออินเทอร์เน็ตแล้วลองใหม่อีกครั้ง");
        return;
      }

      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "กำลังทำไฟล์ PDF...";

      let exportLayer = null;

      try {
        if (document.fonts?.ready) await document.fonts.ready;

        // สำคัญ: ไม่ใช้ window.print() และไม่จับภาพ element ที่ซ่อน/อยู่นอกจอ
        // เพราะบาง browser จะได้ PDF ขาวล้วน จึงสร้างชั้น export ที่มองเห็นจริงชั่วคราว
        exportLayer = document.createElement("div");
        exportLayer.id = "pdfExportLayer";
        exportLayer.setAttribute("aria-hidden", "true");
        exportLayer.style.cssText = [
          "position:fixed",
          "left:0",
          "top:0",
          "width:210mm",
          "min-height:297mm",
          "background:#ffffff",
          "z-index:2147483647",
          "overflow:visible",
          "pointer-events:none"
        ].join(";");

        const clone = sheets.cloneNode(true);
        clone.id = "pdfExportSheets";
        clone.style.cssText = "display:block;width:210mm;background:#ffffff;overflow:visible;";

        const exportSheets = Array.from(clone.querySelectorAll(".print-sheet"));
        exportSheets.forEach((sheet, index) => {
          sheet.style.cssText += [
            "display:block",
            "width:210mm",
            "height:297mm",
            "margin:0",
            "padding:16mm 18mm 18mm",
            "box-shadow:none",
            "background:#ffffff",
            "color:#000000",
            "zoom:1",
            "transform:none",
            "page-break-after:always",
            "break-after:page",
            "overflow:hidden"
          ].join(";");
          if (index > 0) sheet.style.marginTop = "0";
        });

        exportLayer.appendChild(clone);
        document.body.appendChild(exportLayer);

        // ให้ browser layout หน้า export ให้เสร็จก่อนจับภาพ
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        await new Promise(resolve => setTimeout(resolve, 180));

        const pdf = new jsPDFCtor({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
        const pageElements = Array.from(exportLayer.querySelectorAll(".print-sheet"));
        const scale = Math.min(2.2, Math.max(1.5, window.devicePixelRatio || 2));

        for (let i = 0; i < pageElements.length; i += 1) {
          const page = pageElements[i];
          const canvas = await window.html2canvas(page, {
            scale,
            useCORS: true,
            allowTaint: false,
            backgroundColor: "#ffffff",
            logging: false,
            scrollX: 0,
            scrollY: 0,
            windowWidth: page.scrollWidth,
            windowHeight: page.scrollHeight,
            width: page.offsetWidth,
            height: page.offsetHeight
          });

          if (!canvas.width || !canvas.height) {
            throw new Error("จับภาพหน้าเอกสารไม่สำเร็จ");
          }

          const imageData = canvas.toDataURL("image/jpeg", 0.98);
          if (i > 0) pdf.addPage("a4", "portrait");
          pdf.addImage(imageData, "JPEG", 0, 0, 210, 297, undefined, "FAST");
        }

        pdf.save(pdfFileName());
        playTapTone("success");
        vibrateFor("success");
      } catch (error) {
        playTapTone("error");
        vibrateFor("error");
        alert("ดาวน์โหลด PDF ไม่สำเร็จ: " + (error.message || String(error)));
      } finally {
        if (exportLayer) exportLayer.remove();
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function playTapTone(kind = "tap") {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        feedbackAudioCtx = feedbackAudioCtx || new AudioCtx();
        if (feedbackAudioCtx.state === "suspended") feedbackAudioCtx.resume();

        const now = feedbackAudioCtx.currentTime;
        const tones = {
          success: [660, 880, 1175],
          error: [220, 165],
          warning: [440, 620],
          nav: [520, 760],
          select: [680, 900],
          tap: [600, 760]
        };
        const freqs = tones[kind] || tones.tap;

        freqs.forEach((freq, index) => {
          const start = now + index * .055;
          const osc = feedbackAudioCtx.createOscillator();
          const gain = feedbackAudioCtx.createGain();
          osc.type = kind === "error" ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(.0001, start);
          gain.gain.exponentialRampToValueAtTime(kind === "success" ? .06 : kind === "error" ? .045 : .035, start + .01);
          gain.gain.exponentialRampToValueAtTime(.0001, start + .105);
          osc.connect(gain).connect(feedbackAudioCtx.destination);
          osc.start(start);
          osc.stop(start + .12);
        });
      } catch (error) {}
    }

    function vibrateFor(kind = "tap") {
      if (!navigator.vibrate) return;
      const patterns = {
        success: [18, 24, 18],
        error: [28, 36, 28],
        nav: [12, 24, 12],
        select: 18,
        tap: 10
      };
      navigator.vibrate(patterns[kind] || patterns.tap);
    }

    function tactileFeedback(target, kind = "tap") {
      const now = Date.now();
      if (now - lastFeedbackAt < 45) return;
      lastFeedbackAt = now;
      vibrateFor(kind);
      playTapTone(kind);

      const el = target?.closest?.("button,a,.behavior-option,.bottom-nav-item,.suggestion,.room-button") || target;
      if (!el || !el.classList) return;
      const cls = kind === "nav" ? "feedback-wiggle" : "feedback-pop";
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
      setTimeout(() => el.classList.remove(cls), 430);
    }

    document.addEventListener("pointerdown", (event) => {
      const target = event.target.closest("button,a,.behavior-option,.suggestion,.room-button");
      if (!target || target.disabled) return;
      const kind = target.closest(".bottom-nav")
        ? "nav"
        : target.classList.contains("behavior-option") || target.classList.contains("room-button")
          ? "select"
          : "tap";
      tactileFeedback(target, kind);
    }, {passive: true});

    function openReportLauncher() {
      const launcher = document.getElementById("reportLauncher");
      if (!launcher) return;
      document.body.classList.add("report-launcher-open");
      launcher.classList.add("show");

    function showUpdatePopup(title = "กำลังอัปเดต", message = "กำลังโหลดเวอร์ชันล่าสุด...") {
      if (document.getElementById("updateStatusPopup")) return;

      popup.innerHTML = `<div style="min-width:230px;max-width:82vw;border-radius:28px;padding:22px 24px;text-align:center;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.94);box-shadow:0 28px 70px rgba(31,45,70,.2),inset 0 1px 0 rgba(255,255,255,.96);color:#25364a;font-weight:800;"><div style="font-size:22px;margin-bottom:6px;">${title}</div><div style="font-size:14px;color:#526174;font-weight:500;">${message}</div></div>`;
      document.body.appendChild(popup);
    }

    function showFinishedUpdatePopup() {
      try {
        if (localStorage.getItem("m1:update:done") !== "1") return;
        localStorage.removeItem("m1:update:done");
      } catch (error) {
        return;
      }
      showUpdatePopup("อัปเดตเรียบร้อยแล้ว", "เปิดเวอร์ชันล่าสุดแล้ว");
      setTimeout(() => document.getElementById("updateStatusPopup")?.remove(), 1900);
    }
    showFinishedUpdatePopup();

    async function updateToLatestVersion(button) {
      try {
        if (button) {
          button.disabled = true;
          button.classList.add("is-updating");
        }
        showUpdatePopup();
        try {
          localStorage.setItem("m1:update:done", "1");
        } catch (error) {}
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        try {
          sessionStorage.clear();
        } catch (error) {}
        await new Promise((resolve) => setTimeout(resolve, 1300));
        const freshUrl = new URL(window.location.href);
        freshUrl.searchParams.set("v", Date.now().toString());
        window.location.replace(freshUrl.toString());
      } catch (error) {
        window.location.reload();
      }
    }

    document.querySelector(".report-update-button")?.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      updateToLatestVersion(event.currentTarget);
    });

    document.querySelectorAll(".bottom-nav a").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button) return;
        if (link.getAttribute("aria-current") === "page") {
          event.preventDefault();
          if (link.getAttribute("href") === "report.html") openReportLauncher();
          return;
        }
        event.preventDefault();
        document.body.classList.add("page-leaving");
        setTimeout(() => {
          window.location.href = link.href;
        }, 260);
      });
    });

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function jsonp(action, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "m1_report_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("เชื่อมต่อช้าเกินไป กรุณาลองใหม่"));
        }, 30000);

        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          script.remove();
        }

        window[cb] = (data) => {
          cleanup();
          resolve(data);
        };

        const qs = new URLSearchParams({...params, action, callback: cb});
        script.onerror = () => {
          cleanup();
          reject(new Error("เชื่อมต่อ Apps Script ไม่สำเร็จ"));
        };
        script.src = GAS_URL + "?" + qs.toString();
        document.body.appendChild(script);
      });
    }

      return `${year}-${month}-${day}`;

    async function loadStudentSuggestions(q) {
      suggestions.innerHTML = `<div class="suggestion">กำลังค้นหา...</div>`;
      suggestions.classList.add("show");
      try {
        const res = await jsonp("searchStudent", {q});
        const students = res && res.success ? (res.students || []) : [];
        if (!students.length) {
          suggestions.innerHTML = `<div class="suggestion">ไม่พบนักเรียน</div>`;
          return;
        }
        suggestions.innerHTML = students.slice(0, 8).map((student, index) => `
          <button class="suggestion" type="button" data-index="${index}">
            <strong>${escapeHtml(student.fullName || "")}</strong>
            <small>${escapeHtml(student.room || "")} · เลขที่ ${escapeHtml(student.number || "")} · ${escapeHtml(student.studentId || "")}</small>
          </button>
        `).join("");
        suggestions.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => chooseStudent(students[Number(button.dataset.index)]));
        });
      } catch (error) {
        suggestions.innerHTML = `<div class="suggestion">ค้นหาไม่ได้: ${escapeHtml(error.message || String(error))}</div>`;
      }
    }

    const thaiMonths = [
      "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
      "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
    ];

    function formatThaiDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "-";
      return `${date.getDate()} ${thaiMonths[date.getMonth()]} ${date.getFullYear() + 543}`;
    }

    function lastDayOfMonth(monthValue) {
      const [year, month] = String(monthValue || localMonth()).split("-").map(Number);
      return localIsoDate(new Date(year, month, 0));
    }

    function selectedDateBounds(records = []) {
      const today = localIsoDate();
      if (selectedPeriod === "วัน") {
        const from = selectedDateFrom || today;
        const to = selectedDateTo || from;
        return from <= to ? {from, to} : {from: to, to: from};
      }
      if (selectedPeriod === "เดือน") {
        const month = selectedMonth || localMonth();
        const from = `${month}-01`;
        const monthEnd = lastDayOfMonth(month);
        const to = month === localMonth() && today < monthEnd ? today : monthEnd;
        return {from, to};
      }
      const dates = (records || []).map((record) => record.date).filter(Boolean).sort();
      return {from: dates[0] || today, to: today};
    }

    function dateRange(records) {
      const {from, to} = selectedDateBounds(records);
      if (!from || !to) return "-";
      return `${formatThaiDate(from)} - ${formatThaiDate(to)}`;
    }

    function filterRecordsBySelectedPeriod(records) {
      const items = records || [];
      if (selectedPeriod === "ปีการศึกษา") {
        const today = localIsoDate();
        return items.filter((record) => !record.date || record.date <= today);
      }
      const {from, to} = selectedDateBounds(items);
      return items.filter((record) => record.date && record.date >= from && record.date <= to);
    }

    function buildReportPeriodParams() {
      if (selectedPeriod === "วัน") {
        const from = selectedDateFrom || localIsoDate();
        const to = selectedDateTo || from;
        return {
          period: "day",
          dateFrom: from <= to ? from : to,
          dateTo: from <= to ? to : from
        };
      }
      if (selectedPeriod === "เดือน") {
        return {
          period: "month",
          month: selectedMonth || localMonth()
        };
      }
      // ปีการศึกษา = ตั้งแต่วันแรกของระบบถึงปัจจุบัน
      return {
        period: "all"
      };
    }

    function totalText(report) {
      const total = Number(report.total || 0);
      if (selectedMode === "room") {
        const people = Array.isArray(report.topStudents) ? report.topStudents.length : 0;
        return `รวมทั้งหมด : ${people} คน ${total} ครั้ง`;
      }
      return `รวมทั้งหมด : ${total} ครั้ง`;
    }

    function groupBy(records, key) {
      return (records || []).reduce((map, record) => {
        const name = record[key] || "ไม่ระบุ";
        if (!map[name]) map[name] = [];
        map[name].push(record);
        return map;
      }, {});
    }

    function firstFilled(...values) {
      const found = values.find((value) => value !== undefined && value !== null && String(value).trim() !== "");
      return found === undefined ? "" : found;
    }

    function studentNumberFrom(value = {}) {
      return firstFilled(
        value.number,
        value.studentNo,
        value.studentNumber,
        value.no,
        value.classNo,
        value.roomNo,
        value.noInRoom,
        value.student_no,
        value["เลขที่"]
      );
    }

    function getStudentNumber(record = {}) {
      const direct = studentNumberFrom(record);
      if (direct) return direct;
      const match = allStudents.find((student) => (
        (record.studentId && student.studentId && String(student.studentId) === String(record.studentId)) ||
        (record.fullName && student.fullName && String(student.fullName) === String(record.fullName) && (!record.room || String(student.room || "") === String(record.room || "")))
      ));
      return match ? studentNumberFrom(match) : "";
    }

    function getActionText(record = {}) {
      const direct = firstFilled(
        record.actionType,
        record.action,
        record.actionTaken,
        record.behaviorAction,
        record.management,
        record.manageType,
        record.status,
        record["การดำเนินการ"],
        record["ดำเนินการ"],
        record["การจัดการ"],
        record["สถานะ"]
      );
      if (direct) return direct;
      const noteText = String(record.note || "").trim();
      if (/^(ตักเตือน|เตือน|ปกครอง\s*[123๑๒๓]|ปกครองครั้งที่\s*[123๑๒๓])$/.test(noteText)) return noteText;
      return "";
    }

    function numberSortValue(value) {
      const text = String(value ?? "").trim();
      const match = text.match(/\d+/);
      return match ? Number(match[0]) : Number.POSITIVE_INFINITY;
    }

    function looksLikeStudentId(value) {
      return /^\d{3,}$/.test(String(value || "").trim());
    }

    function renderFields(mode, params, report) {
      if (mode === "room") {
        const room = params.roomRaw || report.room || "";
        return isHidden("room") ? "" : `
          <div class="doc-field"><strong>ห้อง</strong><span class="line">${escapeHtml(room)}</span></div>
          <div></div>
        `;
      }

      const first = (report.records || [])[0] || {};
      const picked = params.selectedStudent || {};
      const fullName = picked.fullName || first.fullName || (looksLikeStudentId(params.nameRaw) ? "" : params.nameRaw) || "";
      const studentId = picked.studentId || first.studentId || (looksLikeStudentId(params.nameRaw) ? params.nameRaw : "") || "";
      const room = params.roomRaw || picked.room || first.room || "";
      const number = params.noRaw || picked.number || "";
      const fields = [];
      if (!isHidden("fullName")) {
        fields.push(`<div class="doc-field wide"><strong>ชื่อ - สกุล</strong><span class="line">${escapeHtml(fullName)}</span></div>`);
      }
      if (!isHidden("studentId")) {
        fields.push(`<div class="doc-field"><strong>เลขประจำตัว</strong><span class="line">${escapeHtml(studentId)}</span></div>`);
      }
      if (!isHidden("room") || !isHidden("studentNo")) {
        fields.push(`
          <div class="doc-field">
            ${!isHidden("room") ? `<strong>ห้อง</strong><span class="line">${escapeHtml(room)}</span>` : ""}
            ${!isHidden("studentNo") ? `<strong>เลขที่</strong><span class="line">${escapeHtml(number)}</span>` : ""}
          </div>
        `);
      }
      return fields.join("");
    }

    function renderHeader(modeLabel, printDate) {
      if (isHidden("header")) return "";
      return `
        <header class="doc-header">
          <img class="doc-logo" src="m1-logo.webp" alt="">
          <div class="doc-title">
            <div class="small">ระบบข้อมูลนักเรียน</div>
            <h1>ระดับชั้นมัธยมศึกษาปีที่ 1</h1>
          </div>
          <div class="doc-meta">
            <strong>ประเภทข้อมูล</strong>
            <div>${escapeHtml(modeLabel)}</div>
            <strong>วันที่พิมพ์</strong>
            <div>${escapeHtml(printDate)}</div>
          </div>
        </header>
      `;
    }

    function renderNoteLines() {
      const lines = selectedNote
        ? selectedNote.split(/\r?\n/).map((line) => line.trim()).filter(Boolean)
        : [];
      const slots = [lines[0] || "", lines[1] || "", lines.slice(2).join(" ") || ""];
      return slots.map((line) => `<span class="note-line">${escapeHtml(line)}</span>`).join("");
    }

    function renderFooter(report, page, pageTotal, isLastPage) {
      return `
        <footer class="doc-footer">
          ${isLastPage && !isHidden("totalCount") ? `<div class="doc-total">${escapeHtml(totalText(report))}</div>` : ""}
          ${!isHidden("pageNumber") ? `<div class="doc-page-number">หน้าที่ ${page}/${pageTotal}</div>` : ""}
          <hr class="doc-divider">
          ${!isHidden("dateRange") ? `<div class="doc-range">ข้อมูลตั้งแต่ : วันที่ ${escapeHtml(dateRange(report.records || []))}</div>` : ""}
          ${isLastPage && !isHidden("footerNote") ? `
            <div class="doc-notes">
              <strong>หมายเหตุ :</strong>
              ${renderNoteLines()}
            </div>
          ` : ""}
        </footer>
      `;
    }

    function renderPage(content, page, pageTotal, report, params) {
      const modeLabel = selectedMode === "room" ? "รายห้อง" : "รายบุคคล";
      const printDate = formatThaiDate(localIsoDate());
      const fields = renderFields(selectedMode, params, report);
      return `
        <article class="print-sheet">
          ${renderHeader(modeLabel, printDate)}
          ${fields ? `<section class="doc-fields">${fields}</section>` : ""}
          <hr class="doc-divider">
          <main class="doc-content">${content}</main>
          ${renderFooter(report, page, pageTotal, page === pageTotal)}
        </article>
      `;
    }

    function chunkArray(items, size) {
      const chunks = [];
      for (let i = 0; i < items.length; i += size) chunks.push(items.slice(i, i + size));
      return chunks.length ? chunks : [[]];
    }

    function packBlocks(blocks, maxUnits) {
      const pages = [];
      let current = [];
      let used = 0;

      blocks.forEach((block) => {
        if (current.length && used + block.units > maxUnits) {
          pages.push(current.join(""));
          current = [];
          used = 0;
        }
        current.push(block.html);
        used += block.units;
      });

      if (current.length) pages.push(current.join(""));
      return pages.length ? pages : [`<section class="doc-section"><div class="doc-empty">ไม่ปรากฏข้อมูล</div></section>`];
    }

    function renderPersonPages(report) {
      const grouped = groupBy(report.records || [], "behaviorType");
      const behaviorNames = Object.keys(grouped).sort((a, b) => a.localeCompare(b, "th"));
      if (!behaviorNames.length) {
        return [`<section class="doc-section"><div class="doc-empty">ไม่ปรากฏข้อมูล</div></section>`];
      }

      const blocks = [];
      behaviorNames.forEach((behaviorName) => {
        const rows = grouped[behaviorName];
        chunkArray(rows, 18).forEach((chunk, chunkIndex) => {
          const headers = [
            !isHidden("sectionCount") ? "<th>ครั้งที่</th>" : "",
            !isHidden("recordDate") ? "<th>วันที่</th>" : "",
            !isHidden("behaviorAction") ? "<th>การดำเนินการ</th>" : "",
            !isHidden("behaviorNote") ? "<th>หมายเหตุ</th>" : ""
          ].join("");
          blocks.push({
            units: 3 + chunk.length,
            html: `
          <section class="doc-section">
            <div class="section-head">
              <div><strong>ประเภทพฤติกรรม :</strong> ${escapeHtml(behaviorName)}${chunkIndex ? " (ต่อ)" : ""}</div>
              ${!isHidden("sectionCount") ? `<div><strong>จำนวน :</strong> ${rows.length} ครั้ง</div>` : ""}
            </div>
            <table class="doc-table">
              <thead><tr>${headers || "<th>รายการ</th>"}</tr></thead>
              <tbody>
                ${chunk.map((record, index) => `
                  <tr>
                    ${!isHidden("sectionCount") ? `<td>${chunkIndex * 18 + index + 1}</td>` : ""}
                    ${!isHidden("recordDate") ? `<td>${escapeHtml(formatThaiDate(record.date))}</td>` : ""}
                    ${!isHidden("behaviorAction") ? `<td>${escapeHtml(getActionText(record))}</td>` : ""}
                    ${!isHidden("behaviorNote") ? `<td>${escapeHtml(record.note || "")}</td>` : ""}
                    ${headers ? "" : `<td>${escapeHtml(behaviorName)}</td>`}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </section>
          `
          });
        });
      });
      return packBlocks(blocks, 25);
    }

    function renderRoomPages(report) {
      const records = report.records || [];
      const byBehavior = groupBy(records, "behaviorType");
      const behaviorNames = Object.keys(byBehavior).sort((a, b) => a.localeCompare(b, "th"));
      const studentHeaders = [
        "<th>ลำดับที่</th>",
        !isHidden("fullName") ? "<th>ชื่อ - สกุล</th>" : "",
        !isHidden("studentId") ? "<th>เลขประจำตัว</th>" : "",
        !isHidden("studentNo") ? "<th>เลขที่</th>" : ""
      ].join("");
      const columnCount = 1
        + (isHidden("fullName") ? 0 : 1)
        + (isHidden("studentId") ? 0 : 1)
        + (isHidden("studentNo") ? 0 : 1);

      if (!behaviorNames.length) {
        return [`
          <section class="doc-section">
            <div class="section-head">
              <div><strong>ประเภทพฤติกรรม :</strong> ${escapeHtml(report.behaviorType || "ทั้งหมด")}</div>
              ${!isHidden("sectionCount") ? `<div><strong>จำนวน :</strong> 0 คน 0 ครั้ง</div>` : ""}
            </div>
            <div class="doc-empty">ไม่ปรากฏข้อมูล</div>
          </section>
        `];
      }

      const blocks = [];
      behaviorNames.forEach((behaviorName) => {
        const behaviorRecords = byBehavior[behaviorName] || [];
        const studentMap = {};
        behaviorRecords.forEach((record) => {
          const key = record.studentId || `${record.fullName || ""}|${record.room || ""}`;
          if (!studentMap[key]) {
            studentMap[key] = {
              studentId: record.studentId || "",
              fullName: record.fullName || "",
              number: getStudentNumber(record),
              logs: []
            };
          }
          if (!studentMap[key].number && getStudentNumber(record)) {
            studentMap[key].number = getStudentNumber(record);
          }
          studentMap[key].logs.push(record);
        });

        const students = Object.values(studentMap)
          .sort((a, b) => {
            const noDiff = numberSortValue(a.number) - numberSortValue(b.number);
            return noDiff || String(a.number || "").localeCompare(String(b.number || ""), "th", {numeric: true}) || String(a.fullName || "").localeCompare(String(b.fullName || ""), "th");
          });
        const totalText = `${students.length} คน ${behaviorRecords.length} ครั้ง`;
        const tableRows = [];

        students.forEach((student, studentIndex) => {
          const logs = student.logs
            .slice()
            .sort((a, b) => String(a.timestamp || a.date).localeCompare(String(b.timestamp || b.date)));
          tableRows.push(`
            <tr>
              <td>${studentIndex + 1}</td>
              ${!isHidden("fullName") ? `<td>${escapeHtml(student.fullName || "")}</td>` : ""}
              ${!isHidden("studentId") ? `<td>${escapeHtml(student.studentId || "")}</td>` : ""}
              ${!isHidden("studentNo") ? `<td class="center">${escapeHtml(student.number || "")}</td>` : ""}
            </tr>
          `);
          logs.forEach((record, index) => {
            const actionText = getActionText(record);
            const details = [
              !isHidden("sectionCount") ? `<strong>ครั้งที่</strong> ${index + 1}` : "",
              !isHidden("recordDate") ? escapeHtml(formatThaiDate(record.date)) : "",
              !isHidden("behaviorAction") && actionText ? `<strong>การดำเนินการ</strong> ${escapeHtml(actionText)}` : "",
              !isHidden("behaviorNote") && record.note ? escapeHtml(record.note) : ""
            ].filter(Boolean).join(" - ");
            if (!details) return;
            tableRows.push(`
              <tr>
                <td></td>
                <td colspan="${Math.max(columnCount - 1, 1)}">${details}</td>
              </tr>
            `);
          });
        });

        chunkArray(tableRows, 24).forEach((chunk, pageIndex) => {
          blocks.push({
            units: 4 + chunk.length,
            html: `
              <section class="doc-section">
                <div class="section-head">
                  <div><strong>ประเภทพฤติกรรม :</strong> ${escapeHtml(behaviorName)}${pageIndex ? " (ต่อ)" : ""}</div>
                  ${!isHidden("sectionCount") ? `<div><strong>จำนวน :</strong> ${escapeHtml(totalText)}</div>` : ""}
                </div>
                <table class="doc-table room-table">
                  <thead><tr>${studentHeaders}</tr></thead>
                  <tbody>
                    ${chunk.join("")}
                  </tbody>
                </table>
              </section>
            `
          });
        });
      });

      return packBlocks(blocks, 25);
    }

    function renderDocument(report, params) {
      const pageContents = selectedMode === "room"
        ? renderRoomPages(report)
        : renderPersonPages(report);
      const pageTotal = pageContents.length || 1;
      document.getElementById("printSheets").innerHTML = pageContents
        .map((content, index) => renderPage(content, index + 1, pageTotal, report, params))
        .join("");
    }

    function mergeReports(reports, behaviorTypes) {
      const base = reports.find((item) => item && item.success) || {success: true, records: []};
      const seen = new Set();
      const records = [];

      reports.forEach((report) => {
        (report.records || []).forEach((record) => {
          const key = [record.timestamp, record.studentId, record.date, record.behaviorType, getActionText(record), record.note].join("|");
          if (seen.has(key)) return;
          seen.add(key);
          records.push(record);
        });
      });

      const filteredRecords = filterRecordsBySelectedPeriod(records);
      const byType = {};
      const byRoom = {};
      const byStudent = {};
      filteredRecords.forEach((record) => {
        const type = record.behaviorType || "ไม่ระบุ";
        const room = record.room || "ไม่ระบุห้อง";
        const studentKey = [record.studentId, record.fullName, record.room].join("|");
        byType[type] = (byType[type] || 0) + 1;
        byRoom[room] = (byRoom[room] || 0) + 1;
        if (!byStudent[studentKey]) {
          byStudent[studentKey] = {
            studentId: record.studentId,
            fullName: record.fullName,
            room: record.room,
            number: getStudentNumber(record),
            count: 0
          };
        }
        if (!byStudent[studentKey].number && getStudentNumber(record)) {
          byStudent[studentKey].number = getStudentNumber(record);
        }
        byStudent[studentKey].count += 1;
      });

      return {
        ...base,
        success: true,
        total: filteredRecords.length,
        behaviorType: behaviorTypes.length ? behaviorTypes.join(", ") : "ทั้งหมด",
        byType,
        byRoom,
        topStudents: Object.values(byStudent)
          .sort((a, b) => b.count - a.count || String(a.fullName || "").localeCompare(String(b.fullName || ""), "th"))
          .slice(0, 50),
        records: filteredRecords.sort((a, b) => String(b.timestamp || b.date).localeCompare(String(a.timestamp || a.date)))
      };
    }

    document.getElementById("createPdf").addEventListener("click", async () => {
      if (!canCreateDocument()) {
        playTapTone("warning");
        vibrateFor("warning");
        updateCreateButtonState();
        return;
      }
      const button = document.getElementById("createPdf");
      const nameRaw = document.getElementById("studentName").value.trim();
      const roomRaw = selectedMode === "room"
        ? selectedReportRoom
        : (selectedStudent ? (selectedStudent.room || "") : "");
      const noRaw = selectedMode === "person" && selectedStudent ? (selectedStudent.number || "") : "";
      const name = nameRaw || "............................................................";
      const room = roomRaw || "....................";
      const no = noRaw || "....................";
      const behaviorTypes = selectedBehaviors.slice();
      const behavior = behaviorTypes.length ? behaviorTypes.join(", ") : "ทั้งหมด";

      button.disabled = true;
      button.textContent = "กำลังสร้างเอกสาร...";

      let report = null;
      try {
        const targets = behaviorTypes.length ? behaviorTypes : ["ทั้งหมด"];
        const reports = [];
        for (const behaviorType of targets) {
          const periodParams = buildReportPeriodParams();
          reports.push(await jsonp("getReportData", {
            reportMode: selectedMode,
            studentId: selectedMode === "person" && selectedStudent ? selectedStudent.studentId : "",
            studentName: selectedMode === "person" ? nameRaw : "",
            room: selectedMode === "room" ? roomRaw : "",
            // ไม่ส่ง studentNo ไปกรอง เพราะ BehaviorLogs ไม่มีเลขที่ และข้อมูลเก่า/ใหม่ไม่เท่ากัน
            studentNo: "",
            behaviorType,
            ...periodParams
          }));
        }
        report = mergeReports(reports, behaviorTypes);
      } catch (error) {
        playTapTone("error");
        vibrateFor("error");
        alert(error.message || String(error));
        updateCreateButtonState();
        return;
      }

      if (!report || !report.success) {
        playTapTone("error");
        vibrateFor("error");
        alert((report && report.message) || "สร้างรายงานไม่สำเร็จ");
        updateCreateButtonState();
        return;
      }

      renderDocument(report, {nameRaw, roomRaw, noRaw, name, room, no, behavior, selectedStudent});
      playTapTone("success");
      vibrateFor("success");
      updateMobileSheetScale();
      document.body.classList.add("document-ready");
      openPreviewModal();

      updateCreateButtonState();
    });

    document.getElementById("downloadPdf").addEventListener("click", () => {
      downloadPdfDocument();
    });

    document.getElementById("closePreview").addEventListener("click", () => {
      closePreviewModal();
    });

    previewModal.addEventListener("click", (event) => {
      if (event.target === previewModal) closePreviewModal();
    });

    window.addEventListener("resize", updateMobileSheetScale);
    window.addEventListener("orientationchange", () => {
      window.setTimeout(updateMobileSheetScale, 180);
    });
    updateMobileSheetScale();
  </script>
</body>
