<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>M1 DD Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#fff7fb" />
  <style>
    :root{--pink:#ff8fbc;--pink-dark:#f05b93;--blue:#75b8ff;--green:#55c78a;--ink:#433d5b;--muted:#817991;--line:rgba(110,95,140,.16);--card:#fff;--shadow:0 18px 50px rgba(75,68,102,.12)}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Sarabun","Noto Sans Thai",sans-serif}
    body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(135deg,#fff7fb,#eef8ff);padding:18px}
    .wrap{max-width:1180px;margin:0 auto}
    .head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
    h1{font-size:clamp(30px,5vw,46px);margin:0;font-weight:900}
    a{color:var(--ink);font-weight:900;text-decoration:none;background:white;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
    .panel,.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:18px}
    .filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
    input,select,button{font-size:17px;border:1px solid var(--line);border-radius:16px;padding:12px;font-weight:800;background:white;color:var(--ink)}
    button{border:0;background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:white;font-weight:900}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
    .num{font-size:34px;font-weight:900}
    .label{color:var(--muted);font-weight:800}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-weight:750}
    th{background:#fff7fb;color:var(--muted);font-weight:900}
    .status{font-weight:900;color:var(--muted);padding:12px}
    @media(max-width:800px){.filters,.cards,.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>M1 DD</h1>
      <div class="status">Dashboard สถิติพฤติกรรมนักเรียน</div>
    </div>
    <a href="index.html">← กลับ M1 Good Good</a>
  </div>

  <section class="panel">
    <div class="filters">
      <select id="mode">
        <option value="daily">รายวัน</option>
        <option value="monthly">รายเดือน</option>
      </select>
      <input id="date" type="date">
      <input id="month" type="month">
      <select id="room">
        <option value="ALL">ทุกห้อง</option>
        <option value="ม.1/1">ม.1/1</option>
        <option value="ม.1/2">ม.1/2</option>
        <option value="ม.1/3">ม.1/3</option>
        <option value="ม.1/4">ม.1/4</option>
        <option value="ม.1/5">ม.1/5</option>
        <option value="ม.1/6">ม.1/6</option>
        <option value="ม.1/7">ม.1/7</option>
        <option value="ม.1/A">ม.1/A</option>
        <option value="ม.1/B">ม.1/B</option>
      </select>
    </div>
    <button id="loadBtn">โหลดสถิติ</button>
    <div id="status" class="status">กดโหลดสถิติเพื่อดูข้อมูล</div>
  </section>

  <section class="cards" id="cards"></section>

  <section class="grid">
    <div class="card">
      <h2>แยกตามประเภท</h2>
      <div id="byType"></div>
    </div>
    <div class="card">
      <h2>แยกตามห้อง</h2>
      <div id="byRoom"></div>
    </div>
    <div class="card">
      <h2>นักเรียนที่ต้องติดตาม</h2>
      <div id="topStudents"></div>
    </div>
    <div class="card">
      <h2>รายการล่าสุด</h2>
      <div id="recent"></div>
    </div>
  </section>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzQ8YCMoXcem6E64Eqfdbl-7ogx5mIfVor6kjV5xivy34xSjItMmU56rGVN6KhU-YAgiA/exec";
const $ = id => document.getElementById(id);

function today() { return new Date().toISOString().slice(0,10); }
function month() { return new Date().toISOString().slice(0,7); }
$('date').value = today();
$('month').value = month();

function jsonp(params, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cb = '__m1dd_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = new URL(GAS_URL);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v == null ? '' : String(v)));
    url.searchParams.set('callback', cb);
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(() => {
      if (done) return; done = true; cleanup(); reject(new Error('เชื่อมต่อช้าเกินไป'));
    }, timeoutMs);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = data => { if(done)return; done=true; cleanup(); resolve(data); };
    script.onerror = () => { if(done)return; done=true; cleanup(); reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ')); };
    script.src = url.toString();
    document.body.appendChild(script);
  });
}

function escapeHtml(v) {
  return String(v || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function table(rows, heads) {
  if (!rows.length) return '<div class="status">ยังไม่มีข้อมูล</div>';
  return `<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
async function loadDashboard() {
  $('status').textContent = 'กำลังโหลดข้อมูล...';
  try {
    const res = await jsonp({
      action:'getDashboard',
      mode:$('mode').value,
      date:$('date').value,
      month:$('month').value,
      room:$('room').value
    });
    if(!res.success) throw new Error(res.message || 'โหลดข้อมูลไม่สำเร็จ');
    $('status').textContent = `โหลดสำเร็จ · รวม ${res.total} รายการ`;
    $('cards').innerHTML = `
      <div class="card"><div class="num">${res.total}</div><div class="label">รายการทั้งหมด</div></div>
      <div class="card"><div class="num">${Object.keys(res.byRoom||{}).length}</div><div class="label">จำนวนห้องที่มีข้อมูล</div></div>
      <div class="card"><div class="num">${(res.topStudents||[]).length}</div><div class="label">นักเรียนที่มีรายการ</div></div>
      <div class="card"><div class="num">${res.mode === 'daily' ? 'วัน' : 'เดือน'}</div><div class="label">โหมดที่กำลังดู</div></div>
    `;
    const byTypeRows = Object.entries(res.byType||{}).map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${v}</td></tr>`);
    $('byType').innerHTML = table(byTypeRows, ['ประเภท','จำนวน']);
    const byRoomRows = Object.entries(res.byRoom||{}).sort().map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${v}</td></tr>`);
    $('byRoom').innerHTML = table(byRoomRows, ['ห้อง','จำนวน']);
    const topRows = (res.topStudents||[]).map(s=>`<tr><td>${escapeHtml(s.fullName)}</td><td>${escapeHtml(s.room)}</td><td>${s.count}</td></tr>`);
    $('topStudents').innerHTML = table(topRows, ['ชื่อ','ห้อง','จำนวน']);
    const recentRows = (res.recentRecords||[]).map(r=>`<tr><td>${escapeHtml(r.time)}</td><td>${escapeHtml(r.fullName)}</td><td>${escapeHtml(r.behaviorType)}</td></tr>`);
    $('recent').innerHTML = table(recentRows, ['เวลา','ชื่อ','ประเภท']);
  } catch(e) {
    $('status').textContent = e.message;
  }
}
$('loadBtn').addEventListener('click', loadDashboard);
$('mode').addEventListener('change', () => {
  $('date').style.display = $('mode').value === 'daily' ? '' : 'none';
  $('month').style.display = $('mode').value === 'monthly' ? '' : 'none';
});
$('mode').dispatchEvent(new Event('change'));
if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {}); }
if ('caches' in window) { caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {}); }
loadDashboard();
</script>
</body>
</html>
