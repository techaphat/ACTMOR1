<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>M1 DD Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--pink:#ff8fbc;--pink-dark:#f05b93;--ink:#3f3b52;--muted:#7b7890;--line:rgba(143,132,170,.18);--card:#fff;--shadow:0 16px 40px rgba(96,79,122,.14)}*{box-sizing:border-box;font-family:'Sarabun',sans-serif}body{margin:0;min-height:100dvh;color:var(--ink);background:linear-gradient(135deg,#fff7ec,#eef8ff)}.wrap{width:min(1100px,100%);margin:0 auto;padding:18px}.hero{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(28px,5vw,42px);font-weight:900}.sub{color:var(--muted);font-weight:800}.btn{border:0;border-radius:16px;min-height:46px;padding:10px 14px;font-weight:900;cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-primary{background:linear-gradient(135deg,var(--pink-dark),var(--pink));color:#fff;border:0}.controls{margin:14px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 12px 28px rgba(96,79,122,.10);border-radius:24px;padding:16px}.stat{font-size:38px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.muted{color:var(--muted);font-weight:800}.bar{height:12px;border-radius:99px;background:#ffe4f0;overflow:hidden}.fill{height:100%;background:linear-gradient(135deg,var(--pink-dark),var(--pink));width:0%}.loading{position:fixed;inset:0;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);display:none;place-items:center}.loading.show{display:grid}.loading>div{background:#fff;border-radius:24px;padding:22px 28px;box-shadow:var(--shadow);font-weight:900}.spin{width:26px;height:26px;border:4px solid #ffd2e4;border-top-color:var(--pink-dark);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}select,input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:800;background:#fff;color:var(--ink)}@media(max-width:820px){.controls,.grid{grid-template-columns:1fr}.wrap{padding:10px}.hero{border-radius:22px}}
</style></head><body><div class="wrap"><div class="hero"><div><h1>📊 M1 DD</h1><div class="sub">Dashboard สถิติพฤติกรรมนักเรียน ม.1</div></div><div><button class="btn" onclick="location.href='index.html'">🏠 กลับหน้าบันทึก</button><button class="btn btn-primary" onclick="loadDash()">🔄 โหลดข้อมูล</button></div></div><div class="controls"><select id="mode"><option value="daily">รายวัน</option><option value="monthly" selected>รายเดือน</option></select><input id="date" type="date"><input id="month" type="month"><select id="room"><option value="ALL">ทุกห้อง</option><option>ม.1/1</option><option>ม.1/2</option><option>ม.1/3</option><option>ม.1/4</option><option>ม.1/5</option><option>ม.1/6</option><option>ม.1/7</option><option>ม.1/8</option><option>ม.1/9</option><option>ม.1/10</option><option>ม.1/A</option><option>ม.1/B</option></select></div><div class="grid"><div class="card"><div class="muted">จำนวนรายการ</div><div class="stat" id="total">-</div></div><div class="card"><div class="muted">โหมดที่ดู</div><div class="stat" id="modeText">-</div></div><div class="card"><div class="muted">ห้อง</div><div class="stat" id="roomText">-</div></div></div><div class="grid" style="margin-top:12px"><div class="card"><h2>📌 ประเภทพฤติกรรม</h2><div id="types" class="list"></div></div><div class="card"><h2>🏫 สรุปตามห้อง</h2><div id="rooms" class="list"></div></div><div class="card"><h2>🔥 นักเรียนที่ต้องติดตาม</h2><div id="top" class="list"></div></div></div><div class="card" style="margin-top:12px"><h2>🕘 รายการล่าสุด</h2><div id="recent" class="list"></div></div></div><div class="loading" id="loading"><div><div class="spin"></div>กำลังดึงข้อมูล...</div></div><script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzQ8YCMoXcem6E64Eqfdbl-7ogx5mIfVor6kjV5xivy34xSjItMmU56rGVN6KhU-YAgiA/exec';let seq=0;function $(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function jsonp(params,timeout=12000){return new Promise((resolve,reject)=>{const cb='m1dd_cb_'+Date.now()+'_'+(++seq);const u=new URL(GAS_URL);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('callback',cb);const sc=document.createElement('script');let done=false;const to=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('เชื่อมต่อช้าเกินไป'))},timeout);function clean(){clearTimeout(to);delete window[cb];sc.remove()}window[cb]=d=>{if(done)return;done=true;clean();resolve(d)};sc.onerror=()=>{if(done)return;done=true;clean();reject(new Error('โหลดข้อมูลไม่ได้'))};sc.src=u.toString();document.body.appendChild(sc)})}function today(){return new Date().toISOString().slice(0,10)}function month(){return new Date().toISOString().slice(0,7)}$('date').value=today();$('month').value=month();$('mode').onchange=()=>loadDash();$('room').onchange=()=>loadDash();async function loadDash(){$('loading').classList.add('show');try{const res=await jsonp({action:'getDashboard',mode:$('mode').value,date:$('date').value,month:$('month').value,room:$('room').value});if(!res.success)throw new Error(res.message||'ไม่สำเร็จ');render(res)}catch(e){alert('โหลด Dashboard ไม่ได้: '+e.message)}finally{$('loading').classList.remove('show')}}function render(d){$('total').textContent=d.total||0;$('modeText').textContent=d.mode==='daily'?'รายวัน':'รายเดือน';$('roomText').textContent=d.room==='ALL'?'ทุกห้อง':d.room;renderMap('types',d.byType||{});renderMap('rooms',d.byRoom||{});$('top').innerHTML=(d.topStudents||[]).length?(d.topStudents||[]).map(s=>`<div class="item"><b>${esc(s.fullName)}</b><div class="muted">${esc(s.room)} เลขที่ ${esc(s.number)} • ${s.count} ครั้ง</div></div>`).join(''):'<div class="muted">ไม่มีข้อมูล</div>';$('recent').innerHTML=(d.recentRecords||[]).length?(d.recentRecords||[]).map(r=>`<div class="item"><b>${esc(r.behaviorType)}</b> — ${esc(r.fullName)}<div class="muted">${esc(r.date)} ${esc(r.time)} • ${esc(r.room)} เลขที่ ${esc(r.number)}</div>${r.note?`<div>${esc(r.note)}</div>`:''}</div>`).join(''):'<div class="muted">ไม่มีข้อมูล</div>'}function renderMap(id,map){const max=Math.max(1,...Object.values(map).map(Number));$(''+id).innerHTML=Object.keys(map).length?Object.entries(map).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><div class="muted">${v} รายการ</div><div class="bar"><div class="fill" style="width:${Math.round((v/max)*100)}%"></div></div></div>`).join(''):'<div class="muted">ไม่มีข้อมูล</div>'}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}if(window.caches){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});}loadDash();</script></body></html>
